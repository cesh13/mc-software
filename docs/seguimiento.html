","group":"IVA","num":"7","title":"Tasa de IVA","text":"\u003cstrong>Tasa de IVA.\u003c/strong> Vive en un archivo de memoria global (\u003ccode>IVA.MEM\u003c/code>) y, además, hay un \u003ccode>0.13\u003c/code> escrito en los archivos F987 que ignora la tasa configurada. \u003cem>Propuesta:\u003c/em> tasa por empresa con vigencia por fecha en \u003ccode>tax_settings\u003c/code>; todos los cálculos y archivos la leen de ahí. ¿Algún cliente usa una tasa distinta (zona franca, régimen especial)?","proposal":"tasa por empresa con vigencia por fecha en \u003ccode>tax_settings\u003c/code>; todos los cálculos y archivos la leen de ahí. ¿Algún cliente usa una tasa distinta (zona franca, régimen especial)?","who":"","section":"B. Tasas, umbrales y cálculos","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P4"],"id":"IVA 8","group":"IVA","num":"8","title":"IVA percibido en compras usa la tasa de retención","text":"\u003cstrong>IVA percibido en compras usa la tasa de retención\u003c/strong> (\u003ccode>cfg_ivare\u003c/code>), mientras que en ventas usa la de percepción (\u003ccode>cfg_ivape\u003c/code>). \u003cem>Propuesta:\u003c/em> usar la tasa de percepción en ambos casos (corregir el error). Confirmar con el contador qué tasa aplica a cada caso.","proposal":"usar la tasa de percepción en ambos casos (corregir el error). Confirmar con el contador qué tasa aplica a cada caso.","who":"","section":"B. Tasas, umbrales y cálculos","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P5"],"id":"IVA 9","group":"IVA","num":"9","title":"Bases mínimas","text":"\u003cstrong>Bases mínimas.\u003c/strong> El código percibe en ventas solo si la base es mayor de 100, no tiene base mínima para retener en compras, y separa consumidor final por 200 en los F987. \u003cem>Propuesta:\u003c/em> los tres valores pasan a configuración por empresa con vigencia; confirmar los montos y la comparación (mayor / mayor o igual) contra la norma.","proposal":"los tres valores pasan a configuración por empresa con vigencia; confirmar los montos y la comparación (mayor / mayor o igual) contra la norma.","who":"","section":"B. Tasas, umbrales y cálculos","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"IVA 10","group":"IVA","num":"10","title":"Renta retenida","text":"\u003cstrong>Renta retenida.\u003c/strong> La tasa es 10 % escrita en el código (editable por documento), y en excluidos se calcula sin redondeo. \u003cem>Propuesta:\u003c/em> tabla de códigos de ingreso con su tasa (\u003ccode>tax_income_codes\u003c/code>), redondeo a 2 decimales; el monto sigue siendo editable con motivo auditado.","proposal":"tabla de códigos de ingreso con su tasa (\u003ccode>tax_income_codes\u003c/code>), redondeo a 2 decimales; el monto sigue siendo editable con motivo auditado.","who":"","section":"B. Tasas, umbrales y cálculos","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P21"],"id":"IVA 11","group":"IVA","num":"11","title":"Redondeo del consumidor final","text":"\u003cstrong>Redondeo del consumidor final.\u003c/strong> El IVA se calcula \u003cstrong>una vez sobre el total del mes\u003c/strong> (\u003ccode>TOTGRA − ROUND(TOTGRA/(1+tasa), 2)\u003c/code>), no por documento. \u003cem>Propuesta:\u003c/em> mantener exactamente esa fórmula para el libro (paridad al centavo); ¿es lo exigido o solo la costumbre?","proposal":"mantener exactamente esa fórmula para el libro (paridad al centavo); ¿es lo exigido o solo la costumbre?","who":"","section":"B. Tasas, umbrales y cálculos","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"IVA 12","group":"IVA","num":"12","title":"Total de la compra","text":"\u003cstrong>Total de la compra.\u003c/strong> Incluye el IVA percibido y los otros impuestos (Cotrans, Fovial, otros) pero no el retenido ni el anticipo; hay un campo \u003ccode>ivarete\u003c/code> que nadie usa. \u003cem>Propuesta:\u003c/em> conservar la fórmula, quitar \u003ccode>ivarete\u003c/code>, y documentar el significado de cada columna en el reporte. ¿Cómo debe tratarse el anticipo a cuenta (hoy solo un dato informativo)?","proposal":"conservar la fórmula, quitar \u003ccode>ivarete\u003c/code>, y documentar el significado de cada columna en el reporte. ¿Cómo debe tratarse el anticipo a cuenta (hoy solo un dato informativo)?","who":"","section":"B. Tasas, umbrales y cálculos","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"IVA 13","group":"IVA","num":"13","title":"Compra frente a gasto","text":"\u003cstrong>Compra frente a gasto.\u003c/strong> La casilla &quot;Es Compra&quot; divide el libro en parciales de compras y de gastos; solo 180 de 19,494 documentos están marcados como compra. \u003cem>Propuesta:\u003c/em> mantener la clasificación y el prefijo \u003ccode>C\u003c/code>/\u003ccode>G\u003c/code>/\u003ccode>R\u003c/code>; ¿el contador necesita estos parciales en el libro legal?","proposal":"mantener la clasificación y el prefijo \u003ccode>C\u003c/code>/\u003ccode>G\u003c/code>/\u003ccode>R\u003c/code>; ¿el contador necesita estos parciales en el libro legal?","who":"","section":"C. Documentos y libros","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"IVA 14","group":"IVA","num":"14","title":"Importaciones, internaciones y servicios","text":"\u003cstrong>Importaciones, internaciones y servicios.\u003c/strong> El anexo de compras tiene columnas para internaciones y servicios importados que la pantalla nunca llena (tampoco existen datos). Un documento es interno \u003cstrong>o\u003c/strong> de importación. \u003cem>Propuesta:\u003c/em> capturar los tres tipos y permitir un documento mixto.","proposal":"capturar los tres tipos y permitir un documento mixto.","who":"","section":"C. Documentos y libros","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"IVA 15","group":"IVA","num":"15","title":"Fecha del documento y mes del libro","text":"\u003cstrong>Fecha del documento y mes del libro.\u003c/strong> Un documento puede registrarse en un mes posterior a su fecha (1,913 compras); nunca anterior. Los libros filtran por mes de registro, pero los anexos de ventas filtran por fecha del documento y el de compras ignora el rango de fechas. \u003cem>Propuesta:\u003c/em> un único criterio: período del libro; el anexo de un mes incluye todo lo registrado en ese período. ¿Cuántos meses hacia atrás se puede registrar un documento (la ley limita el crédito fiscal en el tiempo)?","proposal":"un único criterio: período del libro; el anexo de un mes incluye todo lo registrado en ese período. ¿Cuántos meses hacia atrás se puede registrar un documento (la ley limita el crédito fiscal en el tiempo)?","who":"","section":"C. Documentos y libros","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P27"],"id":"IVA 16","group":"IVA","num":"16","title":"Duplicados","text":"\u003cstrong>Duplicados.\u003c/strong> La unicidad (\u003ccode>fcomp+fregi+ftipo\u003c/code>) no la garantiza la base: hay 167 llaves repetidas en compras y 4 en ventas. \u003cem>Propuesta:\u003c/em> unicidad real en la base; el importador conserva los repetidos con \u003ccode>dedupe_seq\u003c/code> y entrega la lista al contador para decidir. ¿Hay casos legítimos (mismo número de proveedores distintos con el mismo NRC mal digitado)?","proposal":"unicidad real en la base; el importador conserva los repetidos con \u003ccode>dedupe_seq\u003c/code> y entrega la lista al contador para decidir. ¿Hay casos legítimos (mismo número de proveedores distintos con el mismo NRC mal digitado)?","who":"","section":"C. Documentos y libros","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"IVA 17","group":"IVA","num":"17","title":"Qué hace hoy el sistema","text":"\u003cstrong>Qué hace hoy el sistema.\u003c/strong> Solo \u003cstrong>lee\u003c/strong> un archivo JSON de un DTE de tipo \u003ccode>03\u003c/code> (comprobante de crédito fiscal), por búsqueda de texto sin parser, desde las pantallas de compras y de ventas a contribuyentes; copia número de control, código de generación y sello de recepción, la fecha, el NRC del emisor/receptor y los totales (el IVA lo recalcula). Para los demás tipos no hace nada y no avisa. Marca el documento como &quot;Documento Tributario Electrónico&quot;. \u003cem>Propuesta:\u003c/em> parser real y soporte de los tipos que correspondan a cada libro (03, 05, 06, 11, 14, 01 por documento); ¿cuáles hacen falta y de quién se reciben (proveedores, el propio sistema)?","proposal":"parser real y soporte de los tipos que correspondan a cada libro (03, 05, 06, 11, 14, 01 por documento); ¿cuáles hacen falta y de quién se reciben (proveedores, el propio sistema)?","who":"","section":"D. Facturación electrónica (DTE)","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P3"],"id":"IVA 18","group":"IVA","num":"18","title":"Emisión","text":"\u003cstrong>Emisión.\u003c/strong> IVA64 \u003cstrong>no emite, firma ni transmite\u003c/strong> DTE. La emisión vive en \u003ccode>INV64\u003c/code> (tabla \u003ccode>FELECTRO\u003c/code>: 35,944 documentos —tipos 03, 05, 01, 11, 14 y 06— con más de 120 columnas, incluidos número de control, código de generación y sello de recepción); IVA64 copia esos tres campos al transferir ventas. No se encontró manejo de eventos (invalidación) ni de contingencia. \u003cem>Propuesta:\u003c/em> \u003ccode>tax\u003c/code> recibe del módulo de facturación un documento con sus identificadores DTE (y su estado: aceptado, invalidado) y no los captura; ¿la emisión será del módulo de facturación de la plataforma nueva o seguirá en \u003ccode>INV64\u003c/code>?","proposal":"\u003ccode>tax\u003c/code> recibe del módulo de facturación un documento con sus identificadores DTE (y su estado: aceptado, invalidado) y no los captura; ¿la emisión será del módulo de facturación de la plataforma nueva o seguirá en \u003ccode>INV64\u003c/code>?","who":"","section":"D. Facturación electrónica (DTE)","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"IVA 19","group":"IVA","num":"19","title":"Consumidor final con DTE","text":"\u003cstrong>Consumidor final con DTE.\u003c/strong> Con DTE cada venta tiene su propio documento, pero el libro y el anexo de consumidor final son un \u003cstrong>resumen diario por rango\u003c/strong>, y el anexo usa &quot;N/A&quot; en resolución y serie y toma el primero y el último control/código del rango. \u003cem>Propuesta:\u003c/em> guardar el documento individual (si el módulo de facturación lo entrega) y generar el resumen diario como vista; ¿el anexo ya exige detalle por documento? Además el anexo de crédito fiscal elige un único formato (DTE o anterior) por archivo según el primer renglón: en un mes mixto sale mal. \u003cem>Propuesta:\u003c/em> decidir el formato \u003cstrong>por renglón\u003c/strong>.","proposal":"guardar el documento individual (si el módulo de facturación lo entrega) y generar el resumen diario como vista; ¿el anexo ya exige detalle por documento? Además el anexo de crédito fiscal elige un único formato (DTE o anterior) por archivo según el primer renglón: en un mes mixto sale mal. \u003cem>Propuesta:\u003c/em> decidir el formato \u003cstrong>por renglón\u003c/strong>.","who":"","section":"D. Facturación electrónica (DTE)","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P30"],"id":"IVA 20","group":"IVA","num":"20","title":"F987 (v1, v2, v3)","text":"\u003cstrong>F987 (v1, v2, v3).\u003c/strong> Tres versiones conviven en el menú; la v1 escribe texto de ancho fijo con IVA recalculado al 13 %, la v2 y v3 Excel. \u003cem>Propuesta:\u003c/em> no migrar v1 ni v2; migrar la v3 solo si el informe sigue vigente; ¿alguien usa F987 hoy?","proposal":"no migrar v1 ni v2; migrar la v3 solo si el informe sigue vigente; ¿alguien usa F987 hoy?","who":"","section":"E. Archivos y formatos para Hacienda","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P30"],"id":"IVA 21","group":"IVA","num":"21","title":"COA (texto de ancho fijo) y F930 v1","text":"\u003cstrong>COA (texto de ancho fijo) y F930 v1.\u003c/strong> Formatos antiguos de texto en centavos con ceros. El menú &quot;COA&quot; ni siquiera tiene permiso en la copia. \u003cem>Propuesta:\u003c/em> migrar F930 v2 (Excel); COA y F930 v1 solo si un cliente los exige.","proposal":"migrar F930 v2 (Excel); COA y F930 v1 solo si un cliente los exige.","who":"","section":"E. Archivos y formatos para Hacienda","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"IVA 22","group":"IVA","num":"22","title":"Formato actual de los anexos","text":"\u003cstrong>Formato actual de los anexos.\u003c/strong> El sistema genera \u003ccode>.XLS\u003c/code>, no CSV ni el formato de presentación en línea; las columnas son las que figuran en \u003ca href=\"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/business-rules.md\" target=\"_blank\" rel=\"noopener\">business-rules.md\u003c/a> §13. \u003cem>Propuesta:\u003c/em> producir CSV (separador y codificación según el instructivo vigente) y Excel; el negocio entrega un ejemplo aceptado por Hacienda para comparar columna a columna.","proposal":"producir CSV (separador y codificación según el instructivo vigente) y Excel; el negocio entrega un ejemplo aceptado por Hacienda para comparar columna a columna.","who":"","section":"E. Archivos y formatos para Hacienda","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"IVA 23","group":"IVA","num":"23","title":"Códigos fijos","text":"\u003cstrong>Códigos fijos.\u003c/strong> Tipo de documento (\u003ccode>03\u003c/code>, \u003ccode>05\u003c/code>, \u003ccode>06\u003c/code>, \u003ccode>01\u003c/code>, \u003ccode>11\u003c/code>, \u003ccode>12\u003c/code>, \u003ccode>07\u003c/code>), tipo de operación \u003ccode>1\u003c/code>, tipo de ingreso \u003ccode>3\u003c/code>, calificación/modalidad/documento del F930 (\u003ccode>1/1/1\u003c/code>, \u003ccode>2/1/1\u003c/code>, \u003ccode>1/3/3\u003c/code>, \u003ccode>2/3/3\u003c/code>, \u003ccode>2/2/2\u003c/code>), clase de documento (1 o 4), tipo de identificación \u003ccode>2\u003c/code> en excluidos. \u003cem>Propuesta:\u003c/em> tablas de catálogo (\u003ccode>tax_document_types.annex_document_code\u003c/code> y similares) llenadas con el instructivo vigente.","proposal":"tablas de catálogo (\u003ccode>tax_document_types.annex_document_code\u003c/code> y similares) llenadas con el instructivo vigente.","who":"","section":"E. Archivos y formatos para Hacienda","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"IVA 24","group":"IVA","num":"24","title":"Detalles de los anexos","text":"\u003cstrong>Detalles de los anexos.\u003c/strong> (a) El anexo de consumidor final \u003cstrong>omite\u003c/strong> las notas \u003ccode>A1\u003c/code>/\u003ccode>A3\u003c/code>. (b) El anexo de excluidos exporta \u003ccode>ivaexcl\u003c/code> pero no \u003ccode>renexcl\u003c/code> (la renta). (c) Las notas de crédito de compras salen en positivo en el anexo y en negativo en el libro. (d) Las exportaciones salen de CxC y no de \u003ccode>ivafac\u003c/code>. (e) Si el tercero no tiene NIT ni DUI se usa el NRC. \u003cem>Propuesta:\u003c/em> confirmar cada punto con el contador antes de reproducirlo o corregirlo.","proposal":"confirmar cada punto con el contador antes de reproducirlo o corregirlo.","who":"","section":"E. Archivos y formatos para Hacienda","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":["Fase 3"],"id":"IVA 25","group":"IVA","num":"25","title":"Folios y legalización","text":"\u003cstrong>Folios y legalización.\u003c/strong> Los libros tienen opciones &quot;Imprimir Fecha y No. de Página&quot; y firmas (nombre y cargo) pero no hay control de folios ni hoja legalizada. \u003cem>Propuesta:\u003c/em> hojas numeradas por libro/año con el último folio impreso guardado; ¿hay requisito de papel o basta el PDF?","proposal":"hojas numeradas por libro/año con el último folio impreso guardado; ¿hay requisito de papel o basta el PDF?","who":"","section":"F. Cierre y folios","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P7"],"id":"IVA 26","group":"IVA","num":"26","title":"Cierre y corrección posterior","text":"\u003cstrong>Cierre y corrección posterior.\u003c/strong> El cierre es un marcador por fila, comprobado solo en la primera, y nunca se usó en esta copia. ¿Qué pasa cuando hay que corregir un mes ya presentado? \u003cem>Propuesta:\u003c/em> estados \u003ccode>open → closed → filed\u003c/code>; las correcciones se registran como ajuste en el período abierto con referencia al documento original.","proposal":"estados \u003ccode>open → closed → filed\u003c/code>; las correcciones se registran como ajuste en el período abierto con referencia al documento original.","who":"","section":"F. Cierre y folios","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P7"],"id":"IVA 27","group":"IVA","num":"27","title":"Quién puede abrir un mes cerrado","text":"\u003cstrong>Quién puede abrir un mes cerrado.\u003c/strong> \u003cem>Propuesta:\u003c/em> solo Supervisor, con motivo y bitácora (hoy cualquiera con permiso a la pantalla).","proposal":"solo Supervisor, con motivo y bitácora (hoy cualquiera con permiso a la pantalla).","who":"","section":"F. Cierre y folios","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P27"],"id":"IVA 28","group":"IVA","num":"28","title":"Terceros faltantes","text":"\u003cstrong>Terceros faltantes.\u003c/strong> 166 compras y 27 ventas apuntan a un NRC que no existe en los maestros, y 2,395 ventas a contribuyentes no tienen NRC. \u003cem>Propuesta:\u003c/em> crear el tercero con el nombre del documento y dejarlo para revisión; ¿los 2,395 son consumidores finales mal clasificados, notas o errores?","proposal":"crear el tercero con el nombre del documento y dejarlo para revisión; ¿los 2,395 son consumidores finales mal clasificados, notas o errores?","who":"","section":"G. Datos y migración","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P27"],"id":"IVA 29","group":"IVA","num":"29","title":"Totales que no cuadran","text":"\u003cstrong>Totales que no cuadran.\u003c/strong> 63 compras tienen un total distinto de la suma de sus componentes; 151 compras y 136 ventas tienen un IVA distinto de base × tasa. \u003cem>Propuesta:\u003c/em> conservar el dato original y reportar; ¿el IVA del documento fiscal es siempre el correcto?","proposal":"conservar el dato original y reportar; ¿el IVA del documento fiscal es siempre el correcto?","who":"","section":"G. Datos y migración","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"IVA 30","group":"IVA","num":"30","title":"Transferencias pasadas","text":"\u003cstrong>Transferencias pasadas.\u003c/strong> La bitácora registra 41 transferencias de compras pero no queda ninguna fila transferida. ¿De dónde salen entonces las compras (captura, JSON, CSV)? \u003cem>Propuesta:\u003c/em> importarlas como manuales.","proposal":"importarlas como manuales.","who":"","section":"G. Datos y migración","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"IVA 31","group":"IVA","num":"31","title":"Correlativo de renta","text":"\u003cstrong>Correlativo de renta.\u003c/strong> La tabla \u003ccode>CORREN\u003c/code> no está en la copia (y \u003ccode>RENTAT\u003c/code> tiene 3 filas). ¿Se usa el control de renta? \u003cem>Propuesta:\u003c/em> arrancar la numeración del mayor existente + 1; si no se usa, dejar la pantalla para después.","proposal":"arrancar la numeración del mayor existente + 1; si no se usa, dejar la pantalla para después.","who":"","section":"G. Datos y migración","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"IVA 32","group":"IVA","num":"32","title":"Combos con valor \u003ccode>0\u003c/code>","text":"\u003cstrong>Combos con valor \u003ccode>0\u003c/code>.\u003c/strong> Tipo de operación, clasificación, sector y tipo de costo/gasto tienen ~420 filas con \u003ccode>0\u003c/code> además de las vacías, y los índices guardados (1, 2, …) no son los códigos de la declaración. \u003cem>Propuesta:\u003c/em> tabla de equivalencias confirmada por el contador.","proposal":"tabla de equivalencias confirmada por el contador.","who":"","section":"G. Datos y migración","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"IVA 33","group":"IVA","num":"33","title":"\u003ccode>TIPOC\u003c/code> de proveedores/clientes","text":"\u003cstrong>\u003ccode>TIPOC\u003c/code> de proveedores/clientes\u003c/strong> (0 y 1; &quot;Nacional/Extranjero&quot;): ¿qué número es cada uno? \u003cem>Propuesta:\u003c/em> 1 = nacional, 0 = extranjero, a confirmar.","proposal":"1 = nacional, 0 = extranjero, a confirmar.","who":"","section":"G. Datos y migración","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"IVA 34","group":"IVA","num":"34","title":"Más datos","text":"\u003cstrong>Más datos.\u003c/strong> Solo hay una empresa. Repetir el análisis con otros clientes (otros regímenes: empresa no gran contribuyente, con varias sucursales \u003ccode>SUCURSAL\u003c/code>, con inventario y sin él), y revisar \u003ccode>dbf/DBF.rar\u003c/code> de CONTAC.","proposal":"","who":"","section":"G. Datos y migración","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"IVA 35","group":"IVA","num":"35","title":"Rutas y copias","text":"\u003cstrong>Rutas y copias.\u003c/strong> \u003ccode>INTEGRAP\u003c/code> apunta a \u003ccode>\\MC\\CONTAC\\DBF\u003c/code>, que ya no existe, y no hay forma de saber qué copia de CxC/CxP alimentó cada transferencia. \u003cem>Propuesta:\u003c/em> el importador recibe las rutas por parámetro y no ejecuta transferencias.","proposal":"el importador recibe las rutas por parámetro y no ejecuta transferencias.","who":"","section":"G. Datos y migración","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"IVA 36","group":"IVA","num":"36","title":"Cargas CSV históricas","text":"\u003cstrong>Cargas CSV históricas.\u003c/strong> El importador de consumidor final del sistema anterior tiene el defecto \u003ccode>fcomp2 = documentoi\u003c/code>. \u003cem>Propuesta:\u003c/em> no repetirlo; ofrecer un importador genérico con vista previa y validaciones.","proposal":"no repetirlo; ofrecer un importador genérico con vista previa y validaciones.","who":"","section":"G. Datos y migración","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P9"],"id":"IVA 37","group":"IVA","num":"37","title":"Permisos por pantalla","text":"\u003cstrong>Permisos por pantalla.\u003c/strong> El legado usa \u003ccode>PERFIL\u003c/code> por usuario y pantalla (\u003ccode>usrlvl\u003c/code> 1–4 y \u003ccode>usrtype\u003c/code>); la plataforma tiene tres permisos (\u003ccode>capture\u003c/code>, \u003ccode>reports\u003c/code>, \u003ccode>supervise\u003c/code>). \u003cem>Propuesta:\u003c/em> captura de libros → \u003ccode>capture\u003c/code>; libros y archivos de Hacienda → \u003ccode>reports\u003c/code>; configuración de tasas, cierre/apertura de mes y cambio de NRC/NIT → \u003ccode>supervise\u003c/code>.","proposal":"captura de libros → \u003ccode>capture\u003c/code>; libros y archivos de Hacienda → \u003ccode>reports\u003c/code>; configuración de tasas, cierre/apertura de mes y cambio de NRC/NIT → \u003ccode>supervise\u003c/code>.","who":"","section":"H. Permisos","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P9"],"id":"IVA 38","group":"IVA","num":"38","title":"Cambio masivo de NRC/NIT","text":"\u003cstrong>Cambio masivo de NRC/NIT.\u003c/strong> Hoy reemplaza en todos los documentos, también en meses cerrados. \u003cem>Propuesta:\u003c/em> operación auditada, solo \u003ccode>supervise\u003c/code>, que no toca documentos de períodos cerrados o presentados (los reemplaza por una nota en el tercero).","proposal":"operación auditada, solo \u003ccode>supervise\u003c/code>, que no toca documentos de períodos cerrados o presentados (los reemplaza por una nota en el tercero).","who":"","section":"H. Permisos","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"CXC 1","group":"CXC","num":"1","title":"¿Quién factura?","text":"\u003cstrong>¿Quién factura?\u003c/strong> La factura con líneas de producto nace en inventario y escribe la fila \u003ccode>C0\u003c/code> en cartera (99.9 % de las facturas del disco). La pantalla &quot;Creación de Facturas/comprobantes&quot; de CxC es una captura manual del encabezado (38 facturas con su concepto). \u003cem>Propuesta:\u003c/em> la factura se crea en \u003ccode>inventory\u003c/code> y llega a \u003ccode>accounts-receivable\u003c/code> por API; la captura manual queda como función opcional para empresas sin inventario. ¿Hay clientes que usan CxC sin inventario?","proposal":"la factura se crea en \u003ccode>inventory\u003c/code> y llega a \u003ccode>accounts-receivable\u003c/code> por API; la captura manual queda como función opcional para empresas sin inventario. ¿Hay clientes que usan CxC sin inventario?","who":"","section":"A. Alcance y destino","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P30"],"id":"CXC 2","group":"CXC","num":"2","title":"¿Qué reportes se siguen usando?","text":"\u003cstrong>¿Qué reportes se siguen usando?\u003c/strong> Son 53 opciones de reportes (107 \u003ccode>.frx\u003c/code>). Candidatos a no migrar al inicio: Movimientos por vendedor/resumen, Tabla de cobros por periodo, KPI de creación de clientes, Despachos transportista, Visitas a clientes, el &quot;Cuadro de análisis de cobros&quot;, y las variantes de antigüedad duplicadas. \u003cem>Propuesta:\u003c/em> migrar un motor de antigüedad, estado de cuenta (cliente y matriz), auxiliar y histórico de documentos/cliente/cheque, notas no aplicadas, cheques postfechados, límites de crédito, vencimientos/programación de cobros, corte de caja, ventas y cobros por vendedor; el resto según respuesta.","proposal":"migrar un motor de antigüedad, estado de cuenta (cliente y matriz), auxiliar y histórico de documentos/cliente/cheque, notas no aplicadas, cheques postfechados, límites de crédito, vencimientos/programación de cobros, corte de caja, ventas y cobros por vendedor; el resto según respuesta.","who":"","section":"A. Alcance y destino","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"CXC 3","group":"CXC","num":"3","title":"Tipos sin uso","text":"\u003cstrong>Tipos sin uso:\u003c/strong> \u003ccode>PA\u003c/code> (pago anticipado), \u003ccode>C5\u003c/code>/\u003ccode>CR\u003c/code> (comprobante de retención), \u003ccode>A7\u003c/code>, \u003ccode>A8\u003c/code>, \u003ccode>C6\u003c/code>, \u003ccode>A2\u003c/code> no tienen movimientos. \u003cem>Propuesta:\u003c/em> migrar el catálogo tal cual pero construir pantalla solo para anticipos (pregunta 18), abonos internos (A5, 128 filas) y cargos internos; los demás no.","proposal":"migrar el catálogo tal cual pero construir pantalla solo para anticipos (pregunta 18), abonos internos (A5, 128 filas) y cargos internos; los demás no.","who":"","section":"A. Alcance y destino","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"CXC 4","group":"CXC","num":"4","title":"Logística de reparto","text":"\u003cstrong>Logística de reparto:\u003c/strong> rutas de despacho, rutas de cobro automáticas, transportistas, vehículos, ayudantes (más de 60,000 filas de detalle). \u003cem>Propuesta:\u003c/em> no son cuentas por cobrar; no se migran al primer corte. Si el negocio los necesita van a un módulo de distribución. La \u003cstrong>liquidación\u003c/strong> sí se migra (porque agrupa los recibos de un cobrador). ¿Se sigue usando el despacho como control o ya lo cubre la factura electrónica?","proposal":"no son cuentas por cobrar; no se migran al primer corte. Si el negocio los necesita van a un módulo de distribución. La \u003cstrong>liquidación\u003c/strong> sí se migra (porque agrupa los recibos de un cobrador). ¿Se sigue usando el despacho como control o ya lo cubre la factura electrónica?","who":"","section":"A. Alcance y destino","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":["Fase 4"],"id":"CXC 5","group":"CXC","num":"5","title":"Límite de crédito, &quot;suspendido&quot; y &quot;cliente de contado&quot;","text":"\u003cstrong>Límite de crédito, &quot;suspendido&quot; y &quot;cliente de contado&quot;:\u003c/strong> el sistema viejo no los hace cumplir (solo informa el saldo disponible; solo &quot;inactivo&quot; bloquea, y solo en inventario). \u003cem>Propuesta:\u003c/em> configuración \u003ccode>credit_limit_mode\u003c/code> (ninguno/advertir/bloquear) por empresa, por defecto \u003cem>advertir\u003c/em>; &quot;suspendido&quot; bloquea la facturación a crédito. ¿Se quiere endurecer?","proposal":"configuración \u003ccode>credit_limit_mode\u003c/code> (ninguno/advertir/bloquear) por empresa, por defecto \u003cem>advertir\u003c/em>; &quot;suspendido&quot; bloquea la facturación a crédito. ¿Se quiere endurecer?","who":"","section":"A. Alcance y destino","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P9"],"id":"CXC 6","group":"CXC","num":"6","title":"Cambiar código de cliente, mover documentos entre clientes y cambiar cartera de vendedor","text":"\u003cstrong>Cambiar código de cliente, mover documentos entre clientes y cambiar cartera de vendedor\u003c/strong> hoy recorren varias tablas sin bitácora. \u003cem>Propuesta:\u003c/em> se permiten con permiso \u003ccode>supervise\u003c/code>, bitácora y sin recorrer tablas (el id es estable); mover documentos entre clientes solo si el período está abierto.","proposal":"se permiten con permiso \u003ccode>supervise\u003c/code>, bitácora y sin recorrer tablas (el id es estable); mover documentos entre clientes solo si el período está abierto.","who":"","section":"A. Alcance y destino","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"CXC 7","group":"CXC","num":"7","title":"Comisiones de vendedores","text":"\u003cstrong>Comisiones de vendedores\u003c/strong> (porcentajes por tipo de cobro, ISSS/AFP/renta, recibos de comisión; \u003ccode>COMI2\u003c/code>, \u003ccode>RENTA\u003c/code>, \u003ccode>cfg_*\u003c/code>): parecen copiadas del sistema de planilla. \u003cem>Propuesta:\u003c/em> fuera de CxC; un módulo \u003ccode>commissions\u003c/code> futuro que lea los cobros (el abono guarda \u003ccode>PORCOMI\u003c/code> por fila). ¿Siguen siendo necesarias y quién las calcula hoy?","proposal":"fuera de CxC; un módulo \u003ccode>commissions\u003c/code> futuro que lea los cobros (el abono guarda \u003ccode>PORCOMI\u003c/code> por fila). ¿Siguen siendo necesarias y quién las calcula hoy?","who":"","section":"A. Alcance y destino","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"CXC 8","group":"CXC","num":"8","title":"Presupuestos de ventas y cobros y KPI","text":"\u003cstrong>Presupuestos de ventas y cobros y KPI\u003c/strong> (8 opciones, \u003ccode>PVENDE\u003c/code>, \u003ccode>PCLIENTE\u003c/code>): \u003cem>Propuesta:\u003c/em> no migrar al inicio; importar los datos a una tabla de consulta si el negocio lo pide.","proposal":"no migrar al inicio; importar los datos a una tabla de consulta si el negocio lo pide.","who":"","section":"A. Alcance y destino","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P4"],"id":"CXC 9","group":"CXC","num":"9","title":"Retención de IVA por cliente gran contribuyente (\u003ccode>IVAPER\u003c/code>)","text":"\u003cstrong>Retención de IVA por cliente gran contribuyente (\u003ccode>IVAPER\u003c/code>).\u003c/strong> Una tasa única (\u003ccode>cfg_ivaper\u003c/code>) con monto mínimo (\u003ccode>cfg_mper\u003c/code>) solo aplica a crédito fiscal; en consumidor final el valor se escribe a mano; en la nota de crédito de consumidor final se \u003cstrong>suma\u003c/strong> en vez de restarse; la columna se llama &quot;percibido&quot; pero la pantalla dice &quot;Retención&quot;. \u003cem>Propuesta:\u003c/em> un solo servicio de impuestos con tasa y mínimo configurables, el signo corregido (nota = reverso de la factura), la columna \u003ccode>vat_withheld\u003c/code>, y la regla para empresa gran contribuyente (que percibe) separada de la que retiene el cliente. Confirmar con el contador el tratamiento de las facturas con retención en el libro de IVA.","proposal":"un solo servicio de impuestos con tasa y mínimo configurables, el signo corregido (nota = reverso de la factura), la columna \u003ccode>vat_withheld\u003c/code>, y la regla para empresa gran contribuyente (que percibe) separada de la que retiene el cliente. Confirmar con el contador el tratamiento de las facturas con retención en el libro de IVA.","who":"","section":"B. Documentos, impuestos y numeración","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P21"],"id":"CXC 10","group":"CXC","num":"10","title":"Exportación (\u003ccode>FTICOM = 'E'\u003c/code>)","text":"\u003cstrong>Exportación (\u003ccode>FTICOM = 'E'\u003c/code>).\u003c/strong> La pantalla le calcula IVA al gravado como al crédito fiscal, pero en los datos los 21 documentos de exportación tienen IVA = 0 (18 con gravado &gt; 0 y ninguno con exento): el IVA se pone en cero a mano o lo fija inventario; el libro de IVA las junta con consumidor final. \u003cem>Propuesta:\u003c/em> exportación sin IVA (tasa 0 o todo exento) y destino propio en el libro. ¿Es correcto?","proposal":"exportación sin IVA (tasa 0 o todo exento) y destino propio en el libro. ¿Es correcto?","who":"","section":"B. Documentos, impuestos y numeración","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":["Fase 4"],"id":"CXC 11","group":"CXC","num":"11","title":"Numeración y unicidad","text":"\u003cstrong>Numeración y unicidad.\u003c/strong> Facturas: único por tipo C/F/E + número (no incluye serie ni resolución); notas de crédito A1/A3 comparten secuencia y A6 tiene la suya; los recibos pueden repetirse entre clientes y liquidaciones (799 casos). \u003cem>Propuesta:\u003c/em> factura única por \u003ccode>(empresa, tipo, serie, número)\u003c/code>; el número de recibo lo asigna AR (secuencia por empresa) y el número de la boleta física queda como referencia; ¿se necesita mantener la numeración vieja o que las notas de crédito sigan una secuencia por tipo?","proposal":"factura única por \u003ccode>(empresa, tipo, serie, número)\u003c/code>; el número de recibo lo asigna AR (secuencia por empresa) y el número de la boleta física queda como referencia; ¿se necesita mantener la numeración vieja o que las notas de crédito sigan una secuencia por tipo?","who":"","section":"B. Documentos, impuestos y numeración","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P2"],"id":"CXC 12","group":"CXC","num":"12","title":"Fuente \u003ccode>cxc\u003c/code> en el libro mayor","text":"\u003cstrong>Fuente \u003ccode>cxc\u003c/code> en el libro mayor.\u003c/strong> \u003ccode>GL_ENTRY_SOURCES\u003c/code> solo tiene \u003ccode>manual, bancos, iva, cierre, importado\u003c/code>. \u003cem>Propuesta:\u003c/em> agregar \u003ccode>cxc\u003c/code> (cambio pequeño en \u003ccode>modules/general-ledger\u003c/code> y \u003ccode>packages/shared\u003c/code>), igual que \u003ccode>cxp\u003c/code> en BANCOC (pregunta 21 de ese spec); el GL rechaza editar o anular directamente una partida \u003ccode>cxc\u003c/code>. Además, como los módulos no se importan entre sí, hace falta un \u003cstrong>contrato de posteo compartido\u003c/strong> (en \u003ccode>@accounting/shared\u003c/code>) que usen Bancos, CxP, CxC e IVA.","proposal":"agregar \u003ccode>cxc\u003c/code> (cambio pequeño en \u003ccode>modules/general-ledger\u003c/code> y \u003ccode>packages/shared\u003c/code>), igual que \u003ccode>cxp\u003c/code> en BANCOC (pregunta 21 de ese spec); el GL rechaza editar o anular directamente una partida \u003ccode>cxc\u003c/code>. Además, como los módulos no se importan entre sí, hace falta un \u003cstrong>contrato de posteo compartido\u003c/strong> (en \u003ccode>@accounting/shared\u003c/code>) que usen Bancos, CxP, CxC e IVA.","who":"","section":"B. Documentos, impuestos y numeración","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P26"],"id":"CXC 13","group":"CXC","num":"13","title":"Cuentas contables","text":"\u003cstrong>Cuentas contables.\u003c/strong> Las cuentas de los 16 tipos de movimiento, la cuenta de cada cliente y las de IVA/flete/retención están en archivos de configuración; en la copia de CONTAC que hay en disco la mayoría \u003cstrong>no existe\u003c/strong> en el catálogo (la copia llega a marzo de 2024 y la cartera a octubre de 2026). Además 1,786 de 1,789 clientes comparten la misma cuenta de control. \u003cem>Propuesta:\u003c/em> validar al importar contra el plan de cuentas vigente, una cuenta de control por empresa (\u003ccode>ar_settings.ar_control_account_id\u003c/code>) y cuenta por cliente solo si se pide. \u003cstrong>¿Pueden entregar el libro mayor actualizado (hasta octubre de 2026) para verificar el posteo y la paridad?\u003c/strong>","proposal":"validar al importar contra el plan de cuentas vigente, una cuenta de control por empresa (\u003ccode>ar_settings.ar_control_account_id\u003c/code>) y cuenta por cliente solo si se pide. \u003cstrong>¿Pueden entregar el libro mayor actualizado (hasta octubre de 2026) para verificar el posteo y la paridad?\u003c/strong>","who":"","section":"C. Contabilidad","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P2"],"id":"CXC 14","group":"CXC","num":"14","title":"Historial de partidas","text":"\u003cstrong>Historial de partidas.\u003c/strong> Las 880 partidas del libro de CONTAC que vienen de CxC (concepto &quot;VENTAS DEL…&quot; / &quot;ABONOS DE CLIENTES DEL…&quot;, 2022-02 a 2024-03) no tienen vínculo con los documentos y sus líneas no coinciden con el código actual; la marca \u003ccode>generado\u003c/code> es 0, 1, 9 o vacío. \u003cem>Propuesta:\u003c/em> el importador crea un lote \u003ccode>posted\u003c/code> por partida (por concepto + rango) y marca la partida como \u003ccode>source = 'cxc'\u003c/code> (excepción de migración, igual que Bancos); no se vincula documento por documento. ¿Alguna se editó legítimamente en CONTAC? ¿Se contabilizaron los períodos anteriores a 2022-02 y posteriores a 2024-03 de otra forma?","proposal":"el importador crea un lote \u003ccode>posted\u003c/code> por partida (por concepto + rango) y marca la partida como \u003ccode>source = 'cxc'\u003c/code> (excepción de migración, igual que Bancos); no se vincula documento por documento. ¿Alguna se editó legítimamente en CONTAC? ¿Se contabilizaron los períodos anteriores a 2022-02 y posteriores a 2024-03 de otra forma?","who":"","section":"C. Contabilidad","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P7"],"id":"CXC 15","group":"CXC","num":"15","title":"Cierre de mes","text":"\u003cstrong>Cierre de mes.\u003c/strong> CxC tiene su propio cierre (\u003ccode>CIERREC\u003c/code>, con clave) independiente del cierre contable; \u003cstrong>reabrir no pide clave ni deja rastro\u003c/strong>; el último cierre es abril de 2024 y hay 32,231 movimientos posteriores sin cerrar. \u003cem>Propuesta:\u003c/em> usar el estado del período del GL (\u003ccode>gl_periods\u003c/code>) como única fuente, con un cierre de cartera opcional (\u003ccode>ar_periods\u003c/code>) que solo \u003ccode>supervise\u003c/code> abre/cierra, con motivo y bitácora. ¿Se necesita cerrar cartera antes que contabilidad?","proposal":"usar el estado del período del GL (\u003ccode>gl_periods\u003c/code>) como única fuente, con un cierre de cartera opcional (\u003ccode>ar_periods\u003c/code>) que solo \u003ccode>supervise\u003c/code> abre/cierra, con motivo y bitácora. ¿Se necesita cerrar cartera antes que contabilidad?","who":"","section":"C. Contabilidad","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P1","P6"],"id":"CXC 16","group":"CXC","num":"16","title":"Cómo se contabiliza","text":"\u003cstrong>Cómo se contabiliza.\u003c/strong> Hoy: cinco procesos manuales por lote (rango de fechas), sin marca de lo ya contabilizado y con riesgo de duplicar o dejar huecos; las devoluciones no consideran la retención ni el exento; los abonos internos (A5) nunca se contabilizan. \u003cem>Propuesta:\u003c/em> un lote por rango y tipo con \u003cstrong>items\u003c/strong> que impiden contabilizar dos veces, vista previa editable, y opción \u003cem>una partida por documento\u003c/em> (empresas que lo prefieran); los A5 se contabilizan contra la cuenta que defina el tipo. ¿Con qué frecuencia contabilizan (diario, semanal, mensual)? ¿Quieren una partida por documento?","proposal":"un lote por rango y tipo con \u003cstrong>items\u003c/strong> que impiden contabilizar dos veces, vista previa editable, y opción \u003cem>una partida por documento\u003c/em> (empresas que lo prefieran); los A5 se contabilizan contra la cuenta que defina el tipo. ¿Con qué frecuencia contabilizan (diario, semanal, mensual)? ¿Quieren una partida por documento?","who":"","section":"C. Contabilidad","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"CXC 17","group":"CXC","num":"17","title":"Cuentas del cliente en cada tipo de abono","text":"\u003cstrong>Cuentas del cliente en cada tipo de abono.\u003c/strong> El abono sin fecha de cobro debita la cuenta de caja/bancos del tipo \u003ccode>A0\u003c/code>; el que trae fecha de cobro (cheque postfechado) debita &quot;cheques postfechados&quot;. \u003cem>Propuesta:\u003c/em> mantener ambos roles y que el depósito de Bancos mueva de &quot;cheques postfechados&quot; a la cuenta bancaria. Confirmar con el contador.","proposal":"mantener ambos roles y que el depósito de Bancos mueva de &quot;cheques postfechados&quot; a la cuenta bancaria. Confirmar con el contador.","who":"","section":"C. Contabilidad","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"CXC 18","group":"CXC","num":"18","title":"Pagos anticipados (\u003ccode>PA\u003c/code>)","text":"\u003cstrong>Pagos anticipados (\u003ccode>PA\u003c/code>):\u003c/strong> 0 registros y sin pantalla para aplicarlos. \u003cem>Propuesta:\u003c/em> anticipo = recibo sin aplicaciones (saldo a favor del cliente) que se aplica a facturas; construir cuando algún cliente lo pida.","proposal":"anticipo = recibo sin aplicaciones (saldo a favor del cliente) que se aplica a facturas; construir cuando algún cliente lo pida.","who":"","section":"D. Cobranza, cheques y bancos","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"CXC 19","group":"CXC","num":"19","title":"Cheques postfechados y rechazados","text":"\u003cstrong>Cheques postfechados y rechazados.\u003c/strong> El cheque en poder de la empresa queda como partida \u003ccode>C3\u003c/code> (que sigue sumando en la cartera hasta que se remesa), el rechazo crea un cargo \u003ccode>C2\u003c/code> aparte sin reabrir la factura. 615 postfechados, 1 rechazado en 9 años. \u003cem>Propuesta:\u003c/em> el cheque es un instrumento con estados; el rechazo reabre la deuda ligándola a la factura original; el cliente puede verse con o sin cheques postfechados en el saldo. ¿Los postfechados cuentan como saldo del cliente o como cobrado?","proposal":"el cheque es un instrumento con estados; el rechazo reabre la deuda ligándola a la factura original; el cliente puede verse con o sin cheques postfechados en el saldo. ¿Los postfechados cuentan como saldo del cliente o como cobrado?","who":"","section":"D. Cobranza, cheques y bancos","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"CXC 20","group":"CXC","num":"20","title":"Reportes de &quot;lavado de dinero&quot;","text":"\u003cstrong>Reportes de &quot;lavado de dinero&quot;\u003c/strong> (cobros en efectivo, abonos por periodo): ¿qué umbral y qué formato exige la ley que aplican? \u003cem>Propuesta:\u003c/em> un reporte configurable de cobros en efectivo mayores a un monto, por cliente y rango de fechas.","proposal":"un reporte configurable de cobros en efectivo mayores a un monto, por cliente y rango de fechas.","who":"","section":"D. Cobranza, cheques y bancos","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"CXC 21","group":"CXC","num":"21","title":"Copias de \u003ccode>CCMOV01\u003c/code> y tablas de trabajo en \u003ccode>FUENTE\u003c/code>","text":"\u003cstrong>Copias de \u003ccode>CCMOV01\u003c/code> y tablas de trabajo en \u003ccode>FUENTE\u003c/code>\u003c/strong> (\u003ccode>CAL\u003c/code>, \u003ccode>REVISA\u003c/code>, \u003ccode>LORENA\u003c/code>, \u003ccode>WILDA\u003c/code>, \u003ccode>anti2\u003c/code>, \u003ccode>MOVIMI\u003c/code>, \u003ccode>cobroco2\u003c/code>, \u003ccode>VALIDA\u003c/code>…): parecen respaldos con datos reales. \u003cem>Propuesta:\u003c/em> no migrar; confirmar que no contienen movimientos que no estén en \u003ccode>CCMOV01\u003c/code>.","proposal":"no migrar; confirmar que no contienen movimientos que no estén en \u003ccode>CCMOV01\u003c/code>.","who":"","section":"D. Cobranza, cheques y bancos","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"CXC 22","group":"CXC","num":"22","title":"Campo \u003ccode>BUTTER\u003c/code>","text":"\u003cstrong>Campo \u003ccode>BUTTER\u003c/code>\u003c/strong> (43,946 facturas y 412 cheques marcados; la tabla de comisiones \u003ccode>COMI2\u003c/code> tiene columnas \u003ccode>COBUTTER\u003c/code> y \u003ccode>TOTCOBU\u003c/code> y \u003ccode>PAGOCO.MEM\u003c/code> una variable \u003ccode>COMIBU\u003c/code>, lo que sugiere una línea de producto con comisión propia): ¿qué significa (línea de producto, tipo de comisión)? \u003cem>Propuesta:\u003c/em> migrar como atributo \u003ccode>product_line_flag\u003c/code> hasta que se aclare.","proposal":"migrar como atributo \u003ccode>product_line_flag\u003c/code> hasta que se aclare.","who":"","section":"D. Cobranza, cheques y bancos","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"CXC 23","group":"CXC","num":"23","title":"Recibos repetidos a otro cliente (\u003ccode>cfg_repetir\u003c/code>)","text":"\u003cstrong>Recibos repetidos a otro cliente (\u003ccode>cfg_repetir\u003c/code>).\u003c/strong> Un mismo número de recibo se aplicó a más de un cliente en 799 casos y a varias liquidaciones en 189. \u003cem>Propuesta:\u003c/em> un recibo pertenece a un solo cliente (o a un grupo/matriz explícito); el importador separa los casos.","proposal":"un recibo pertenece a un solo cliente (o a un grupo/matriz explícito); el importador separa los casos.","who":"","section":"D. Cobranza, cheques y bancos","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"CXC 24","group":"CXC","num":"24","title":"Liquidación","text":"\u003cstrong>Liquidación.\u003c/strong> Hoy el efectivo y los cheques no se cuadran contra la remesa (los campos de totales están en cero) y la cuenta bancaria casi nunca se captura (10 de 11,031). \u003cem>Propuesta:\u003c/em> la liquidación exige que efectivo + cheques = remesa depositada, registra la cuenta y genera/vincula el depósito de \u003ccode>banking\u003c/code>. ¿Quién deposita y cómo se concilia hoy?","proposal":"la liquidación exige que efectivo + cheques = remesa depositada, registra la cuenta y genera/vincula el depósito de \u003ccode>banking\u003c/code>. ¿Quién deposita y cómo se concilia hoy?","who":"","section":"D. Cobranza, cheques y bancos","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"CXC 25","group":"CXC","num":"25","title":"Venta de contado","text":"\u003cstrong>Venta de contado.\u003c/strong> Hoy se factura a plazo 0 y luego &quot;Cancelar Ventas de Contado&quot; genera el abono en efectivo por el total. \u003cem>Propuesta:\u003c/em> al emitir una factura de contado, inventario crea el recibo en el mismo acto (con caja y forma de pago); la utilidad queda para corregir históricos. ¿Se cobra siempre en efectivo?","proposal":"al emitir una factura de contado, inventario crea el recibo en el mismo acto (con caja y forma de pago); la utilidad queda para corregir históricos. ¿Se cobra siempre en efectivo?","who":"","section":"D. Cobranza, cheques y bancos","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"CXC 26","group":"CXC","num":"26","title":"Descuentos por pronto pago, intereses y recargos por mora","text":"\u003cstrong>Descuentos por pronto pago, intereses y recargos por mora:\u003c/strong> no existen en el sistema viejo. ¿Se necesitan en la nueva plataforma? \u003cem>Propuesta:\u003c/em> no.","proposal":"no.","who":"","section":"D. Cobranza, cheques y bancos","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P28"],"id":"CXC 27","group":"CXC","num":"27","title":"Base de la antigüedad","text":"\u003cstrong>Base de la antigüedad.\u003c/strong> El reporte principal cuenta los días desde la \u003cstrong>fecha del documento\u003c/strong> (no del vencimiento) y mezcla en el primer tramo lo vigente y lo vencido a menos de 30 días; hay una variante &quot;por días vencidos&quot;. Las notas de crédito sin aplicar restan en el tramo de su fecha. \u003cem>Propuesta:\u003c/em> una sola antigüedad con base elegible (documento o vencimiento) y tramos configurables (por defecto \u003cem>por vencer\u003c/em>, 1–30, 31–60, 61–90, 91–120, 121–150, 151–180, ≥ 181). ¿Qué tramos usan?","proposal":"una sola antigüedad con base elegible (documento o vencimiento) y tramos configurables (por defecto \u003cem>por vencer\u003c/em>, 1–30, 31–60, 61–90, 91–120, 121–150, 151–180, ≥ 181). ¿Qué tramos usan?","who":"","section":"E. Saldos y reportes","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"CXC 28","group":"CXC","num":"28","title":"Estadísticas de pago (\u003ccode>P90\u003c/code>, \u003ccode>DIASP\u003c/code>, \u003ccode>VECESP\u003c/code>)","text":"\u003cstrong>Estadísticas de pago (\u003ccode>P90\u003c/code>, \u003ccode>DIASP\u003c/code>, \u003ccode>VECESP\u003c/code>).\u003c/strong> ¿Se usan para algo más que informar? \u003cem>Propuesta:\u003c/em> calcularlas en el reporte de comportamiento de pago (días promedio, % de facturas pagadas a más de 90 días); no guardarlas.","proposal":"calcularlas en el reporte de comportamiento de pago (días promedio, % de facturas pagadas a más de 90 días); no guardarlas.","who":"","section":"E. Saldos y reportes","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"CXC 29","group":"CXC","num":"29","title":"Saldo del cliente en la ficha","text":"\u003cstrong>Saldo del cliente en la ficha:\u003c/strong> los campos guardados valen cero o están incompletos. \u003cem>Propuesta:\u003c/em> siempre calculado; el estado del crédito (tramos y saldo disponible) se muestra en la ficha.","proposal":"siempre calculado; el estado del crédito (tramos y saldo disponible) se muestra en la ficha.","who":"","section":"E. Saldos y reportes","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P27"],"id":"CXC 30","group":"CXC","num":"30","title":"Datos sucios que hay que limpiar o aceptar","text":"\u003cstrong>Datos sucios que hay que limpiar o aceptar:\u003c/strong> 3 movimientos sin tipo, 12–15 sin fecha, 5 con fecha anterior a 2017, 2 códigos de cliente repetidos, 47 movimientos con cliente inexistente (45 son anulados), 7 notas de crédito aplicadas a facturas que no existen, 9 remesas sin cheque, 8 facturas con sobrepago, 42 facturas cuyo total no cuadra con sus componentes. \u003cem>Propuesta:\u003c/em> importar y reportar; el negocio decide cuáles corregir en el sistema viejo antes de la migración final.","proposal":"importar y reportar; el negocio decide cuáles corregir en el sistema viejo antes de la migración final.","who":"","section":"F. Datos y operación","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"CXC 31","group":"CXC","num":"31","title":"Más clientes","text":"\u003cstrong>Más clientes.\u003c/strong> Solo hay una empresa en disco. Falta revisar si otras instalaciones usan anticipos, cheques postfechados, cierre de cartera, comisiones, multimoneda (CxC no maneja moneda: se asume la de la empresa), cuenta por cliente, etc. \u003cem>Propuesta:\u003c/em> repetir esta revisión por cliente antes de importar.","proposal":"repetir esta revisión por cliente antes de importar.","who":"","section":"F. Datos y operación","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"CXC 32","group":"CXC","num":"32","title":"Reportes impresos para la paridad","text":"\u003cstrong>Reportes impresos para la paridad.\u003c/strong> Hace falta al menos una antigüedad de saldos (\u003ccode>ccranti2\u003c/code>), un estado de cuenta y una &quot;Ventas y Bancos&quot; impresas de un mes cerrado, para comparar contra la nueva plataforma al centavo.","proposal":"","who":"","section":"F. Datos y operación","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"CXC 33","group":"CXC","num":"33","title":"Formatos de impresión","text":"\u003cstrong>Formatos de impresión\u003c/strong> del recibo (\u003ccode>ccrecibo\u003c/code>), nota de crédito (\u003ccode>inrnc02\u003c/code>) y nota de débito (\u003ccode>inrnd01\u003c/code>) por empresa (\u003ccode>EMPRESAS.FORMANC/FORMAND\u003c/code>), la ficha del cliente y los reportes con membrete. \u003cem>Propuesta:\u003c/em> un recibo y notas estándar; levantar los formatos reales con el cliente.","proposal":"un recibo y notas estándar; levantar los formatos reales con el cliente.","who":"","section":"F. Datos y operación","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P3"],"id":"CXC 34","group":"CXC","num":"34","title":"Documentos tributarios electrónicos","text":"\u003cstrong>Documentos tributarios electrónicos.\u003c/strong> Inventario emite y anula el DTE (\u003ccode>FELECTRO\u003c/code>); CxC solo recibe la serie/resolución. \u003cem>Propuesta:\u003c/em> AR guarda el código de generación, número de control y sello por documento y \u003cstrong>recibe de inventario las anulaciones\u003c/strong> (evento), no las reescribe; ¿las notas de crédito/débito electrónicas se emiten desde CxC o desde inventario hoy?","proposal":"AR guarda el código de generación, número de control y sello por documento y \u003cstrong>recibe de inventario las anulaciones\u003c/strong> (evento), no las reescribe; ¿las notas de crédito/débito electrónicas se emiten desde CxC o desde inventario hoy?","who":"","section":"F. Datos y operación","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"CXC 35","group":"CXC","num":"35","title":"Clasificación del cliente (\u003ccode>FTIPC\u003c/code> A/B/C/…)","text":"\u003cstrong>Clasificación del cliente (\u003ccode>FTIPC\u003c/code> A/B/C/…)\u003c/strong>, \u003ccode>TIPOCLI\u003c/code>, \u003ccode>TCLIENTE\u003c/code> (I/P), lista de precios y \u003ccode>DESCUENTO\u003c/code>: ¿qué significan hoy y quién los usa? \u003cem>Propuesta:\u003c/em> migrar como atributos; la lista de precios y el descuento pertenecen a inventario.","proposal":"migrar como atributos; la lista de precios y el descuento pertenecen a inventario.","who":"","section":"F. Datos y operación","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P9"],"id":"CXC 36","group":"CXC","num":"36","title":"Permisos y bitácora","text":"\u003cstrong>Permisos y bitácora.\u003c/strong> Hoy cinco banderas por pantalla (abrir, agregar, modificar, eliminar, anular) y el nivel de usuario 1 para algunas acciones; la bitácora existe pero no cubre cierres, reapertura, cambios masivos ni la contabilización. \u003cem>Propuesta:\u003c/em> \u003ccode>capture\u003c/code>/\u003ccode>reports\u003c/code>/\u003ccode>supervise\u003c/code>; \u003ccode>supervise\u003c/code> para anular un documento con recibos, reabrir, contabilizar/anular lotes y cambios masivos; bitácora en todo.","proposal":"\u003ccode>capture\u003c/code>/\u003ccode>reports\u003c/code>/\u003ccode>supervise\u003c/code>; \u003ccode>supervise\u003c/code> para anular un documento con recibos, reabrir, contabilizar/anular lotes y cambios masivos; bitácora en todo.","who":"","section":"F. Datos y operación","status":"abierta","doc":"docs/legacy/cxc64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md"},{"statusNote":"Respondida en \u003ca href=\"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md\" target=\"_blank\" rel=\"noopener\">dte/open-questions.md\u003c/a>: Es \u003ccode>factura-electronica-mc\u003c/code> (.NET, v1.13.3), mantenido por el mismo desarrollador. Es un \u003cstrong>cliente de escritorio Windows\u003c/strong> (x86) por cliente, \u003cstrong>continuo con sondeo cada 60 s\u003c/strong> sobre los DBF (no es servicio). Genera el JSON, firma localmente (JWS), transmite de forma síncrona por documento, escribe 5 campos de vuelta, \u003cstrong>genera PDF, QR y JSON y envía el correo\u003c/strong>. Sí confirma todo lo inferido por inv64 §11.7 excepto «por lotes asíncrono»: el ciclo es por lotes locales pero cada envío es síncrono.","date":"","usedBy":["P3"],"id":"INV 1","group":"INV","num":"1","title":"El programa externo","text":"\u003cstrong>El programa externo.\u003c/strong> El código de INV64 solo \u003cem>prepara\u003c/em> la fila en \u003ccode>FELECTRO\u003c/code>; otro programa firma, transmite y escribe número de control, código de generación y sello (§11.1). ¿Qué programa es, quién lo mantiene, dónde corre, es por lotes o continuo, y con qué proveedor/servicio se conecta? ¿Genera también el PDF, el QR y el correo al cliente? \u003cem>Propuesta:\u003c/em> la nueva plataforma reemplaza ese programa con un módulo \u003ccode>dte\u003c/code> propio (interfaz \u003ccode>DteProvider\u003c/code>); hasta entonces, mantenerlo en paralelo leyendo la nueva tabla.","proposal":"la nueva plataforma reemplaza ese programa con un módulo \u003ccode>dte\u003c/code> propio (interfaz \u003ccode>DteProvider\u003c/code>); hasta entonces, mantenerlo en paralelo leyendo la nueva tabla.","who":"","section":"A. Facturación electrónica (DTE) — prioridad alta","status":"respondida","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"Respondida en \u003ca href=\"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md\" target=\"_blank\" rel=\"noopener\">dte/open-questions.md\u003c/a>: \u003ccode>FELECTRO.AMBIENTE\u003c/code> (vacío) \u003cstrong>se ignora\u003c/strong>: el ambiente es el ajuste \u003ccode>TestEnvironment\u003c/code> de cada instalación (pruebas por defecto). \u003ccode>EMPRESAS.MODOOP\u003c/code> no interviene. \u003cstrong>Sigue sin saberse\u003c/strong> si los 11,690 documentos de producción corresponden al ambiente real: el Monitor guarda \u003ccode>ambiente\u003c/code> por instalación → pedirlo.","date":"","usedBy":["P3"],"id":"INV 2","group":"INV","num":"2","title":"Ambiente y modo","text":"\u003cstrong>Ambiente y modo.\u003c/strong> \u003ccode>FELECTRO.AMBIENTE\u003c/code> y \u003ccode>EMPRESAS.MODOOP\u003c/code> están vacíos en esta copia. ¿Los 11,690 documentos son de producción? ¿Desde cuándo? \u003cem>Propuesta:\u003c/em> tratar todo como producción desde 2024-11 y confirmar con una muestra.","proposal":"tratar todo como producción desde 2024-11 y confirmar con una muestra.","who":"","section":"A. Facturación electrónica (DTE) — prioridad alta","status":"parcial","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"Respondida en \u003ca href=\"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md\" target=\"_blank\" rel=\"noopener\">dte/open-questions.md\u003c/a>: No hay contingencia productiva. Rechazo = \u003ccode>FALLO = 1\u003c/code> sin motivo en el DBF (el motivo solo en su SQLite). Los 68 CCF con \u003ccode>FALLO = 1\u003c/code> y \u003ccode>PROCESADO = 1\u003c/code> coinciden con versiones previas a 1.6.1 (no limpiaban \u003ccode>FALLO\u003c/code> al aceptar) \u003cstrong>[I]\u003c/strong>. Los 13 sin número de control son preparaciones pendientes o fallidas: con \u003ccode>FALLO = 1\u003c/code> no se reintentan solas. Una excepción de red deja el documento pendiente y se reintenta con UUID nuevo.","date":"","usedBy":["Fase 4"],"id":"INV 3","group":"INV","num":"3","title":"Contingencia y reintentos","text":"\u003cstrong>Contingencia y reintentos.\u003c/strong> El código escribe contingencia fija \u003ccode>&quot;null&quot;\u003c/code> y no guarda el motivo de un rechazo. ¿Cómo se maneja hoy un documento rechazado o una caída de Hacienda? ¿Qué significan los 68 CCF con \u003ccode>FALLO = 1\u003c/code> ya procesados y los 13 sin número de control? \u003cem>Propuesta:\u003c/em> estados explícitos y cola de reintentos (\u003ccode>dte_events\u003c/code>); revisar a mano los 13.","proposal":"estados explícitos y cola de reintentos (\u003ccode>dte_events\u003c/code>); revisar a mano los 13.","who":"","section":"A. Facturación electrónica (DTE) — prioridad alta","status":"parcial","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"Respondida en \u003ca href=\"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md\" target=\"_blank\" rel=\"noopener\">dte/open-questions.md\u003c/a>: La solución usa tal cual lo que escribe INV64 (\u003ccode>TIPOANULA\u003c/code>, \u003ccode>MOTIVOANUL\u003c/code>); nunca envía \u003ccode>codigoGeneracionR\u003c/code> (solo es correcto el tipo sin reemplazo); \u003cstrong>no implementa plazos\u003c/strong>; no marca \u003ccode>INVALIDADA\u003c/code>. «Se invalida siempre después de anular localmente» no lo controla la solución.","date":"","usedBy":["Fase 4"],"id":"INV 4","group":"INV","num":"4","title":"Invalidación","text":"\u003cstrong>Invalidación.\u003c/strong> La solicitud usa \u003ccode>tipoanula = 2\u003c/code> fijo y el nombre del usuario como motivo (§11.6). ¿Es correcto o se debería elegir el tipo y el motivo? ¿Se invalida siempre después de anular localmente? \u003cem>Propuesta:\u003c/em> tipo y motivo elegibles y obligatorios; anulación local e invalidación en una sola operación.","proposal":"tipo y motivo elegibles y obligatorios; anulación local e invalidación en una sola operación.","who":"","section":"A. Facturación electrónica (DTE) — prioridad alta","status":"respondida","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"Respondida en \u003ca href=\"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md\" target=\"_blank\" rel=\"noopener\">dte/open-questions.md\u003c/a>: El número de control usa los códigos de \u003cstrong>configuración de la instalación\u003c/strong> (un establecimiento y un punto de venta por instalación); \u003ccode>CODESTABLE\u003c/code>/\u003ccode>CODPUNTOVE\u003c/code> del DBF solo viajan como códigos internos; \u003ccode>CODESTABMH\u003c/code>/\u003ccode>CODPUVENMH\u003c/code> del DBF no se leen.","date":"","usedBy":["Fase 4"],"id":"INV 5","group":"INV","num":"5","title":"Establecimiento y punto de venta","text":"\u003cstrong>Establecimiento y punto de venta.\u003c/strong> Los códigos de establecimiento y de punto de venta son \u003cstrong>literales fijos en el programa\u003c/strong>. ¿Hay más de una sucursal o caja? \u003cem>Propuesta:\u003c/em> tablas \u003ccode>dte_establishments\u003c/code> y serie por punto de venta.","proposal":"tablas \u003ccode>dte_establishments\u003c/code> y serie por punto de venta.","who":"","section":"A. Facturación electrónica (DTE) — prioridad alta","status":"respondida","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":["Fase 4"],"id":"INV 6","group":"INV","num":"6","title":"Factura consumidor final ya transmitida","text":"\u003cstrong>Factura consumidor final ya transmitida.\u003c/strong> \u003ccode>inmfac03\u003c/code> permite modificar un documento con DTE (solo el botón de enviar lo impide) (§9.1). ¿Es intencional? \u003cem>Propuesta:\u003c/em> documento emitido inmutable.","proposal":"documento emitido inmutable.","who":"","section":"A. Facturación electrónica (DTE) — prioridad alta","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"Respondida en \u003ca href=\"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md\" target=\"_blank\" rel=\"noopener\">dte/open-questions.md\u003c/a>: v1: la versión sale de \u003ccode>FELECTRO.VERSION\u003c/code> (el ERP: 1 ó 3). v2: fija por tipo (01→2, 03→4, 05/06→4, 11→3, 14→2). Invalidación: v3 fija para todos; la \u003ccode>&quot;02&quot;\u003c/code> de \u003ccode>FANULAR\u003c/code> se ignora. \u003cstrong>(norma)\u003c/strong> contrastar.","date":"","usedBy":[],"id":"INV 7","group":"INV","num":"7","title":"Versión de los esquemas","text":"\u003cstrong>Versión de los esquemas.\u003c/strong> \u003ccode>CORRE.VERSION\u003c/code> usa 1 para factura/exportación/sujeto excluido y 3 para CCF/notas, y las invalidaciones usan \u003ccode>&quot;02&quot;\u003c/code> fija. Contrastar con la \u003cstrong>norma y los esquemas vigentes\u003c/strong> antes de implementar; este spec no afirma ninguna regla de memoria.","proposal":"","who":"","section":"A. Facturación electrónica (DTE) — prioridad alta","status":"respondida","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"Respondida en \u003ca href=\"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md\" target=\"_blank\" rel=\"noopener\">dte/open-questions.md\u003c/a>: Solo existe una rama en el camino v1 (y su PDF); no migrada a v2. El ERP no emite tipo 04.","date":"","usedBy":[],"id":"INV 8","group":"INV","num":"8","title":"Remisión y otros tipos","text":"\u003cstrong>Remisión y otros tipos.\u003c/strong> \u003ccode>inmpedi\u003c/code> intenta un DTE de remisión (tipo \u003ccode>R\u003c/code>) que no existe en \u003ccode>CORRE\u003c/code>. ¿Se emite remisión? \u003cem>Propuesta:\u003c/em> no migrar.","proposal":"no migrar.","who":"","section":"A. Facturación electrónica (DTE) — prioridad alta","status":"respondida","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"Respondida en \u003ca href=\"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md\" target=\"_blank\" rel=\"noopener\">dte/open-questions.md\u003c/a>: \u003cstrong>No\u003c/strong> forman parte de esta solución: solo emite; no recibe ni lee JSON de proveedores. Sigue pendiente en la plataforma nueva.","date":"","usedBy":[],"id":"INV 9","group":"INV","num":"9","title":"Compras recibidas por DTE","text":"\u003cstrong>Compras recibidas por DTE.\u003c/strong> &quot;Leer json&quot; solo acepta el tipo 03 y extrae campos buscando texto. ¿Se reciben otros tipos (notas de crédito de proveedor, exportación)? \u003cem>Propuesta:\u003c/em> analizador JSON real y validación del esquema.","proposal":"analizador JSON real y validación del esquema.","who":"","section":"A. Facturación electrónica (DTE) — prioridad alta","status":"parcial","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"Respondida en \u003ca href=\"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md\" target=\"_blank\" rel=\"noopener\">dte/open-questions.md\u003c/a>: La solución genera los PDF (una plantilla por tipo, ticket para CCF/consumidor final) con QR; diseño por cliente. La plataforma debe definir su propia plantilla.","date":"","usedBy":[],"id":"INV 10","group":"INV","num":"10","title":"Papel y PDF","text":"\u003cstrong>Papel y PDF.\u003c/strong> ¿Los formatos de impresión de CCF y consumidor final (\u003ccode>CCF\u003c/code>, \u003ccode>inrfac01/02\u003c/code>, \u003ccode>inrticke2\u003c/code>) siguen siendo necesa
