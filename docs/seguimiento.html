,"proposal":"","who":"","section":"D. Para la plataforma nueva","status":"respondida","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 31","group":"DTE","num":"31","title":"Histórico","text":"\u003cstrong>Histórico:\u003c/strong> ¿cuántos años de documentos se migran, y los PDF se copian o se regeneran? \u003cem>Propuesta:\u003c/em> migrar todo lo emitido en producción desde el inicio del DTE; copiar los PDF existentes (no regenerar: el PDF debe reproducir el original).","proposal":"migrar todo lo emitido en producción desde el inicio del DTE; copiar los PDF existentes (no regenerar: el PDF debe reproducir el original).","who":"","section":"D. Para la plataforma nueva","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 32","group":"DTE","num":"32","title":"Pendientes de lectura de este spec","text":"\u003cstrong>Pendientes de lectura de este spec:\u003c/strong> \u003ccode>DteBuilderV1\u003c/code>/cuerpo de línea (tributos por línea), plantillas PDF, telemetría y Estadísticas, CI, \u003ccode>tasks/prd-*.md\u003c/code>.","proposal":"","who":"","section":"D. Para la plataforma nueva","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 33","group":"DTE","num":"33","title":"¿Quién hace la certificación en el ambiente de pruebas de Hacienda por cliente?","text":"\u003cstrong>¿Quién hace la certificación en el ambiente de pruebas de Hacienda por cliente?\u003c/strong> El módulo nativo debe ser aceptado por tipo de documento antes del piloto 2; cada cliente tiene su propio certificado y credenciales. \u003cem>Propuesta:\u003c/em> la certifica el equipo de la plataforma una vez por tipo con una empresa de prueba, y por cliente solo se hace una corrida corta de verificación con sus credenciales.","proposal":"la certifica el equipo de la plataforma una vez por tipo con una empresa de prueba, y por cliente solo se hace una corrida corta de verificación con sus credenciales.","who":"","section":"E. Nuevas por la decisión de DTE nativo (2026-11-12)","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 34","group":"DTE","num":"34","title":"¿De dónde salen el certificado y las credenciales de cada cliente al migrar?","text":"\u003cstrong>¿De dónde salen el certificado y las credenciales de cada cliente al migrar?\u003c/strong> No se migran como datos (§5). \u003cem>Propuesta:\u003c/em> el operador los carga al almacén de secretos de la plataforma en el corte, desde el certificado original del cliente (no desde \u003ccode>settings.json\u003c/code>), y se verifica con una firma de prueba.","proposal":"el operador los carga al almacén de secretos de la plataforma en el corte, desde el certificado original del cliente (no desde \u003ccode>settings.json\u003c/code>), y se verifica con una firma de prueba.","who":"","section":"E. Nuevas por la decisión de DTE nativo (2026-11-12)","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 35","group":"DTE","num":"35","title":"¿El servidor de cada cliente tiene Internet confiable?","text":"\u003cstrong>¿El servidor de cada cliente tiene Internet confiable?\u003c/strong> La emisión es lo único que lo necesita. \u003cem>Propuesta:\u003c/em> inventariarlo en la fase de preparación del cliente (Monitor, pregunta 1) y exigir un enlace mínimo; sin él, el cliente opera en cola y contingencia.","proposal":"inventariarlo en la fase de preparación del cliente (Monitor, pregunta 1) y exigir un enlace mínimo; sin él, el cliente opera en cola y contingencia.","who":"","section":"E. Nuevas por la decisión de DTE nativo (2026-11-12)","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 36","group":"DTE","num":"36","title":"Contingencia y plazos de invalidación en la norma vigente","text":"\u003cstrong>Contingencia y plazos de invalidación en la norma vigente:\u003c/strong> la solución de referencia no los implementa. \u003cem>Propuesta:\u003c/em> leer la norma y los esquemas vigentes antes de construir; mientras tanto, plazos y tipos como datos en \u003ccode>dte_settings\u003c/code>, no en el código.","proposal":"leer la norma y los esquemas vigentes antes de construir; mientras tanto, plazos y tipos como datos en \u003ccode>dte_settings\u003c/code>, no en el código.","who":"","section":"E. Nuevas por la decisión de DTE nativo (2026-11-12)","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 37","group":"DTE","num":"37","title":"Fecha de la normativa v2 (2026-12-01 según el repositorio)","text":"\u003cstrong>Fecha de la normativa v2 (2026-12-01 según el repositorio):\u003c/strong> el módulo nativo debe nacer en la normativa vigente cuando esté listo. \u003cem>Propuesta:\u003c/em> verificar la fecha y construir solo la normativa que rija en producción; las diferencias v1/v2 se estudian desde los constructores de la solución.","proposal":"verificar la fecha y construir solo la normativa que rija en producción; las diferencias v1/v2 se estudian desde los constructores de la solución.","who":"","section":"E. Nuevas por la decisión de DTE nativo (2026-11-12)","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 38","group":"DTE","num":"38","title":"Corte por empresa y serie","text":"\u003cstrong>Corte por empresa y serie:\u003c/strong> ¿cuál es el último número de control usado por cada serie, y quién verifica que la solución .NET dejó de emitir? \u003cem>Propuesta:\u003c/em> el importador lo lee de \u003ccode>FELECTRO\u003c/code>/\u003ccode>EnviosDTE\u003c/code> y se confirma con el último documento aceptado en Hacienda antes de habilitar la emisión nativa.","proposal":"el importador lo lee de \u003ccode>FELECTRO\u003c/code>/\u003ccode>EnviosDTE\u003c/code> y se confirma con el último documento aceptado en Hacienda antes de habilitar la emisión nativa.","who":"","section":"E. Nuevas por la decisión de DTE nativo (2026-11-12)","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 39","group":"DTE","num":"39","title":"¿Se contabiliza la venta al grabar o al aceptarse el DTE, y se reutiliza el número de un documento rechazado?","text":"\u003cstrong>¿Se contabiliza la venta al grabar o al aceptarse el DTE, y se reutiliza el número de un documento rechazado?\u003c/strong> Ver contratos §6.10. \u003cem>Propuesta:\u003c/em> contabilizar al grabar (reverso si se descarta) y no reutilizar números.","proposal":"contabilizar al grabar (reverso si se descarta) y no reutilizar números.","who":"","section":"E. Nuevas por la decisión de DTE nativo (2026-11-12)","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"}],"gather":[{"id":"C1","title":"Una copia completa de un solo cliente, de la misma fecha, de todos los módulos","text":"Hoy cada módulo en disco es de un cliente y una fecha distintos; sin esto no se puede comprobar que los reportes cuadren entre módulos. (Bloqueos; \u003ca href=\"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md\" target=\"_blank\" rel=\"noopener\">LOTE 2\u003c/a>, \u003ca href=\"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md\" target=\"_blank\" rel=\"noopener\">INV 51\u003c/a>)","status":"por conseguir","note":"","date":"","plain":"- una copia completa de un solo cliente, de la misma fecha, de todos los módulos. hoy cada módulo en disco es de un cliente y una fecha distintos; sin esto no se puede comprobar que los reportes cuadren entre módulos. (bloqueos; lote 2, inv 51)"},{"id":"C2","title":"El libro mayor al día","text":"(el de disco termina en 2024-03 y las cobranzas llegan a 2026-10): para verificar cómo se contabiliza y comparar al centavo. (\u003ca href=\"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/cxc64/open-questions.md\" target=\"_blank\" rel=\"noopener\">CXC 13\u003c/a>)","status":"por conseguir","note":"","date":"","plain":"- el libro mayor al día (el de disco termina en 2024-03 y las cobranzas llegan a 2026-10): para verificar cómo se contabiliza y comparar al centavo. (cxc 13)"},{"id":"C3","title":"Copias de al menos un cliente más","text":", idealmente con varias empresas: todo lo revisado viene de una sola empresa por módulo. (\u003ca href=\"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md\" target=\"_blank\" rel=\"noopener\">BAN th":"docs/web-guide.md","title":"Guía para construir pantallas","area":"docs","kind":"md","state":"","stateText":"","date":"2026-11-15","dirty":false,"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/web-guide.md"}],"changelog":[{"version":"0.5.1","date":"2026-11-20","items":["La impresión Legal de partidas muestra la estructura del catálogo: cada cuenta bajo sus cuentas de mayor, como en el sistema anterior.","Las fechas se escriben y se muestran siempre como dd/mm/aaaa, sin importar la configuración regional de Windows; el mes de &quot;Copiar&quot; se elige con mes y año en español."]},{"version":"0.5.0","date":"2026-11-19","items":["Se agregaron formatos de impresión de partidas en la vista previa: Legal, Preliminar y ½ carta.","Se agregó la opción &quot;Incluir concepto&quot; al imprimir partidas: oculta solo el concepto general; el detalle de cada línea siempre se imprime.","El Balance General se imprime como en el sistema anterior: formato Cuenta (Activo junto a Pasivo y Capital) o Reporte, sin códigos, con columna de parciales, Utilidad del ejercicio y doble raya en totales.","Se agregó la opción de saldos Acumulados o Mensuales en el Balance General, que por defecto muestra hasta el nivel 3.","Se agregaron las firmas y cargos al pie del Balance General (hasta tres, guardadas por empresa) y la opción de imprimir la hora y fecha."]},{"version":"0.4.0","date":"2026-11-18","items":["Se agregó una vista previa al imprimir: el botón Imprimir (o F9) muestra en pantalla la hoja tal como saldrá impresa, con los botones Imprimir (F9) y Cerrar (Esc), en lugar de mandar directo a la impresora."]},{"version":"0.3.1","date":"2026-11-17","items":["Se amplió el campo Detalle en Elaboración de partidas: la columna es más ancha y el texto largo se muestra completo en varias líneas en lugar de cortarse."]},{"version":"0.3.0","date":"2026-11-16","items":["Se agregó la pantalla Migración (Administración, solo el Propietario): revisa la carpeta del sistema anterior (módulos, tablas, fechas de los datos), prueba la importación de Contabilidad y de clientes y proveedores en una copia sin tocar la base real, y permite decidir cada hallazgo. Las pruebas quedan en un historial.","Actualiza la base de datos al iniciar (respaldar la carpeta de datos antes)."]},{"version":"0.2.0","date":"2026-11-15","items":["Se agregaron permisos por opción y acción: cada pantalla y botón se muestra según los permisos del usuario, y en Usuarios se puede conceder o negar cada permiso, para todas las empresas o una.","Se agregó la Bitácora (Administración) con filtros y exportación a CSV.","Se agregó la ficha fiscal de cada empresa (NIT, NRC, giro, dirección y demás datos).","Abrir un mes cerrado ahora pide un motivo, que queda en la bitácora.","El estado de los meses pasa a un registro común para todos los módulos; los meses cerrados se conservan.","Se agregó el maestro de clientes y proveedores (sin pantalla todavía) y la base para que los próximos módulos (Bancos, Cuentas por pagar) contabilicen sus documentos.","Actualiza la base de datos al iniciar (respaldar la carpeta de datos antes)."]},{"version":"0.1.1","date":"2026-11-13","items":["Versión de prueba para verificar la actualización automática. Sin cambios funcionales."]},{"version":"0.1.0","date":"2026-11-13","items":["Primera versión instalable para prueba interna: contabilidad (catálogo de cuentas, partidas, cierre de mes, cierre anual y reportes), usuarios y empresas.","Modo servidor y modo cliente, con actualización automática desde el feed."]}],"commits":[{"hash":"5180192","date":"2026-11-20","subject":"Bump version to 0.5.1 and update changelog","href":"https://github.com/cesh13/mc-software/commit/5180192"},{"hash":"befb15b","date":"2026-11-20","subject":"Show dates as dd/mm/aaaa regardless of the Windows region","href":"https://github.com/cesh13/mc-software/commit/befb15b"},{"hash":"281e2d8","date":"2026-11-20","subject":"Show the catalog structure in the Legal ent 0a2aa7"},{"hash":"e1ffb3e","date":"2026-11-15","subject":"Move month state to shared core_periods behind the periods contract","href":"https://github.com/cesh13/mc-software/commit/e1ffb3e"},{"hash":"cb5accb","date":"2026-11-15","subject":"Filter web menus, buttons and screens by fine permissions and add per-user permission editor","href":"https://github.com/cesh13/mc-software/commit/cb5accb"},{"hash":"467c7d7","date":"2026-11-15","subject":"Add service registry and per-empresa module activation","href":"https://github.com/cesh13/mc-software/commit/467c7d7"},{"hash":"9564556","date":"2026-11-15","subject":"Keep the closing entry in the trial balance by default","href":"https://github.com/cesh13/mc-software/commit/9564556"},{"hash":"08bfb55","date":"2026-11-15","subject":"Merge branch 'worktree-agent-aa9ed68cf87ac223b'","href":"https://github.com/cesh13/mc-software/commit/08bfb55"},{"hash":"a00e832","date":"2026-11-15","subject":"Enforce fine permissions on every route and add permission overrides","href":"https://github.com/cesh13/mc-software/commit/a00e832"},{"hash":"39255ce","date":"2026-11-15","subject":"Import month status from the first entry of the month, add includeClosing to reports, reword SALDOS parity","href":"https://github.com/cesh13/mc-software/commit/39255ce"},{"hash":"e91a1b3","date":"2026-11-15","subject":"Add fine-grained permission catalog and overrides evaluator","href":"https://github.com/cesh13/mc-software/commit/e91a1b3"},{"hash":"b11c811","date":"2026-11-13","subject":"Add Phase 0 design: permissions, activation, contract adjustments and build plan","href":"https://github.com/cesh13/mc-software/commit/b11c811"},{"hash":"d488b7a","date":"2026-11-13","subject":"Verify CONTAC spec against legacy source and apply spec corrections","href":"https://github.com/cesh13/mc-software/commit/d488b7a"},{"hash":"d4348aa","date":"2026-11-12","subject":"Update report with next steps after the first installable release","href":"https://github.com/cesh13/mc-software/commit/d4348aa"},{"hash":"e86048d","date":"2026-11-12","subject":"Bump version to 0.1.1 and update changelog","href":"https://github.com/cesh13/mc-software/commit/e86048d"},{"hash":"9b3a5ff","date":"2026-11-12","subject":"Add ship-mc-update release skill","href":"https://github.com/cesh13/mc-software/commit/9b3a5ff"}],"sources":{"seguimiento":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/seguimiento.md","preguntas":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/PREGUNTAS.md","modulos":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/sistema/modulos-y-orden.md"},"warnings":[]}</script>
<script>
(function () {
  'use strict';
  var D = JSON.parse(document.getElementById('data').textContent);
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var slug = function (s) { return String(s).replace(/\s+/g, '-'); };
  var pill = function (s) { return '<span class="pill st-' + slug(s) + '">' + esc(s) + '</span>'; };
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem('mc-seg:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem('mc-seg:' + k, JSON.stringify(v)); } catch (e) {} }
  };

  // ---- tema ----
  var theme = store.get('theme', null);
  if (theme) document.documentElement.setAttribute('data-theme', theme);
  $('#theme').onclick = function () {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark' ||
      (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    theme = dark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    store.set('theme', theme);
  };

  var Q = {}; D.questions.forEach(function (q) { Q[q.id] = q; });
  var legacyName = {}; D.legacy.forEach(function (l) { legacyName[l.prefix] = l.name; });
  var groupName = function (g) { return g === 'P' ? 'Prioritarias (P1–P30)' : g === 'M' ? 'Diseño (M1–M3)' : (legacyName[g] || g); };
  var openQ = function (id) { var q = Q[id]; return q && q.status !== 'respondida'; };
  var qchip = function (id) {
    var q = Q[id];
    if (!q) return '<span class="chip">' + esc(id) + '</span>';
    var c = q.status === 'respondida' ? 'done' : q.status === 'parcial' ? 'part' : 'open';
    return '<span class="chip ' + c + '" data-q="' + esc(id) + '" title="' + esc(q.status) + '">' + esc(id) + '</span>';
  };

  // ---- meta ----
  var gen = new Date(D.generated);
  $('#meta').innerHTML = [
    D.version ? 'Versión <b>' + esc(D.version) + '</b>' : '',
    D.branch ? esc(D.branch) + (D.head ? ' @ <code>' + esc(D.head) + '</code>' : '') : '',
    'Generado ' + gen.toLocaleString('es', { dateStyle: 'medium', timeStyle: 'short' })
  ].filter(Boolean).map(function (x) { return '<span>' + x + '</span>'; }).join('');
  $('#foot').innerHTML = 'Generado por <code>scripts/tracker/build.mts</code> desde los documentos del repositorio. ' +
    'Para cambiar un estado, edite el documento o <a href="' + esc(D.sources.seguimiento) + '" target="_blank" rel="noopener">docs/seguimiento.md</a> y corra <code>pnpm tracker</code>.';

  // ---- pestañas ----
  var nQopen = D.questions.filter(function (q) { return q.status !== 'respondida'; }).length;
  var nGather = D.gather.filter(function (g) { return g.status !== 'conseguido'; }).length;
  var TABS = [
    ['resumen', 'Resumen', ''],
    ['tablero', 'Tablero', D.cards.filter(function (c) { return c.status !== 'hecho' && c.status !== 'retirado'; }).length],
    ['preguntas', 'Preguntas', nQopen],
    ['conseguir', 'Por conseguir', nGather],
    ['documentos', 'Documentos', D.docs.length],
    ['avance', 'Avance', '']
  ];
  $('#tabs').innerHTML = TABS.map(function (t) {
    return '<button role="tab" data-tab="' + t[0] + '">' + t[1] + (t[2] !== '' ? '<span class="n">' + t[2] + '</span>' : '') + '</button>';
  }).join('');
  var rendered = {};
  function show(tab, arg) {
    if (!document.getElementById('v-' + tab)) tab = 'resumen';
    TABS.forEach(function (t) {
      $('#v-' + t[0]).classList.toggle('on', t[0] === tab);
      $('[data-tab="' + t[0] + '"]').setAttribute('aria-selected', t[0] === tab);
    });
    if (!rendered[tab]) { VIEWS[tab](); rendered[tab] = true; }
    if (tab === 'preguntas') focusQ(arg);
    store.set('tab', tab);
  }
  // Navegación: actualiza el hash (enlaces compartibles) pero no depende de hashchange,
  // que no siempre se dispara (vista previa, archivo embebido).
  function go(h) {
    try { history.pushState(null, '', '#' + h); } catch (e) {}
    route(h);
  }
  function route(h) {
    var p = decodeURIComponent(typeof h === 'string' ? h : location.hash.slice(1)).split('/');
    show(p[0] || store.get('tab', 'resumen'), p[1]);
  }
  window.addEventListener('popstate', function () { route(); });
  $('#tabs').onclick = function (e) {
    var b = e.target.closest('[data-tab]'); if (b) go(b.dataset.tab);
  };
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[href^="#"]');
    if (a) { e.preventDefault(); go(a.getAttribute('href').slice(1)); return; }
    var c = e.target.closest('[data-q]');
    if (c) { e.preventDefault(); go('preguntas/' + encodeURIComponent(c.dataset.q)); return; }
    var g = e.target.closest('[data-go]');
    if (g) { e.preventDefault(); go(g.dataset.go); }
  });

  // ---- vistas ----
  var VIEWS = {};

  VIEWS.resumen = function () {
    var steps = D.cards.filter(function (c) { return c.kind === 'paso'; });
    var stepsDone = steps.filter(function (c) { return c.status === 'hecho'; }).length;
    var mods = D.modules.filter(function (m) { return m.status !== 'retirado'; });
    var modsDone = mods.filter(function (m) { return m.status === 'hecho'; }).length;
    var P = D.questions.filter(function (q) { return q.group === 'P'; });
    var pAns = P.filter(function (q) { return q.status === 'respondida'; }).length;
    var pPart = P.filter(function (q) { return q.status === 'parcial'; }).length;
    var all = D.questions.length;
    var aAns = D.questions.filter(function (q) { return q.status === 'respondida'; }).length;
    var aPart = D.questions.filter(function (q) { return q.status === 'parcial'; }).length;
    var gDone = D.gather.filter(function (g) { return g.status === 'conseguido'; }).length;
    var cur = D.phases.find(function (p) { return p.status === 'en curso'; }) || D.phases.find(function (p) { return p.status === 'pendiente'; });

    function bar(parts, total) {
      return '<div class="bar">' + parts.map(function (p) { return '<i style="width:' + (total ? 100 * p[0] / total : 0) + '%;background:var(' + p[1] + ')"></i>'; }).join('') + '</div>';
    }
    function kpi(go, v, l, b) { return '<div class="kpi" data-go="' + go + '"><div class="v">' + v + '</div><div class="l">' + l + '</div>' + (b || '') + '</div>'; }

    var h = '';
    if (D.warnings.length) h += '<div class="warn"><b>Avisos al generar</b> (revise docs/seguimiento.md o el documento indicado):<ul>' +
      D.warnings.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul></div>';
    h += '<div class="kpis">' +
      kpi('tablero', cur ? 'Fase ' + esc(cur.num) : '—', cur ? esc(cur.name) + ' · ' + esc(cur.status) : 'Sin fase en curso') +
      kpi('tablero', stepsDone + '<span class="muted" style="font-size:15px">/' + steps.length + '</span>', 'Pasos de la fase 0 hechos' + (D.fase0.tests ? ' · ' + esc(D.fase0.tests) + ' pruebas' : ''),
        bar([[stepsDone, '--s-done'], [steps.filter(function (c) { return c.status === 'en curso'; }).length, '--s-run']], steps.length)) +
      kpi('tablero', modsDone + '<span class="muted" style="font-size:15px">/' + mods.length + '</span>', 'Módulos hechos', bar([[modsDone, '--s-done'], [mods.filter(function (m) { return m.status === 'en curso'; }).length, '--s-run']], mods.length)) +
      kpi('preguntas', (P.length - pAns) + '<span class="muted" style="font-size:15px">/' + P.length + '</span>', 'Preguntas prioritarias sin cerrar', bar([[pAns, '--s-done'], [pPart, '--s-part']], P.length)) +
      kpi('preguntas', (all - aAns), 'Preguntas abiertas en total (de ' + all + ')', bar([[aAns, '--s-done'], [aPart, '--s-part']], all)) +
      kpi('conseguir', (D.gather.length - gDone) + '<span class="muted" style="font-size:15px">/' + D.gather.length + '</span>', 'Datos y archivos por conseguir', bar([[gDone, '--s-done']], D.gather.length)) +
      '</div>';

    h += '<h2>Fases</h2><div class="phases">' + D.phases.map(function (p) {
      var open = p.needs.filter(openQ);
      var mods = D.modules.filter(function (m) { return m.phase === p.num; });
      return '<div class="phase' + (cur && cur.num === p.num ? ' cur' : '') + '">' +
        '<div class="tag">Fase ' + esc(p.num) + '</div><div class="t">' + esc(p.name) + '</div>' + pill(p.status) +
        '<div class="mods">' + mods.map(function (m) { return '<span class="chip" title="' + esc(m.status) + '" style="color:var(--' + ({ hecho: 's-done', 'en curso': 's-run', bloqueado: 's-block' }[m.status] || 'ink') + ')">' + esc(m.id) + '</span>'; }).join('') + '</div>' +
        (p.needs.length ? '<div class="muted" style="font-size:12.5px">Necesita: ' + (open.length ? open.length + ' de ' + p.needs.length + ' preguntas sin cerrar' : 'preguntas cerradas') + '</div>' +
          '<div class="mods">' + p.needs.map(qchip).join('') + '</div>' : '') +
        '</div>';
    }).join('') + '</div>';

    var next = D.cards.filter(function (c) { return c.status === 'en curso' || c.status === 'bloqueado' || (c.kind === 'tarea' && c.status === 'pendiente'); });
    h += '<h2>En curso y por hacer</h2><div class="next">' + (next.length ? next.map(function (c) {
      return '<div class="li"><div>' + pill(c.status) + '</div><div><span class="tag">' + ({ paso: 'Paso F0', modulo: 'Módulo', tarea: 'Tarea' }[c.kind]) + '</span> <span class="ti">' + c.title + '</span><div class="tx">' + c.detail + '</div></div></div>';
    }).join('') : '<div class="empty">Nada en curso.</div>') + '</div>';

    var latest = D.changelog[0];
    if (latest) h += '<h2>Última versión: ' + esc(latest.version) + ' <span class="muted" style="font-weight:400">· ' + esc(latest.date) + '</span></h2><div class="rel"><ul>' +
      latest.items.map(function (i) { return '<li>' + i + '</li>'; }).join('') + '</ul></div>';
    $('#v-resumen').innerHTML = h;
  };

  VIEWS.tablero = function () {
    var f = store.get('board', { kind: 'todo', phase: '' });
    var phases = D.phases.map(function (p) { return '<option value="' + esc(p.num) + '">Fase ' + esc(p.num) + ' · ' + esc(p.name) + '</option>'; }).join('');
    $('#v-tablero').innerHTML = '<div class="toolbar"><div class="seg" id="bk">' +
      [['todo', 'Todo'], ['paso', 'Pasos fase 0'], ['modulo', 'Módulos'], ['tarea', 'Tareas']].map(function (k) { return '<button data-k="' + k[0] + '">' + k[1] + '</button>'; }).join('') +
      '</div><select id="bp"><option value="">Todas las fases</option>' + phases + '</select><span class="count" id="bc"></span></div><div class="board" id="board"></div>';
    $('#bp').value = f.phase;
    function draw() {
      [].forEach.call(document.querySelectorAll('#bk button'), function (b) { b.classList.toggle('on', b.dataset.k === f.kind); });
      var cards = D.cards.filter(function (c) { return (f.kind === 'todo' || c.kind === f.kind) && (!f.phase || c.phase === f.phase) && c.status !== 'retirado'; });
      $('#bc').textContent = cards.length + ' tarjetas';
      $('#board').innerHTML = ['pendiente', 'en curso', 'bloqueado', 'hecho'].map(function (s) {
        var cs = cards.filter(function (c) { return c.status === s; });
        return '<div class="col"><h3>' + pill(s) + '<span class="muted">' + cs.length + '</span></h3>' + (cs.map(function (c) {
          var open = c.needs.filter(openQ);
          return '<div class="card"><div class="h"><span class="tag">' + ({ paso: 'Paso F0', modulo: 'Módulo', tarea: 'Tarea' }[c.kind]) + (c.phase ? ' · F' + esc(c.phase) : '') + '</span></div>' +
            '<div class="ti">' + c.title + '</div><div class="d">' + c.detail + ' <a href="' + esc(c.href) + '" target="_blank" rel="noopener">documento</a></div>' +
            (c.status !== 'hecho' && open.length ? '<div class="needs"><span class="muted" style="font-size:11.5px">Espera:</span>' + open.slice(0, 8).map(qchip).join('') + (open.length > 8 ? '<span class="muted" style="font-size:11.5px">+' + (open.length - 8) + '</span>' : '') + '</div>' : '') +
            '<button class="more">Detalle</button></div>';
        }).join('') || '<div class="empty">—</div>') + '</div>';
      }).join('');
    }
    $('#bk').onclick = function (e) { var b = e.target.closest('button'); if (!b) return; f.kind = b.dataset.k; store.set('board', f); draw(); };
    $('#bp').onchange = function () { f.phase = this.value; store.set('board', f); draw(); };
    $('#board').onclick = function (e) {
      var m = e.target.closest('.more'); if (!m) return;
      var c = m.closest('.card'); c.classList.toggle('x'); m.textContent = c.classList.contains('x') ? 'Ocultar' : 'Detalle';
    };
    draw();
  };

  var qState = store.get('qf', { text: '', group: '', status: 'sin-cerrar', cited: false });
  var drawQ;
  VIEWS.preguntas = function () {
    var groups = ['P', 'M'].concat(D.legacy.map(function (l) { return l.prefix; }));
    $('#v-preguntas').innerHTML = '<div class="toolbar">' +
      '<input type="search" id="qt" placeholder="Buscar en preguntas y propuestas…" aria-label="Buscar">' +
      '<select id="qg"><option value="">Todos los grupos</option>' + groups.map(function (g) {
        var n = D.questions.filter(function (q) { return q.group === g && q.status !== 'respondida'; }).length;
        return '<option value="' + g + '">' + esc(groupName(g)) + ' (' + n + ')</option>';
      }).join('') + '</select>' +
      '<div class="seg" id="qs">' + [['sin-cerrar', 'Sin cerrar'], ['abierta', 'Abiertas'], ['parcial', 'Parciales'], ['respondida', 'Respondidas'], ['', 'Todas']].map(function (s) { return '<button data-s="' + s[0] + '">' + s[1] + '</button>'; }).join('') + '</div>' +
      '<label class="count"><input type="checkbox" id="qc"> Solo las que frenan una fase</label>' +
      '<span class="count" id="qn"></span></div><div class="qlist" id="ql"></div>';
    $('#qt').value = qState.text; $('#qg').value = qState.group; $('#qc').checked = qState.cited;
    drawQ = function (focus) {
      [].forEach.call(document.querySelectorAll('#qs button'), function (b) { b.classList.toggle('on', b.dataset.s === qState.status); });
      var t = qState.text.toLowerCase().trim();
      var list = D.questions.filter(function (q) {
        if (focus) return q.id === focus || q.refs.indexOf(focus) >= 0 || q.usedBy.indexOf(focus) >= 0;
        if (qState.group && q.group !== qState.group) return false;
        if (qState.status === 'sin-cerrar' ? q.status === 'respondida' : qState.status && q.status !== qState.status) return false;
        if (qState.cited && !q.usedBy.some(function (u) { return /^Fase/.test(u); })) return false;
        if (t && (q.id + ' ' + q.title + ' ' + q.text + ' ' + q.proposal + ' ' + q.who).toLowerCase().replace(/<[^>]+>/g, '').indexOf(t) < 0) return false;
        return true;
      });
      $('#qn').innerHTML = focus ? 'Mostrando ' + esc(focus) + ' y relacionadas · <a href="#preguntas" id="qclear">ver todas</a>' : list.length + ' preguntas';
      var h = '', last = null;
      list.forEach(function (q) {
        var g = q.group + '|' + q.section;
        if (g !== last) { h += '<div class="qgroup">' + esc(groupName(q.group)) + (q.section && q.group !== 'P' && q.group !== 'M' ? ' · ' + esc(q.section) : '') + '</div>'; last = g; }
        h += '<div class="q" data-id="' + esc(q.id) + '"><div class="row"><span class="id">' + esc(q.id) + '</span>' + pill(q.status) + '<span class="ti">' + q.title + '</span><span class="who">' + esc(q.who) + '</span></div>' +
          '<div class="body"><p>' + q.text + '</p>' +
          (q.proposal ? '<p><span class="lbl">Propuesta:</span> ' + q.proposal + '</p>' : '') +
          (q.statusNote || q.date ? '<p><span class="lbl">Estado:</span> ' + esc(q.status) + (q.date ? ' (' + esc(q.date) + ')' : '') + (q.statusNote ? '. ' + q.statusNote : '') + '</p>' : '') +
          '<div class="links">' +
          (q.refs.length ? '<span class="muted">Detalle en:</span> ' + q.refs.map(qchip).join(' ') : '') +
          (q.usedBy.length ? ' <span class="muted">Citada por:</span> ' + q.usedBy.map(function (u) { return /^Fase/.test(u) ? '<span class="chip" data-go="tablero">' + esc(u) + '</span>' : qchip(u); }).join(' ') : '') +
          ' <a href="' + esc(q.href) + '" target="_blank" rel="noopener">abrir documento</a></div></div></div>';
      });
      $('#ql').innerHTML = h || '<div class="empty">Sin preguntas con estos filtros.</div>';
      if (focus) {
        var el = document.querySelector('.q[data-id="' + CSS.escape(focus) + '"]');
        if (el) { el.classList.add('x', 'flash'); el.scrollIntoView({ block: 'center' }); setTimeout(function () { el.classList.remove('flash'); }, 1500); }
      }
    };
    var save = function () { store.set('qf', qState); drawQ(); };
    $('#qt').oninput = function () { qState.text = this.value; save(); };
    $('#qg').onchange = function () { qState.group = this.value; save(); };
    $('#qc').onchange = function () { qState.cited = this.checked; save(); };
    $('#qs').onclick = function (e) { var b = e.target.closest('button'); if (!b) return; qState.status = b.dataset.s; save(); };
    $('#ql').onclick = function (e) {
      if (e.target.closest('a,[data-q],[data-go]')) return;
      var r = e.target.closest('.row'); if (r) r.parentNode.classList.toggle('x');
    };
    drawQ();
  };
  function focusQ(id) { if (drawQ) drawQ(id); }

  VIEWS.conseguir = function () {
    $('#v-conseguir').innerHTML = '<p class="muted" style="margin-top:0">De <a href="' + esc(D.sources.preguntas) + '" target="_blank" rel="noopener">PREGUNTAS.md §2</a>: lo que hay que pedir al negocio para poder comparar y migrar. El estado se marca en docs/seguimiento.md, tabla <i>Por conseguir</i>.</p>' +
      '<div class="list">' + D.gather.map(function (g) {
        return '<div class="li"><div>' + pill(g.status) + (g.date ? '<div class="muted" style="font-size:12px;margin-top:4px">' + esc(g.date) + '</div>' : '') + '</div><div><div class="ti">' + g.title + '</div><div class="tx">' + g.text + '</div>' +
          (g.note ? '<div style="font-size:13px;margin-top:4px">' + g.note + '</div>' : '') + '</div></div>';
      }).join('') + '</div>';
  };

  VIEWS.documentos = function () {
    var f = store.get('df', { text: '', area: '' });
    var areas = []; D.docs.forEach(function (d) { if (areas.indexOf(d.area) < 0) areas.push(d.area); });
    areas.sort();
    $('#v-documentos').innerHTML = '<div class="toolbar"><input type="search" id="dt" placeholder="Buscar documento…" aria-label="Buscar documento"><select id="da"><option value="">Todas las carpetas</option>' +
      areas.map(function (a) { return '<option>' + esc(a) + '</option>'; }).join('') + '</select><span class="count" id="dn"></span></div>' +
      '<table class="docs"><thead><tr><th>Documento</th><th class="area">Carpeta</th><th class="st">Estado</th><th>Último cambio</th></tr></thead><tbody id="db"></tbody></table>';
    $('#dt').value = f.text; $('#da').value = f.area;
    function draw() {
      var t = f.text.toLowerCase();
      var list = D.docs.filter(function (d) { return (!f.area || d.area === f.area) && (!t || (d.title + ' ' + d.path).toLowerCase().indexOf(t) >= 0); })
        .sort(function (a, b) { return (b.date || '9').localeCompare(a.date || '9') || a.path.localeCompare(b.path); });
      $('#dn').textContent = list.length + ' documentos';
      $('#db').innerHTML = list.map(function (d) {
        return '<tr><td><a href="' + esc(d.href) + '" target="_blank" rel="noopener">' + esc(d.title) + '</a>' + (d.kind === 'tldraw' ? ' <span class="chip">tldraw</span>' : '') +
          '<div class="muted" style="font-size:12px"><code>' + esc(d.path) + '</code></div>' + (d.stateText ? '<div class="muted" style="font-size:12px">' + d.stateText + '</div>' : '') + '</td>' +
          '<td class="area">' + esc(d.area) + '</td><td class="st">' + (d.state ? '<span class="pill st-' + (d.state === 'verificado' ? 'hecho' : d.state === 'propuesta' ? 'en-curso' : 'pendiente') + '">' + esc(d.state) + '</span>' : '') + '</td>' +
          '<td class="date">' + (d.date ? esc(d.date) : '<span class="muted">sin commit</span>') + (d.dirty ? '<div class="dirty">cambios sin commit</div>' : '') + '</td></tr>';
      }).join('');
    }
    $('#dt').oninput = function () { f.text = this.value; store.set('df', f); draw(); };
    $('#da').onchange = function () { f.area = this.value; store.set('df', f); draw(); };
    draw();
  };

  VIEWS.avance = function () {
    $('#v-avance').innerHTML = '<div class="two"><div><h2>Versiones publicadas</h2>' + (D.changelog.map(function (r) {
      return '<div class="rel"><h4>' + esc(r.version) + ' <span class="muted" style="font-weight:400">· ' + esc(r.date) + '</span></h4><ul>' + r.items.map(function (i) { return '<li>' + i + '</li>'; }).join('') + '</ul></div>';
    }).join('') || '<div class="empty">Sin CHANGELOG.md</div>') + '</div><div><h2>Últimos commits</h2><div class="list">' + D.commits.map(function (c) {
      return '<div class="commit"><span class="h">' + (c.href ? '<a href="' + esc(c.href) + '" target="_blank" rel="noopener">' + esc(c.hash) + '</a>' : esc(c.hash)) + '</span><span class="dt">' + esc(c.date) + '</span><span>' + esc(c.subject) + '</span></div>';
    }).join('') + '</div></div></div>';
  };

  route();
})();
</script>
</body>
</html>
