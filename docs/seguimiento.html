rios en esa forma? \u003cem>Propuesta:\u003c/em> plantilla nueva única con QR.","proposal":"plantilla nueva única con QR.","who":"","section":"A. Facturación electrónica (DTE) — prioridad alta","status":"respondida","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P21"],"id":"INV 11","group":"INV","num":"11","title":"IVA incluido vs. exclusivo","text":"\u003cstrong>IVA incluido vs. exclusivo.\u003c/strong> CCF guarda precio sin IVA y consumidor final con IVA incluido; el encabezado recalcula el IVA sobre la base total (centavos de diferencia con la suma de líneas) (§3.4–3.5). ¿Cuál redondeo manda? \u003cem>Propuesta:\u003c/em> por línea y total = suma, o sobre la base; elegir y documentarlo. Contrastar con la regla vigente.","proposal":"por línea y total = suma, o sobre la base; elegir y documentarlo. Contrastar con la regla vigente.","who":"","section":"B. Ventas, precios e impuestos","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P4"],"id":"INV 12","group":"INV","num":"12","title":"Percepción / retención 1 %","text":"\u003cstrong>Percepción / retención 1 %.\u003c/strong> El sistema usa un solo porcentaje (\u003ccode>cfg_perci\u003c/code>) y un monto mínimo (\u003ccode>cfg_grava\u003c/code>) para percepción y retención, y el signo depende de si la empresa es gran contribuyente (§3.6). ¿Son el mismo porcentaje? ¿Cuándo se percibe y cuándo se retiene? Contrastar con la norma.","proposal":"","who":"","section":"B. Ventas, precios e impuestos","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P21"],"id":"INV 13","group":"INV","num":"13","title":"Nota de crédito sobre consumidor final","text":"\u003cstrong>Nota de crédito sobre consumidor final.\u003c/strong> Siempre suma IVA exclusivo, aunque el original sea \u003ccode>F\u003c/code> (§3.5; 8 filas). ¿Es un error? \u003cem>Propuesta:\u003c/em> corregir en el sistema nuevo y marcar las 8 históricas.","proposal":"corregir en el sistema nuevo y marcar las 8 históricas.","who":"","section":"B. Ventas, precios e impuestos","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P10"],"id":"INV 14","group":"INV","num":"14","title":"Reingreso de devoluciones","text":"\u003cstrong>Reingreso de devoluciones.\u003c/strong> Hoy entran al costo promedio \u003cstrong>del día de la nota\u003c/strong>, no al de la venta original (§5.1). ¿Qué quiere el negocio? \u003cem>Propuesta:\u003c/em> al costo de la venta original (por línea), con el promedio actual solo para notas sin referencia.","proposal":"al costo de la venta original (por línea), con el promedio actual solo para notas sin referencia.","who":"","section":"B. Ventas, precios e impuestos","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P10"],"id":"INV 15","group":"INV","num":"15","title":"Validación contra el documento original","text":"\u003cstrong>Validación contra el documento original.\u003c/strong> Las notas de crédito no limitan cantidad ni producto al original (§5.1). ¿Se debe? \u003cem>Propuesta:\u003c/em> sí, con excepción con permiso.","proposal":"sí, con excepción con permiso.","who":"","section":"B. Ventas, precios e impuestos","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"INV 16","group":"INV","num":"16","title":"Crédito y mora","text":"\u003cstrong>Crédito y mora.\u003c/strong> Hoy: advertencia con clave si hay saldo vencido o pago tardío; límite de crédito, &quot;suspendido&quot; y &quot;contado&quot; no se aplican (§3.1; ver cxc64 #5). ¿Política deseada: bloqueo duro, advertencia o aprobación?","proposal":"","who":"","section":"B. Ventas, precios e impuestos","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"INV 17","group":"INV","num":"17","title":"Descuento por documento","text":"\u003cstrong>Descuento por documento.\u003c/strong> \u003ccode>EMPRESAS.DESCUENTOT\u003c/code> cambia cómo se declara el descuento en el DTE (§11.4). ¿Es política de la empresa? ¿Se conserva el descuento por línea?","proposal":"","who":"","section":"B. Ventas, precios e impuestos","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"INV 18","group":"INV","num":"18","title":"Bonificaciones","text":"\u003cstrong>Bonificaciones.\u003c/strong> Salen a costo y se declaran como descuento (§3.3, §11.4); las unidades de regalo en una compra diluyen el costo unitario (§13.5). ¿Se mantiene?","proposal":"","who":"","section":"B. Ventas, precios e impuestos","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"INV 19","group":"INV","num":"19","title":"Listas de precio","text":"\u003cstrong>Listas de precio.\u003c/strong> Nueve listas por producto y \u003ccode>CCCLI01.NPRECIO\u003c/code> por cliente; \u003ccode>PCLIENT\u003c/code> (precios por cliente) no se usa aquí. ¿Se usan las nueve? \u003cem>Propuesta:\u003c/em> listas con vigencia.","proposal":"listas con vigencia.","who":"","section":"B. Ventas, precios e impuestos","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"INV 20","group":"INV","num":"20","title":"Nota de débito y nota de abono","text":"\u003cstrong>Nota de débito y nota de abono.\u003c/strong> 8 y 2 filas en disco. ¿Se conservan? \u003cem>Propuesta:\u003c/em> nota de débito sí (DTE 06); nota de abono no.","proposal":"nota de débito sí (DTE 06); nota de abono no.","who":"","section":"B. Ventas, precios e impuestos","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"INV 21","group":"INV","num":"21","title":"Pedidos, prefacturas, remisiones y consignaciones","text":"\u003cstrong>Pedidos, prefacturas, remisiones y consignaciones.\u003c/strong> Todas las tablas están vacías. ¿Se usan en otros clientes? \u003cem>Propuesta:\u003c/em> no construir en el primer corte.","proposal":"no construir en el primer corte.","who":"","section":"B. Ventas, precios e impuestos","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"INV 22","group":"INV","num":"22","title":"Sujeto excluido","text":"\u003cstrong>Sujeto excluido.\u003c/strong> Vive en el libro de compras, no en inventario; retención 10 % fija (§6). ¿Quién lo emite (compras/CxP)? \u003cem>Propuesta:\u003c/em> mover a \u003ccode>accounts-payable\u003c/code>/\u003ccode>tax\u003c/code>.","proposal":"mover a \u003ccode>accounts-payable\u003c/code>/\u003ccode>tax\u003c/code>.","who":"","section":"B. Ventas, precios e impuestos","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P21"],"id":"INV 23","group":"INV","num":"23","title":"Exportación","text":"\u003cstrong>Exportación.\u003c/strong> Flete y seguro entran al gravado de la exportación y no pasan por \u003ccode>FACT\u003c/code> (no se contabilizan en ventas) (§15.4). ¿Cómo se contabiliza hoy el flete de exportación?","proposal":"","who":"","section":"B. Ventas, precios e impuestos","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"Respondida en \u003ca href=\"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md\" target=\"_blank\" rel=\"noopener\">dte/open-questions.md\u003c/a>: El correlativo del número de control \u003cstrong>es\u003c/strong> el número del ERP (últimos 8 dígitos): no hay contador propio ni detección de huecos.","date":"","usedBy":["Fase 4"],"id":"INV 24","group":"INV","num":"24","title":"Número digitado","text":"\u003cstrong>Número digitado.\u003c/strong> Hoy los números de documento se digitan o se proponen sin bloqueo (§2.3). ¿Se mantiene la posibilidad de digitarlos? \u003cem>Propuesta:\u003c/em> asignación automática por serie; digitación solo para migración/contingencia con permiso.","proposal":"asignación automática por serie; digitación solo para migración/contingencia con permiso.","who":"","section":"C. Numeración y series","status":"respondida","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"Respondida en \u003ca href=\"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md\" target=\"_blank\" rel=\"noopener\">dte/open-questions.md\u003c/a>: El correlativo del número de control \u003cstrong>es\u003c/strong> el número del ERP (últimos 8 dígitos): no hay contador propio ni detección de huecos.","date":"","usedBy":["Fase 4"],"id":"INV 25","group":"INV","num":"25","title":"Huecos","text":"\u003cstrong>Huecos.\u003c/strong> ¿Hay documentos fiscales con huecos de correlativo? \u003ccode>danulado\u003c/code> los reporta a Hacienda desde una tabla \u003ccode>RESOL\u003c/code> que no está en disco. Entregar esa tabla o su contenido.","proposal":"","who":"","section":"C. Numeración y series","status":"respondida","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"INV 26","group":"INV","num":"26","title":"&quot;Cambiar número a un comprobante&quot;","text":"\u003cstrong>&quot;Cambiar número a un comprobante&quot;.\u003c/strong> No actualiza \u003ccode>FELECTRO\u003c/code> ni los abonos (§8). ¿Se sigue usando? \u003cem>Propuesta:\u003c/em> eliminar.","proposal":"eliminar.","who":"","section":"C. Numeración y series","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P10"],"id":"INV 27","group":"INV","num":"27","title":"Método de costo","text":"\u003cstrong>Método de costo.\u003c/strong> Promedio móvil por producto (todas las bodegas) con re-valuación en el cierre (§13, §16.3). ¿Es el método contable aceptado? ¿Debe haber costo por bodega? \u003cem>Propuesta:\u003c/em> promedio por producto, \u003cstrong>fijo al emitir\u003c/strong>, sin re-valuación; ajustes explícitos.","proposal":"promedio por producto, \u003cstrong>fijo al emitir\u003c/strong>, sin re-valuación; ajustes explícitos.","who":"","section":"D. Inventario y costeo","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P10"],"id":"INV 28","group":"INV","num":"28","title":"Confirmación para producción","text":"\u003cstrong>Confirmación para producción.\u003c/strong> El spec de lotes supone \u003ccode>COSTO_PROM = BODMES.COSTOF/FINAL\u003c/code>; en INV64 es \u003ccode>MESES.COSTOF/FIN\u003c/code> (§13.7). ¿Se acepta un único promedio por producto y empresa? \u003cem>Propuesta:\u003c/em> sí.","proposal":"sí.","who":"","section":"D. Inventario y costeo","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P11"],"id":"INV 29","group":"INV","num":"29","title":"Existencias negativas","text":"\u003cstrong>Existencias negativas.\u003c/strong> Permitidas con advertencia; 32 productos pasan por saldo negativo. ¿Se debe bloquear? \u003cem>Propuesta:\u003c/em> configurable por empresa, por defecto bloquear salvo permiso.","proposal":"configurable por empresa, por defecto bloquear salvo permiso.","who":"","section":"D. Inventario y costeo","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P12"],"id":"INV 30","group":"INV","num":"30","title":"Productos con costo cero","text":"\u003cstrong>Productos con costo cero.\u003c/strong> 127 sin costo promedio (18 servicios). ¿Se corrigen antes de migrar?","proposal":"","who":"","section":"D. Inventario y costeo","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P7"],"id":"INV 31","group":"INV","num":"31","title":"Posteo y cierre","text":"\u003cstrong>Posteo y cierre.\u003c/strong> El posteo vuelve a poner en cero y reconstruir las existencias de todos los productos (§16.3) y 24 meses del rango no están cerrados. ¿Cuándo se corre y quién? ¿Los costos de venta cambian después de facturar y eso es esperado?","proposal":"","who":"","section":"D. Inventario y costeo","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P7"],"id":"INV 32","group":"INV","num":"32","title":"Meses cerrados que se reabren","text":"\u003cstrong>Meses cerrados que se reabren.\u003c/strong> ¿Con qué frecuencia? \u003cem>Propuesta:\u003c/em> permiso, motivo y bitácora.","proposal":"permiso, motivo y bitácora.","who":"","section":"D. Inventario y costeo","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P9"],"id":"INV 33","group":"INV","num":"33","title":"Claves compartidas","text":"\u003cstrong>Claves compartidas.\u003c/strong> La clave de cierre y la de conceptos con \u003ccode>PASSWORD\u003c/code> valen las de cualquier usuario (§16.5). \u003cem>Propuesta:\u003c/em> permisos por acción.","proposal":"permisos por acción.","who":"","section":"D. Inventario y costeo","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"INV 34","group":"INV","num":"34","title":"Transferencias","text":"\u003cstrong>Transferencias.\u003c/strong> Se registran con conceptos de salida (\u003ccode>SV\u003c/code>, \u003ccode>SA\u003c/code>, \u003ccode>PD\u003c/code>…) en ambas patas. ¿Qué concepto debe aplicar? \u003cem>Propuesta:\u003c/em> concepto propio de transferencia.","proposal":"concepto propio de transferencia.","who":"","section":"D. Inventario y costeo","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"INV 35","group":"INV","num":"35","title":"Conceptos con código repetido","text":"\u003cstrong>Conceptos con código repetido.\u003c/strong> \u003ccode>SV\u003c/code>, \u003ccode>ED\u003c/code>, \u003ccode>EC\u003c/code>, \u003ccode>II\u003c/code> están dos veces; solo una \u003ccode>EC\u003c/code> tiene clave. Definir el catálogo final de conceptos antes de importar.","proposal":"","who":"","section":"D. Inventario y costeo","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"INV 36","group":"INV","num":"36","title":"Inventario físico","text":"\u003cstrong>Inventario físico.\u003c/strong> No genera ajuste (§17.1). ¿Se usa? \u003cem>Propuesta:\u003c/em> conteo con ajuste automático al aprobar.","proposal":"conteo con ajuste automático al aprobar.","who":"","section":"D. Inventario y costeo","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P12"],"id":"INV 37","group":"INV","num":"37","title":"Lotes","text":"\u003cstrong>Lotes.\u003c/strong> 574 de 645 productos llevan lote; 21 productos descuadran contra sus movimientos. ¿Qué cifra es la correcta?","proposal":"","who":"","section":"D. Inventario y costeo","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"INV 38","group":"INV","num":"38","title":"Bodegas 11–15","text":"\u003cstrong>Bodegas 11–15.\u003c/strong> \u003ccode>EXIST_ACT\u003c/code> solo suma las bodegas 1–10 tras el posteo. Hoy hay 4 bodegas; ¿habrá más?","proposal":"","who":"","section":"D. Inventario y costeo","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"INV 39","group":"INV","num":"39","title":"Importaciones / retaceo","text":"\u003cstrong>Importaciones / retaceo.\u003c/strong> Sin datos y con código inconcluso (§13.6). ¿Se importa mercadería? Si sí, ¿cómo se costea hoy?","proposal":"","who":"","section":"D. Inventario y costeo","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"INV 40","group":"INV","num":"40","title":"Cambio de código de producto","text":"\u003cstrong>Cambio de código de producto.\u003c/strong> \u003ccode>cambia\u003c/code> renombra el código en 6 tablas pero no en lotes ni órdenes de compra. \u003cem>Propuesta:\u003c/em> id estable; el código se puede cambiar sin tocar tablas.","proposal":"id estable; el código se puede cambiar sin tocar tablas.","who":"","section":"D. Inventario y costeo","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P23"],"id":"INV 41","group":"INV","num":"41","title":"Compras en inventario vs. IVA/CxP","text":"\u003cstrong>Compras en inventario vs. IVA/CxP.\u003c/strong> La pantalla de compras registra stock, datos fiscales, la provisión a \u003ccode>QUEDAN\u003c/code> y la transferencia al libro de IVA a la vez; el enlace con el documento de CxP es por proveedor y número (§13.5, §10.2). ¿Quién es el dueño del documento de compra? \u003cem>Propuesta:\u003c/em> CxP/\u003ccode>tax\u003c/code> dueño del documento; \u003ccode>inventory\u003c/code> recibe la mercadería y referencia el documento.","proposal":"CxP/\u003ccode>tax\u003c/code> dueño del documento; \u003ccode>inventory\u003c/code> recibe la mercadería y referencia el documento.","who":"","section":"E. Compras y cuentas por pagar","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"INV 42","group":"INV","num":"42","title":"\u003ccode>DATAMOV\u003c/code> en disco no trae los campos fiscales","text":"\u003cstrong>\u003ccode>DATAMOV\u003c/code> en disco no trae los campos fiscales\u003c/strong> que usa la pantalla (§10.2, §19 #1). ¿Dónde están guardados los datos de \u003ccode>SIIVA\u003c/code>, \u003ccode>NCONTROL\u003c/code>, \u003ccode>CODGENERA\u003c/code>, clasificación, sector y tipo de costo en producción? Pedir la copia viva.","proposal":"","who":"","section":"E. Compras y cuentas por pagar","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"INV 43","group":"INV","num":"43","title":"Percepción en compras y costo","text":"\u003cstrong>Percepción en compras y costo.\u003c/strong> El IVA no entra al costo. ¿Y los gastos de importación? (ver 39).","proposal":"","who":"","section":"E. Compras y cuentas por pagar","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P1"],"id":"INV 44","group":"INV","num":"44","title":"¿Qué contabiliza qué?","text":"\u003cstrong>¿Qué contabiliza qué?\u003c/strong> Las ventas se contabilizan tanto desde cxc64 como desde INV64; el costo solo desde INV64 (§15.5). ¿Cuál proceso usa el negocio? \u003cem>Propuesta:\u003c/em> contabilización por documento desde \u003ccode>sales\u003c/code> y \u003ccode>inventory\u003c/code>, un solo flujo.","proposal":"contabilización por documento desde \u003ccode>sales\u003c/code> y \u003ccode>inventory\u003c/code>, un solo flujo.","who":"","section":"F. Contabilidad","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P1"],"id":"INV 45","group":"INV","num":"45","title":"Sin vínculo documento→partida","text":"\u003cstrong>Sin vínculo documento→partida.\u003c/strong> Rangos traslapados duplican y huecos omiten (§15.3). ¿Han ocurrido? Verificar contra CONTAC (fuera de este disco). \u003cem>Propuesta:\u003c/em> contrato \u003ccode>gl.postEntry\u003c/code> con \u003ccode>source\u003c/code>/\u003ccode>sourceRef\u003c/code>.","proposal":"contrato \u003ccode>gl.postEntry\u003c/code> con \u003ccode>source\u003c/code>/\u003ccode>sourceRef\u003c/code>.","who":"","section":"F. Contabilidad","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P26"],"id":"INV 46","group":"INV","num":"46","title":"Productos sin cuenta","text":"\u003cstrong>Productos sin cuenta.\u003c/strong> 260 sin inventario, 261 sin ventas, 261 sin costo; las partidas omiten en silencio las líneas sin cuenta (§15.4). ¿Se completan antes de migrar?","proposal":"","who":"","section":"F. Contabilidad","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P6"],"id":"INV 47","group":"INV","num":"47","title":"Mes de la partida","text":"\u003cstrong>Mes de la partida.\u003c/strong> El mes de la partida es el del inicio del rango, aunque cubra varios meses (§15.2). ¿Se corre siempre por mes?","proposal":"","who":"","section":"F. Contabilidad","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P1"],"id":"INV 48","group":"INV","num":"48","title":"Costo de ventas con producción","text":"\u003cstrong>Costo de ventas con producción.\u003c/strong> Cuando entre \u003ccode>LOTE64\u003c/code>, ¿quién contabiliza el costo de existencias: inventario o producción? \u003cem>Propuesta:\u003c/em> inventario contabiliza movimientos; producción contabiliza solo su absorción de costos.","proposal":"inventario contabiliza movimientos; producción contabiliza solo su absorción de costos.","who":"","section":"F. Contabilidad","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P9"],"id":"INV 49","group":"INV","num":"49","title":"Permisos","text":"\u003cstrong>Permisos.\u003c/strong> Los permisos de agregar/modificar/eliminar/anular se leen una vez al iniciar sesión; \u003ccode>INMMOV06\u003c/code> no revisa ninguno; la mayoría de las pantallas de venta no escriben bitácora (§16). \u003cem>Propuesta:\u003c/em> permisos por acción y bitácora completa.","proposal":"permisos por acción y bitácora completa.","who":"","section":"G. Usuarios, auditoría y datos","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"INV 50","group":"INV","num":"50","title":"Datos de más de un cliente","text":"\u003cstrong>Datos de más de un cliente.\u003c/strong> Los datos de INV64 son del mismo cliente que cxc64/IVA64; el de lotes es otro. ¿Hay copia de inventario de más clientes (comercio sin facturación electrónica, manufactura)? Sin ella no se prueba la variación.","proposal":"","who":"","section":"G. Usuarios, auditoría y datos","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"INV 51","group":"INV","num":"51","title":"Datos vivos","text":"\u003cstrong>Datos vivos.\u003c/strong> Falta: \u003ccode>DATAMOV\u003c/code> vivo, \u003ccode>RESOL\u003c/code>, \u003ccode>CONTAC\u003c/code> posterior a 2024-03, y copias de cxc64/IVA64/INV64 del mismo día.","proposal":"","who":"","section":"G. Usuarios, auditoría y datos","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"INV 52","group":"INV","num":"52","title":"Tablas de trabajo con datos reales","text":"\u003cstrong>Tablas de trabajo con datos reales\u003c/strong> en \u003ccode>FUENTE\u003c/code> (\u003ccode>WILDA\u003c/code> con 197,725 filas, \u003ccode>VEN*\u003c/code>, \u003ccode>ARTI\u003c/code>…). ¿Se destruyen o se guardan fuera del repositorio?","proposal":"","who":"","section":"G. Usuarios, auditoría y datos","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"INV 53","group":"INV","num":"53","title":"Comisiones y presupuestos","text":"\u003cstrong>Comisiones y presupuestos.\u003c/strong> Fuera del primer corte. ¿Se necesitan? (ver cxc64 preguntas 7 y 8)","proposal":"","who":"","section":"G. Usuarios, auditoría y datos","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P30"],"id":"INV 54","group":"INV","num":"54","title":"Reporte de ~150 pantallas","text":"\u003cstrong>Reporte de ~150 pantallas.\u003c/strong> ¿Cuáles usan realmente? \u003cem>Propuesta:\u003c/em> pedir al negocio los 15 más usados y construir un motor de reportes; el resto bajo demanda.","proposal":"pedir al negocio los 15 más usados y construir un motor de reportes; el resto bajo demanda.","who":"","section":"G. Usuarios, auditoría y datos","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"INV 55","group":"INV","num":"55","title":"Etiquetas (&quot;viñeta&quot;)","text":"\u003cstrong>Etiquetas (&quot;viñeta&quot;).\u003c/strong> El módulo de viñetas (\u003ccode>CVINETA\u003c/code>, 0 filas; \u003ccode>CCPARTCO\u003c/code> la usa si \u003ccode>PREVINE&gt;0\u003c/code>) parece de otro cliente (farma). ¿Se migra? \u003cem>Propuesta:\u003c/em> no.","proposal":"no.","who":"","section":"G. Usuarios, auditoría y datos","status":"abierta","doc":"docs/legacy/inv64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/inv64/open-questions.md"},{"statusNote":"","date":"","usedBy":["Fase 5"],"id":"LOTE 1","group":"LOTE","num":"1","title":"¿Sigue en uso el módulo?","text":"\u003cstrong>¿Sigue en uso el módulo?\u003c/strong> El código se compiló en 2021-12 pero las órdenes terminan en 2020-10 (50 siguen &quot;pendientes&quot;, la más vieja de 2019-03). \u003cem>Propuesta:\u003c/em> confirmar con el cliente si hay más datos recientes; si no, el módulo se migra para consulta del histórico y para el cliente que lo siga necesitando.","proposal":"confirmar con el cliente si hay más datos recientes; si no, el módulo se migra para consulta del histórico y para el cliente que lo siga necesitando.","who":"","section":"A. Alcance, uso y datos","status":"abierta","doc":"docs/legacy/lote64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"LOTE 2","group":"LOTE","num":"2","title":"Copia consistente de \u003ccode>INV64\u003c/code> y \u003ccode>CONTAC\u003c/code> del mismo cliente","text":"\u003cstrong>Copia consistente de \u003ccode>INV64\u003c/code> y \u003ccode>CONTAC\u003c/code> del mismo cliente.\u003c/strong> El \u003ccode>INV64/DBF\u003c/code> y el \u003ccode>CONTAC/dbf\u003c/code> que hay en disco son de otra empresa (articulos numéricos, sin conceptos \u003ccode>PR/EP/ET/SP/PP\u003c/code>, sin \u003ccode>ENTREGAP\u003c/code> ni \u003ccode>LOTEPADRE\u003c/code>). \u003cem>Propuesta:\u003c/em> pedir la copia completa (carpeta \u003ccode>INV64\u003c/code> con \u003ccode>ARTICULO\u003c/code>, \u003ccode>MOVIMIEN\u003c/code>, \u003ccode>BODMES\u003c/code>, \u003ccode>MESES\u003c/code>, \u003ccode>SALDOLO\u003c/code>, \u003ccode>VENCE2\u003c/code>, \u003ccode>CONCEPTO\u003c/code>; y \u003ccode>CONTAC\u003c/code> con las partidas de costo) y \u003ccode>DBF.rar\u003c/code>. Sin ella, la paridad de existencias, costo promedio y partidas no se puede probar.","proposal":"pedir la copia completa (carpeta \u003ccode>INV64\u003c/code> con \u003ccode>ARTICULO\u003c/code>, \u003ccode>MOVIMIEN\u003c/code>, \u003ccode>BODMES\u003c/code>, \u003ccode>MESES\u003c/code>, \u003ccode>SALDOLO\u003c/code>, \u003ccode>VENCE2\u003c/code>, \u003ccode>CONCEPTO\u003c/code>; y \u003ccode>CONTAC\u003c/code> con las partidas de costo) y \u003ccode>DBF.rar\u003c/code>. Sin ella, la paridad de existencias, costo promedio y partidas no se puede probar.","who":"","section":"A. Alcance, uso y datos","status":"abierta","doc":"docs/legacy/lote64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md"},{"statusNote":"","date":"","usedBy":["Fase 5"],"id":"LOTE 3","group":"LOTE","num":"3","title":"¿Qué clientes usan producción?","text":"\u003cstrong>¿Qué clientes usan producción?\u003c/strong> Lo que muestra el código y los datos: lo usan los clientes que fabrican o empacan (en disco, 1 de 2 clientes de inventario; el otro no tiene ninguna orden). Por el contenido (llenado, etiquetado, semi-terminado, maquila, forma farmacéutica, desperdicio de horneado/fritura) el módulo se personalizó para al menos dos giros. \u003cem>Propuesta:\u003c/em> módulo opcional por empresa; no activarlo por omisión. ¿Qué otros clientes lo necesitan y en qué giro (para no asumir el vocabulario del desperdicio)?","proposal":"módulo opcional por empresa; no activarlo por omisión. ¿Qué otros clientes lo necesitan y en qué giro (para no asumir el vocabulario del desperdicio)?","who":"","section":"A. Alcance, uso y datos","status":"abierta","doc":"docs/legacy/lote64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"LOTE 4","group":"LOTE","num":"4","title":"Fórmulas duplicadas","text":"\u003cstrong>Fórmulas duplicadas.\u003c/strong> 47 productos tienen entre 2 y 7 encabezados vivos (32 con parámetros distintos) y 3,741 órdenes usan uno de ellos. \u003cem>Propuesta:\u003c/em> quedarse con la última fila física como vigente y conservar las demás como históricas; que el negocio revise el reporte de diferencias (cantidad formulada, % indirectos, línea).","proposal":"quedarse con la última fila física como vigente y conservar las demás como históricas; que el negocio revise el reporte de diferencias (cantidad formulada, % indirectos, línea).","who":"","section":"B. Fórmulas","status":"abierta","doc":"docs/legacy/lote64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"LOTE 5","group":"LOTE","num":"5","title":"Versiones y vigencia de fórmulas","text":"\u003cstrong>Versiones y vigencia de fórmulas.\u003c/strong> El sistema viejo reescribe la fórmula al modificarla; las órdenes ya hechas no la conservan (7,044 de 12,861 líneas muestreadas difieren de la fórmula actual). \u003cem>Propuesta:\u003c/em> versiones con fecha de vigencia y una sola vigente; la orden congela la versión usada. ¿Se requiere aprobación de cambios de fórmula (calidad)?","proposal":"versiones con fecha de vigencia y una sola vigente; la orden congela la versión usada. ¿Se requiere aprobación de cambios de fórmula (calidad)?","who":"","section":"B. Fórmulas","status":"abierta","doc":"docs/legacy/lote64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"LOTE 6","group":"LOTE","num":"6","title":"Medida base vs cantidad formulada","text":"\u003cstrong>Medida base vs cantidad formulada.\u003c/strong> \u003ccode>MBASE\u003c/code> (&quot;Medida Base&quot;) es obligatoria y &gt; 0 pero ningún cálculo la usa; \u003ccode>PROGRAMA\u003c/code> (&quot;Cantidad Formulada&quot;) es el tamaño de la corrida. En 150 de 377 filas son iguales. \u003cem>Propuesta:\u003c/em> migrar \u003ccode>PROGRAMA\u003c/code> como tamaño base de lote y guardar \u003ccode>MBASE\u003c/code> solo como dato informativo. ¿Qué significa para el negocio?","proposal":"migrar \u003ccode>PROGRAMA\u003c/code> como tamaño base de lote y guardar \u003ccode>MBASE\u003c/code> solo como dato informativo. ¿Qué significa para el negocio?","who":"","section":"B. Fórmulas","status":"abierta","doc":"docs/legacy/lote64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"LOTE 7","group":"LOTE","num":"7","title":"Fórmula maestra","text":"\u003cstrong>Fórmula maestra\u003c/strong> (\u003ccode>FORMULA2\u003c/code>/\u003ccode>DETAFOR2\u003c/code>, 12 fórmulas). Clon de la pantalla de fórmulas, sin otro uso. \u003cem>Propuesta:\u003c/em> no migrar como tabla aparte; si son fórmulas aprobadas distintas de las de trabajo, importarlas como versiones. ¿Para qué se usan?","proposal":"no migrar como tabla aparte; si son fórmulas aprobadas distintas de las de trabajo, importarlas como versiones. ¿Para qué se usan?","who":"","section":"B. Fórmulas","status":"abierta","doc":"docs/legacy/lote64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"LOTE 8","group":"LOTE","num":"8","title":"Semi-terminados","text":"\u003cstrong>Semi-terminados.\u003c/strong> 433 líneas de fórmula (96 productos) usan como insumo un producto que tiene fórmula propia, pero el sistema no produce en cascada: consume existencias del semi-terminado. \u003cem>Propuesta:\u003c/em> mantener ese comportamiento (el semi-terminado se produce con su propia orden antes); ¿se necesita explosión de materiales o &quot;orden hija&quot;?","proposal":"mantener ese comportamiento (el semi-terminado se produce con su propia orden antes); ¿se necesita explosión de materiales o &quot;orden hija&quot;?","who":"","section":"B. Fórmulas","status":"abierta","doc":"docs/legacy/lote64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"LOTE 9","group":"LOTE","num":"9","title":"Sustitutos, subproductos, rendimiento esperado","text":"\u003cstrong>Sustitutos, subproductos, rendimiento esperado.\u003c/strong> No existen en el sistema viejo. \u003cem>Propuesta:\u003c/em> no construirlos al inicio; ¿algún cliente los necesita (merma esperada por fórmula, coproductos)?","proposal":"no construirlos al inicio; ¿algún cliente los necesita (merma esperada por fórmula, coproductos)?","who":"","section":"B. Fórmulas","status":"abierta","doc":"docs/legacy/lote64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"LOTE 10","group":"LOTE","num":"10","title":"Numeración del lote","text":"\u003cstrong>Numeración del lote.\u003c/strong> El número lo digita el usuario con un patrón de letras + dígitos que parece significar línea/turno/fecha (patrones \u003ccode>A999999\u003c/code>, \u003ccode>AA99999\u003c/code>); el sugerido por la pantalla no sirve con ese patrón. \u003cem>Propuesta:\u003c/em> mantener el número como texto único por empresa (hasta 20 caracteres) y ofrecer una plantilla configurable. ¿Qué significa cada parte (para validarla)?","proposal":"mantener el número como texto único por empresa (hasta 20 caracteres) y ofrecer una plantilla configurable. ¿Qué significa cada parte (para validarla)?","who":"","section":"C. Órdenes de producción","status":"abierta","doc":"docs/legacy/lote64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"LOTE 11","group":"LOTE","num":"11","title":"Estatus de la orden","text":"\u003cstrong>Estatus de la orden.\u003c/strong> Seis estatus (programada, iniciada, intermedio, pte. horas, finalizada, P.T. maquila) que no gobiernan nada; 99.7 % de las órdenes quedó en \u003ccode>06 P.T. MAQUILA\u003c/code>. \u003cem>Propuesta:\u003c/em> mantenerlos como catálogo de seguimiento opcional y separado del estado real (\u003ccode>programada → procesada → anulada\u003c/code>). ¿Alguno debe bloquear algo (p. ej. no procesar si no está &quot;finalizada&quot;)?","proposal":"mantenerlos como catálogo de seguimiento opcional y separado del estado real (\u003ccode>programada → procesada → anulada\u003c/code>). ¿Alguno debe bloquear algo (p. ej. no procesar si no está &quot;finalizada&quot;)?","who":"","section":"C. Órdenes de producción","status":"abierta","doc":"docs/legacy/lote64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"LOTE 12","group":"LOTE","num":"12","title":"Cantidad fabricada distinta de la programada","text":"\u003cstrong>Cantidad fabricada distinta de la programada.\u003c/strong> En 3,041 órdenes (13 %) la cantidad final difiere de la programada, y el sistema solo recalcula los insumos si se le pide; si no, el costo unitario absorbe la diferencia. \u003cem>Propuesta:\u003c/em> siempre guardar programada y fabricada, recalcular insumos por omisión al cambiarla, y mostrar la variación de consumo. ¿Se espera tolerancia (±%) y aprobación?","proposal":"siempre guardar programada y fabricada, recalcular insumos por omisión al cambiarla, y mostrar la variación de consumo. ¿Se espera tolerancia (±%) y aprobación?","who":"","section":"C. Órdenes de producción","status":"abierta","doc":"docs/legacy/lote64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P8"],"id":"LOTE 13","group":"LOTE","num":"13","title":"Modificar, eliminar y anular","text":"\u003cstrong>Modificar, eliminar y anular.\u003c/strong> Hoy: procesada no se elimina; procesada sí se puede anular (reversa); \u003ccode>MOD\u003c/code>/\u003ccode>CI\u003c/code> se pueden cambiar sin recalcular; cualquier usuario con acceso a la pantalla puede hacerlo y no queda quién. \u003cem>Propuesta:\u003c/em> anular una procesada exige permiso de supervisor, motivo y contra-asientos; modificar una procesada solo con permiso y deja auditoría; eliminar = anular. ¿De acuerdo?","proposal":"anular una procesada exige permiso de supervisor, motivo y contra-asientos; modificar una procesada solo con permiso y deja auditoría; eliminar = anular. ¿De acuerdo?","who":"","section":"C. Órdenes de producción","status":"abierta","doc":"docs/legacy/lote64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P10"],"id":"LOTE 14","group":"LOTE","num":"14","title":"Valuación del insumo y del producto terminado","text":"\u003cstrong>Valuación del insumo y del producto terminado.\u003c/strong> Los insumos salen a su costo promedio global (\u003ccode>ARTICULO.COSTO_PROM\u003c/code>) y el producto terminado queda con el promedio móvil \u003cstrong>mensual de su bodega\u003c/strong> (\u003ccode>BODMES.COSTOF/FINAL\u003c/code>). \u003cem>Propuesta:\u003c/em> que \u003ccode>inventory\u003c/code> valúe con promedio móvil y devuelva el costo; reproducir exactamente el sistema viejo solo para la paridad de la migración. ¿El método oficial del cliente es promedio por artículo o por bodega?","proposal":"que \u003ccode>inventory\u003c/code> valúe con promedio móvil y devuelva el costo; reproducir exactamente el sistema viejo solo para la paridad de la migración. ¿El método oficial del cliente es promedio por artículo o por bodega?","who":"","section":"D. Inventario y costos","status":"abierta","doc":"docs/legacy/lote64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P11"],"id":"LOTE 15","group":"LOTE","num":"15","title":"Existencias insuficientes","text":"\u003cstrong>Existencias insuficientes.\u003c/strong> Hoy no se procesa si falta cualquier insumo (global, por bodega o por lote de vencimiento) y se bloquea todo. \u003cem>Propuesta:\u003c/em> bloquear por omisión, con permiso de supervisor para procesar con existencia negativa y reporte de las órdenes afectadas.","proposal":"bloquear por omisión, con permiso de supervisor para procesar con existencia negativa y reporte de las órdenes afectadas.","who":"","section":"D. Inventario y costos","status":"abierta","doc":"docs/legacy/lote64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P7"],"id":"LOTE 16","group":"LOTE","num":"16","title":"Mes cerrado","text":"\u003cstrong>Mes cerrado.\u003c/strong> El sistema viejo \u003cstrong>permite\u003c/strong> procesar, anular y transferir en meses cerrados (la verificación está comentada) y solo bloquea el recálculo de costos. \u003cem>Propuesta:\u003c/em> bloquear siempre en períodos cerrados y ofrecer reapertura con permiso y rastro. ¿Hay clientes que dependen de procesar con fecha de mes cerrado?","proposal":"bloquear siempre en períodos cerrados y ofrecer reapertura con permiso y rastro. ¿Hay clientes que dependen de procesar con fecha de mes cerrado?","who":"","section":"D. Inventario y costos","status":"abierta","doc":"docs/legacy/lote64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md"},{"statusNote":"","date":"","usedBy":["Fase 5"],"id":"LOTE 17","group":"LOTE","num":"17","title":"&quot;Actualizar Indirectos&quot; y &quot;Recalcular Costos&quot;","text":"\u003cstrong>&quot;Actualizar Indirectos&quot; y &quot;Recalcular Costos&quot;.\u003c/strong> La tarifa mensual (\u003ccode>CFINDI\u003c/code>) solo existe para 2013–2017; el proceso pone \u003ccode>MOD = 0\u003c/code> a las órdenes sin horas, solo cambia \u003ccode>CI\u003c/code> si hay horas (2 órdenes en disco tienen horas) y \u003cstrong>no\u003c/strong> corrige el costo promedio del inventario. &quot;Recalcular&quot; reescribe costos de órdenes y la entrada pero tampoco toca \u003ccode>BODMES\u003c/code>/\u003ccode>MESES\u003c/code>/\u003ccode>ARTICULO\u003c/code>. \u003cem>Propuesta:\u003c/em> no migrar \u003ccode>CFINDI\u003c/code> ni &quot;Actualizar Formulas&quot;; reemplazar por un \u003cstrong>recosteo\u003c/strong> de período explícito que genere ajustes. ¿Los clientes usan alguna vez estas opciones? ¿Quién corrige hoy el costo promedio cuando cambia un costo de insumo?","proposal":"no migrar \u003ccode>CFINDI\u003c/code> ni &quot;Actualizar Formulas&quot;; reemplazar por un \u003cstrong>recosteo\u003c/strong> de período explícito que genere ajustes. ¿Los clientes usan alguna vez estas opciones? ¿Quién corrige hoy el costo promedio cuando cambia un costo de insumo?","who":"","section":"D. Inventario y costos","status":"abierta","doc":"docs/legacy/lote64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"LOTE 18","group":"LOTE","num":"18","title":"Base de los indirectos","text":"\u003cstrong>Base de los indirectos.\u003c/strong> Al procesar, el % de indirectos se aplica sobre materiales + mano de obra \u003cstrong>+ maquila\u003c/strong>; al recalcular y anular, \u003cstrong>sin\u003c/strong> la maquila (170 órdenes con maquila). \u003cem>Propuesta:\u003c/em> una sola regla; la del proceso (incluye maquila) porque es la que está grabada en los datos. ¿Es correcta?","proposal":"una sola regla; la del proceso (incluye maquila) porque es la que está grabada en los datos. ¿Es correcta?","who":"","section":"D. Inventario y costos","status":"abierta","doc":"docs/legacy/lote64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"LOTE 19","group":"LOTE","num":"19","title":"Viñeta (etiqueta)","text":"\u003cstrong>Viñeta (etiqueta).\u003c/strong> Un costo por unidad que se suma al costo del producto terminado y se acredita a una cuenta propia; \u003ccode>EMPRESAS.CVINETA = F\u003c/code> en disco (apagado: 0 órdenes con viñeta). \u003cem>Propuesta:\u003c/em> no migrarlo salvo que otro cliente lo use; ¿se usa?","proposal":"no migrarlo salvo que otro cliente lo use; ¿se usa?","who":"","section":"D. Inventario y costos","status":"abierta","doc":"docs/legacy/lote64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"LOTE 20","group":"LOTE","num":"20","title":"Precisión","text":"\u003cstrong>Precisión.\u003c/strong> El sistema viejo guarda 5 decimales y redondea cada línea antes de sumar; el dinero de la plataforma nueva usa 2. \u003cem>Propuesta:\u003c/em> cantidades y costos unitarios con 5 decimales, totales contables con 2, y el mismo orden de redondeo para la paridad. ¿Hay cifras que el cliente ve redondeadas distinto en sus reportes impresos?","proposal":"cantidades y costos unitarios con 5 decimales, totales contables con 2, y el mismo orden de redondeo para la paridad. ¿Hay cifras que el cliente ve redondeadas distinto en sus reportes impresos?","who":"","section":"D. Inventario y costos","status":"abierta","doc":"docs/legacy/lote64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P2","P6"],"id":"LOTE 21","group":"LOTE","num":"21","title":"¿Cuándo y cómo se contabiliza la producción?","text":"\u003cstrong>¿Cuándo y cómo se contabiliza la producción?\u003c/strong> Hoy: a mano, por rango de fechas, \u003cstrong>una partida resumen\u003c/strong> de todo el período, directa al libro mayor, sin marcar qué órdenes entraron, con riesgo de duplicar si los rangos se traslapan y con la fecha/mes del primer día (un rango que cruza de mes se contabiliza completo en el primero). Concepto &quot;COSTO DE VENTA&quot; (copiado de otro proceso). \u003cem>Propuesta:\u003c/em> contabilizar \u003cstrong>por orden al procesarla\u003c/strong> (o por período con cada orden marcada), con \u003ccode>source = 'produccion'\u003c/code>; la partida inversa al anular. ¿Prefieren seguir con el resumen por rango? ¿Cuándo se genera (diario, cierre de mes)? ¿Quién contabiliza la salida de insumos y entrada de producto terminado: \u003ccode>inventory\u003c/code> (si genera sus propias partidas de existencias) o \u003ccode>production\u003c/code>? Hay que alinearlo con el spec de INV64.","proposal":"contabilizar \u003cstrong>por orden al procesarla\u003c/strong> (o por período con cada orden marcada), con \u003ccode>source = 'produccion'\u003c/code>; la partida inversa al anular. ¿Prefieren seguir con el resumen por rango? ¿Cuándo se genera (diario, cierre de mes)? ¿Quién contabiliza la salida de insumos y entrada de producto terminado: \u003ccode>inventory\u003c/code> (si genera sus propias partidas de existencias) o \u003ccode>production\u003c/code>? Hay que alinearlo con el spec de INV64.","who":"","section":"E. Contabilidad","status":"abierta","doc":"docs/legacy/lote64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P26"],"id":"LOTE 22","group":"LOTE","num":"22","title":"Cuentas de absorción","text":"\u003cstrong>Cuentas de absorción.\u003c/strong> Hay cuatro cuentas configuradas (mano de obra, indirectos, maquilado, etiqueta) que se \u003cstrong>acreditan\u003c/strong> al trasladar el costo a producto terminado, y la cuenta de inventario sale de \u003ccode>ARTICULO.CTA\u003c/code>. \u003cem>Propuesta:\u003c/em> configurarlas por empresa en \u003ccode>prod_settings\u003c/code>. ¿Es correcto que la contrapartida sea un crédito a esas cuentas (supone que los gastos reales se cargan a ellas por otra vía, p. ej. planilla)? ¿Hay centro de costo por línea?","proposal":"configurarlas por empresa en \u003ccode>prod_settings\u003c/code>. ¿Es correcto que la contrapartida sea un crédito a esas cuentas (supone que los gastos reales se cargan a ellas por otra vía, p. ej. planilla)? ¿Hay centro de costo por línea?","who":"","section":"E. Contabilidad","status":"abierta","doc":"docs/legacy/lote64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"LOTE 23","group":"LOTE","num":"23","title":"Transferir materia prima al maquilador","text":"\u003cstrong>Transferir materia prima al maquilador\u003c/strong> (concepto \u003ccode>PP\u003c/code>). Funcionalidad con errores de código y sin datos. \u003cem>Propuesta:\u003c/em> no construir hasta confirmar uso; si se necesita, una transferencia de \u003ccode>inventory\u003c/code> a la bodega del maquilador desde la orden. ¿Se usa? ¿La materia prima queda como existencia en bodega del maquilador (bodega 3 fija en el código)?","proposal":"no construir hasta confirmar uso; si se necesita, una transferencia de \u003ccode>inventory\u003c/code> a la bodega del maquilador desde la orden. ¿Se usa? ¿La materia prima queda como existencia en bodega del maquilador (bodega 3 fija en el código)?","who":"","section":"F. Maquila, traslados y entregas parciales","status":"abierta","doc":"docs/legacy/lote64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"LOTE 24","group":"LOTE","num":"24","title":"Entregas parciales","text":"\u003cstrong>Entregas parciales\u003c/strong> (concepto \u003ccode>ET\u003c/code>/\u003ccode>SP\u003c/code>, bodega 17 fija). 0 usos en disco, falta la tabla \u003ccode>ENTREGAP\u003c/code>. \u003cem>Propuesta:\u003c/em> no construir; ¿alguien entrega producto antes de cerrar la orden? ¿A qué costo se valúa la entrega parcial (hoy el promedio vigente, no el costo de la orden)?","proposal":"no construir; ¿alguien entrega producto antes de cerrar la orden? ¿A qué costo se valúa la entrega parcial (hoy el promedio vigente, no el costo de la orden)?","who":"","section":"F. Maquila, traslados y entregas parciales","status":"abierta","doc":"docs/legacy/lote64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"LOTE 25","group":"LOTE","num":"25","title":"Maquila y compras","text":"\u003cstrong>Maquila y compras.\u003c/strong> La orden se liga a una orden de compra (\u003ccode>ORDENC\u003c/code>) solo para que el reporte de maquila por proveedor funcione, y 5,479 órdenes tienen maquilador, 171 tarifa de maquila, \u003cstrong>0\u003c/strong> orden de compra. \u003cem>Propuesta:\u003c/em> el maquilador es un proveedor; el costo de maquila nace de la factura de servicio (CxP) o de una tarifa pactada por producto. ¿Cómo se paga hoy la maquila y de dónde sale la tarifa por unidad?","proposal":"el maquilador es un proveedor; el costo de maquila nace de la factura de servicio (CxP) o de una tarifa pactada por producto. ¿Cómo se paga hoy la maquila y de dónde sale la tarifa por unidad?","who":"","section":"F. Maquila, traslados y entregas parciales","status":"abierta","doc":"docs/legacy/lote64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"LOTE 26","group":"LOTE","num":"26","title":"Lotes de vencimiento","text":"\u003cstrong>Lotes de vencimiento.\u003c/strong> Existe el soporte (lote del insumo, lote y fecha de vencimiento del terminado, \u003ccode>VENCE2\u003c/code>/\u003ccode>SALDOLO\u003c/code>), pero en los datos casi no se usa (13 órdenes con lote, ninguna con vencimiento, ninguna línea con lote de insumo). Lo que el cliente llama &quot;lote&quot; es la orden. \u003cem>Propuesta:\u003c/em> diseñar lotes/vencimientos en \u003ccode>inventory\u003c/code> y que producción solo los pase; consulta de trazabilidad (&quot;¿con qué se hizo / a dónde fue?&quot;) como fase 2 solo para clientes con regulación (farmacia/alimentos). ¿Es requisito legal para algún cliente?","proposal":"diseñar lotes/vencimientos en \u003ccode>inventory\u003c/code> y que producción solo los pase; consulta de trazabilidad (&quot;¿con qué se hizo / a dónde fue?&quot;) como fase 2 solo para clientes con regulación (farmacia/alimentos). ¿Es requisito legal para algún cliente?","who":"","section":"G. Trazabilidad","status":"abierta","doc":"docs/legacy/lote64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"LOTE 27","group":"LOTE","num":"27","title":"Despacho de lotes","text":"\u003cstrong>Despacho de lotes.\u003c/strong> Vale con número de ruta que agrupa órdenes (no procesadas) &quot;para enviar a bodega&quot;. Sin efecto en existencias, 1 solo registro, claves de 6 caracteres sobre números de 7. \u003cem>Propuesta:\u003c/em> no migrar; si la bodega necesita el papel, un reporte de órdenes por fecha de envío. ¿Se usa? ¿Por qué solo acepta órdenes sin procesar (¿se despacha lo que aún no se carga a inventario)?","proposal":"no migrar; si la bodega necesita el papel, un reporte de órdenes por fecha de envío. ¿Se usa? ¿Por qué solo acepta órdenes sin procesar (¿se despacha lo que aún no se carga a inventario)?","who":"","section":"H. Despacho","status":"abierta","doc":"docs/legacy/lote64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"LOTE 28","group":"LOTE","num":"28","title":"Desperdicio y catálogos sin uso","text":"\u003cstrong>Desperdicio y catálogos sin uso.\u003c/strong> Los once tipos de desperdicio (quebrado, inflado, crudo, dorado, pegado, cabezal, quemado, retenido en máquina, caído al suelo, grasoso, falto de manteca) están en 119 órdenes (0.5 %); no se sabe si son porcentajes o unidades ni si importan para costeo. Actividades, indirectos, mano de obra y maquinaria (con tarifa por hora) no los usa ninguna pantalla. \u003cem>Propuesta:\u003c/em> migrar el desperdicio como catálogo + cantidades por orden solo si el negocio lo pide; no crear los demás catálogos. ¿Qué se quiere medir (merma valorada, rendimiento)?","proposal":"migrar el desperdicio como catálogo + cantidades por orden solo si el negocio lo pide; no crear los demás catálogos. ¿Qué se quiere medir (merma valorada, rendimiento)?","who":"","section":"I. Desperdicio, catálogos y reportes","status":"abierta","doc":"docs/legacy/lote64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P30"],"id":"LOTE 29","group":"LOTE","num":"29","title":"Reportes","text":"\u003cstrong>Reportes.\u003c/strong> El sistema trae 15 reportes (varios con 3 a 5 formatos). &quot;Rendimientos&quot; está inconcluso y &quot;Producción al costo Standar&quot; usa costos reales. \u003cem>Propuesta:\u003c/em> construir primero órdenes pendientes, producción por fecha/línea/producto (con costos), consumo por insumo, costo por componente, producción anual y fórmulas con costo teórico; luego rendimiento y variación. ¿Cuáles imprimen hoy y con qué formato físico (orden de maquilado, hoja de producción)?","proposal":"construir primero órdenes pendientes, producción por fecha/línea/producto (con costos), consumo por insumo, costo por componente, producción anual y fórmulas con costo teórico; luego rendimiento y variación. ¿Cuáles imprimen hoy y con qué formato físico (orden de maquilado, hoja de producción)?","who":"","section":"I. Desperdicio, catálogos y reportes","status":"abierta","doc":"docs/legacy/lote64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"LOTE 30","group":"LOTE","num":"30","title":"¿Cuánto histórico se migra?","text":"\u003cstrong>¿Cuánto histórico se migra?\u003c/strong> 22,643 órdenes y 98,857 líneas (2019-03 a 2020-10). \u003cem>Propuesta:\u003c/em> migrar todo (volumen pequeño), sin los registros borrados; los movimientos de inventario viajan con \u003ccode>INV64\u003c/code>.","proposal":"migrar todo (volumen pequeño), sin los registros borrados; los movimientos de inventario viajan con \u003ccode>INV64\u003c/code>.","who":"","section":"J. Migración y seguridad","status":"abierta","doc":"docs/legacy/lote64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P27"],"id":"LOTE 31","group":"LOTE","num":"31","title":"Datos sucios por resolver con el negocio","text":"\u003cstrong>Datos sucios por resolver con el negocio:\u003c/strong> 50 órdenes pendientes desde 2019, 25 procesadas con bodega 0, 116 líneas procesadas con cantidad ≤ 0, 8 órdenes procesadas con costo de materiales 0, 1 sin líneas, 6 con insumo repetido, y 5 + 1 órdenes cuyos costos de materiales no igualan a la suma de sus líneas. \u003cem>Propuesta:\u003c/em> importar tal cual, reportarlas y dejar que el negocio decida cuáles corregir; las 50 pendientes pasan a un estado &quot;vencida&quot; para cerrarse.","proposal":"importar tal cual, reportarlas y dejar que el negocio decida cuáles corregir; las 50 pendientes pasan a un estado &quot;vencida&quot; para cerrarse.","who":"","section":"J. Migración y seguridad","status":"abierta","doc":"docs/legacy/lote64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P9"],"id":"LOTE 32","group":"LOTE","num":"32","title":"Permisos y visibilidad de costos","text":"\u003cstrong>Permisos y visibilidad de costos.\u003c/strong> Hoy un permiso por pantalla (solo &quot;abrir&quot;); \u003ccode>USUARIOS.VE_COSTO\u003c/code> existe pero ninguna pantalla lo usa y &quot;Ver costos&quot; es una casilla libre; un perfil \u003ccode>USRTYPE = 2\u003c/code> solo ve despachos, mes/empresa, indirectos y entregas parciales. \u003cem>Propuesta:\u003c/em> permisos \u003ccode>capture\u003c/code> (órdenes y fórmulas), \u003ccode>supervise\u003c/code> (procesar/anular, recosteo, partidas, cuentas) y \u003ccode>reports\u003c/code> con \u003cstrong>permiso aparte para ver costos\u003c/strong>. ¿Quién debe ver costos y quién debe poder procesar?","proposal":"permisos \u003ccode>capture\u003c/code> (órdenes y fórmulas), \u003ccode>supervise\u003c/code> (procesar/anular, recosteo, partidas, cuentas) y \u003ccode>reports\u003c/code> con \u003cstrong>permiso aparte para ver costos\u003c/strong>. ¿Quién debe ver costos y quién debe poder procesar?","who":"","section":"J. Migración y seguridad","status":"abierta","doc":"docs/legacy/lote64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/lote64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"AFIJO 1","group":"AFIJO","num":"1","title":"¿Qué clientes usan activo fijo y siguen usándolo?","text":"\u003cstrong>¿Qué clientes usan activo fijo y siguen usándolo?\u003c/strong> En disco: una empresa, corridas hasta 2023-02 (ejecutada el 2023-03-01) y dos activos comprados en 2023-10 todavía sin depreciar. \u003cem>Propuesta:\u003c/em> migrarlo completo para ese cliente y dejarlo como módulo opcional por empresa (\u003ccode>alwaysOn: false\u003c/code>).","proposal":"migrarlo completo para ese cliente y dejarlo como módulo opcional por empresa (\u003ccode>alwaysOn: false\u003c/code>).","who":"","section":"A. Alcance, uso y datos","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"AFIJO 2","group":"AFIJO","num":"2","title":"Otras copias y \u003ccode>DBF.rar\u003c/code>","text":"\u003cstrong>Otras copias y \u003ccode>DBF.rar\u003c/code>.\u003c/strong> Solo hay una empresa en disco y \u003ccode>AFIJO64/DBF/dbf.rar\u003c/code> (75 KB) no se abrió. \u003cem>Propuesta:\u003c/em> pedir las copias de los demás clientes que usen el módulo (para confirmar si usan otros plazos, activos no depreciables, bajas, etc.) antes de congelar el modelo.","proposal":"pedir las copias de los demás clientes que usen el módulo (para confirmar si usan otros plazos, activos no depreciables, bajas, etc.) antes de congelar el modelo.","who":"","section":"A. Alcance, uso y datos","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"AFIJO 3","group":"AFIJO","num":"3","title":"¿Qué cifras da por buenas el contador?","text":"\u003cstrong>¿Qué cifras da por buenas el contador?\u003c/strong> Los reportes de depreciación acumulada se calculan desde las líneas (correctos) pero la ficha del activo muestra otro acumulado (141 de 143 distintos, ver business-rules §6). \u003cem>Propuesta:\u003c/em> tomar las líneas de \u003ccode>MOVDEPRE\u003c/code> como verdad, descartar los contadores de la ficha y entregar al contador el informe de diferencias. ¿Alguien corrió \u003ccode>arregla.prg\u003c/code> y cuándo? ¿Hay más reparaciones manuales (se borraron y regeneraron 2022-01 a 2022-03)?","proposal":"tomar las líneas de \u003ccode>MOVDEPRE\u003c/code> como verdad, descartar los contadores de la ficha y entregar al contador el informe de diferencias. ¿Alguien corrió \u003ccode>arregla.prg\u003c/code> y cuándo? ¿Hay más reparaciones manuales (se borraron y regeneraron 2022-01 a 2022-03)?","who":"","section":"A. Alcance, uso y datos","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P24"],"id":"AFIJO 4","group":"AFIJO","num":"4","title":"Método","text":"\u003cstrong>Método.\u003c/strong> El sistema solo hace línea recta mensual en cuotas iguales. \u003cem>Propuesta:\u003c/em> línea recta en la primera versión, con la columna \u003ccode>method\u003c/code> lista para otros. ¿Algún cliente usa saldo decreciente, unidades de producción o tablas por clase?","proposal":"línea recta en la primera versión, con la columna \u003ccode>method\u003c/code> lista para otros. ¿Algún cliente usa saldo decreciente, unidades de producción o tablas por clase?","who":"","section":"B. Depreciación (lo que mueve dinero)","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P24"],"id":"AFIJO 5","group":"AFIJO","num":"5","title":"Inicio de la depreciación y cuotas atrasadas","text":"\u003cstrong>Inicio de la depreciación y cuotas atrasadas.\u003c/strong> Regla actual: cuota completa en el mes de la compra (cualquier día), sin prorrateo; un activo registrado tarde recibe \u003cstrong>una\u003c/strong> sola cuota en la primera corrida (no recupera las anteriores); no se puede capturar &quot;depreciación acumulada anterior&quot; (campo bloqueado). \u003cem>Propuesta:\u003c/em> conservar la regla de inicio, añadir \u003ccode>in_service_date\u003c/code> (por omisión = fecha de compra), y permitir un \u003cstrong>saldo inicial acumulado\u003c/strong> por activo en el alta para los que ya traían depreciación; para los registrados tarde, una corrida de &quot;puesta al día&quot; explícita (varias cuotas en una partida) previa confirmación. ¿Cuál es el criterio contable correcto: fecha de compra o de puesta en servicio? \u003cstrong>[revisar contra la norma vigente]\u003c/strong>","proposal":"conservar la regla de inicio, añadir \u003ccode>in_service_date\u003c/code> (por omisión = fecha de compra), y permitir un \u003cstrong>saldo inicial acumulado\u003c/strong> por activo en el alta para los que ya traían depreciación; para los registrados tarde, una corrida de &quot;puesta al día&quot; explícita (varias cuotas en una partida) previa confirmación. ¿Cuál es el criterio contable correcto: fecha de compra o de puesta en servicio? \u003cstrong>[revisar contra la norma vigente]\u003c/strong>","who":"","section":"B. Depreciación (lo que mueve dinero)","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P7"],"id":"AFIJO 6","group":"AFIJO","num":"6","title":"Corridas con huecos o fuera de orden","text":"\u003cstrong>Corridas con huecos o fuera de orden.\u003c/strong> El sistema deja correr cualquier mes (solo prohíbe repetirlo) y un mes saltado alarga la vida del activo un mes. \u003cem>Propuesta:\u003c/em> exigir que el mes anterior esté corrido (o confirmar saltarlo) y no permitir corrida en un período cerrado del libro mayor.","proposal":"exigir que el mes anterior esté corrido (o confirmar saltarlo) y no permitir corrida en un período cerrado del libro mayor.","who":"","section":"B. Depreciación (lo que mueve dinero)","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P24"],"id":"AFIJO 7","group":"AFIJO","num":"7","title":"Depreciación fiscal vs financiera y vida útil","text":"\u003cstrong>Depreciación fiscal vs financiera y vida útil.\u003c/strong> 140 de 143 activos tienen 2 años de vida (cuota 1/24 mensual); hay 3, 4 y 8 años en uno cada uno. Solo existe un plan por activo. ¿El plazo de 2 años obedece a la norma fiscal, a una política del cliente o a ambas? ¿Se necesitan dos libros (financiero y fiscal) o un solo plan? ¿Hay tasas máximas por clase? \u003cstrong>[revisar contra la norma vigente]\u003c/strong>. \u003cem>Propuesta:\u003c/em> un solo plan por activo, con vida útil por categoría como valor por omisión (editable) y sin validar contra tasas fiscales hasta tener la norma.","proposal":"un solo plan por activo, con vida útil por categoría como valor por omisión (editable) y sin validar contra tasas fiscales hasta tener la norma.","who":"","section":"B. Depreciación (lo que mueve dinero)","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"AFIJO 8","group":"AFIJO","num":"8","title":"Redondeo y última cuota","text":"\u003cstrong>Redondeo y última cuota.\u003c/strong> La cuota se redondea a centavos y la última cuota es el saldo; esa rama no se ha ejercido en producción (ningún activo ha terminado). \u003cem>Propuesta:\u003c/em> mantener y cubrirla con pruebas. ¿El contador acepta la diferencia de centavos en la última cuota?","proposal":"mantener y cubrirla con pruebas. ¿El contador acepta la diferencia de centavos en la última cuota?","who":"","section":"B. Depreciación (lo que mueve dinero)","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P13"],"id":"AFIJO 9","group":"AFIJO","num":"9","title":"Activos &quot;No Depreciables&quot;","text":"\u003cstrong>Activos &quot;No Depreciables&quot;.\u003c/strong> El tipo se captura pero la corrida lo ignora: \u003cstrong>11 de los 13 activos no depreciables y el de tipo 0 han sido depreciados\u003c/strong> 14 meses. \u003cem>Propuesta:\u003c/em> respetar el tipo (no entran en la corrida). Pero primero confirmar con el cliente cuál es la intención: ¿están mal clasificados (y deben seguir depreciando) o mal calculados (terrenos, obras en proceso) y hay que revertir sus depreciaciones? Resolver antes de la primera corrida en el sistema nuevo.","proposal":"respetar el tipo (no entran en la corrida). Pero primero confirmar con el cliente cuál es la intención: ¿están mal clasificados (y deben seguir depreciando) o mal calculados (terrenos, obras en proceso) y hay que revertir sus depreciaciones? Resolver antes de la primera corrida en el sistema nuevo.","who":"","section":"B. Depreciación (lo que mueve dinero)","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"AFIJO 10","group":"AFIJO","num":"10","title":"&quot;Porcentaje&quot; y &quot;Depre Anual&quot;","text":"\u003cstrong>&quot;Porcentaje&quot; y &quot;Depre Anual&quot;.\u003c/strong> Son informativos (el porcentaje se teclea; 132 de 143 = 100 / años). \u003cem>Propuesta:\u003c/em> mostrarlos calculados y no migrarlos.","proposal":"mostrarlos calculados y no migrarlos.","who":"","section":"B. Depreciación (lo que mueve dinero)","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"AFIJO 11","group":"AFIJO","num":"11","title":"Activo totalmente depreciado","text":"\u003cstrong>Activo totalmente depreciado.\u003c/strong> El indicador &quot;Activo Depreciado&quot; nunca se marca; el activo simplemente sale de la corrida, queda en el listado y su valor en libros es el residual. \u003cem>Propuesta:\u003c/em> estado derivado &quot;totalmente depreciado&quot; y reporte de activos totalmente depreciados todavía en uso. ¿Se necesita una acción para sacarlos de los listados?","proposal":"estado derivado &quot;totalmente depreciado&quot; y reporte de activos totalmente depreciados todavía en uso. ¿Se necesita una acción para sacarlos de los listados?","who":"","section":"B. Depreciación (lo que mueve dinero)","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P24"],"id":"AFIJO 12","group":"AFIJO","num":"12","title":"Cambios a un activo con depreciación","text":"\u003cstrong>Cambios a un activo con depreciación.\u003c/strong> Se puede editar costo, años o residual en cualquier momento; el pasado no cambia y la cuota restante se reparte como se pueda. \u003cem>Propuesta:\u003c/em> al cambiar costo, vida o residual de un activo con líneas, recalcular la cuota como \u003ccode>(valor depreciable − acumulado) / cuotas restantes\u003c/code>, pedir confirmación y dejar bitácora; no recalcular meses ya corridos. ¿Es esa la regla que usa el contador?","proposal":"al cambiar costo, vida o residual de un activo con líneas, recalcular la cuota como \u003ccode>(valor depreciable − acumulado) / cuotas restantes\u003c/code>, pedir confirmación y dejar bitácora; no recalcular meses ya corridos. ¿Es esa la regla que usa el contador?","who":"","section":"B. Depreciación (lo que mueve dinero)","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"AFIJO 13","group":"AFIJO","num":"13","title":"Valor residual","text":"\u003cstrong>Valor residual.\u003c/strong> La columna legada es de 2 dígitos (142 en cero, 1 desbordado). \u003cem>Propuesta:\u003c/em> migrar \u003ccode>residual = costo − valor a depreciar\u003c/code> y confirmar con el cliente el residual real del activo desbordado (su cuota guardada es correcta).","proposal":"migrar \u003ccode>residual = costo − valor a depreciar\u003c/code> y confirmar con el cliente el residual real del activo desbordado (su cuota guardada es correcta).","who":"","section":"B. Depreciación (lo que mueve dinero)","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P25"],"id":"AFIJO 14","group":"AFIJO","num":"14","title":"Bajas, ventas y descartes","text":"\u003cstrong>Bajas, ventas y descartes.\u003c/strong> No hay función; el campo &quot;Cuenta Contable Pérdida del Activo&quot; está en 3 activos y no se usa. ¿Cómo registra hoy el cliente una baja o venta (partida manual)? \u003cem>Propuesta:\u003c/em> construir \u003ccode>fa_disposals\u003c/code>: fecha, tipo, importe de venta, acumulado al corte, valor en libros, ganancia/pérdida y partida por el contrato del libro mayor. Preguntas: ¿se deprecia el mes de la baja (completo, medio, nada)? ¿Qué cuentas de ganancia y pérdida? Mientras no haya respuesta, el activo se desactiva sin partida y se avisa.","proposal":"construir \u003ccode>fa_disposals\u003c/code>: fecha, tipo, importe de venta, acumulado al corte, valor en libros, ganancia/pérdida y partida por el contrato del libro mayor. Preguntas: ¿se deprecia el mes de la baja (completo, medio, nada)? ¿Qué cuentas de ganancia y pérdida? Mientras no haya respuesta, el activo se desactiva sin partida y se avisa.","who":"","section":"C. Bajas, ventas y movimientos del activo (no existen hoy)","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"AFIJO 15","group":"AFIJO","num":"15","title":"Mejoras y adiciones","text":"\u003cstrong>Mejoras y adiciones.\u003c/strong> No existen (se editaría el costo o se crearía otro activo). \u003cem>Propuesta:\u003c/em> no construir; se registra como un activo nuevo ligado al original. ¿Algún cliente capitaliza mejoras sobre el activo existente?","proposal":"no construir; se registra como un activo nuevo ligado al original. ¿Algún cliente capitaliza mejoras sobre el activo e
