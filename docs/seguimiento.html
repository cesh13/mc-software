vez, sin rangos de fechas a mano. Con producción, Inventario contabiliza las existencias y Producción solo su absorción de costos.","who":"contador","section":"Las 30 que más importan","status":"abierta","doc":"docs/legacy/PREGUNTAS.md","refs":["INV 44","INV 45","INV 48","CXC 16"],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/PREGUNTAS.md"},{"statusNote":"","date":"","usedBy":["Fase 0"],"id":"P2","group":"P","num":"2","title":"¿Aprueban que las partidas creadas por Bancos, Cobros, Producción, Activo fijo y Planilla queden marcadas con su origen, enlazadas a su documento y sin edición manual (se corrigen anulando y regenerando)? ¿Se editó alguna a propósito en Contabilidad?","text":"¿Aprueban que las partidas creadas por Bancos, Cobros, Producción, Activo fijo y Planilla queden marcadas con su origen, enlazadas a su documento y sin edición manual (se corrigen anulando y regenerando)? ¿Se editó alguna a propósito en Contabilidad? \u003cstrong>Qué cambia:\u003c/strong> Si hay ediciones legítimas, hará falta un ajuste manual aparte. Cambia cómo se importa el historial.","proposal":"Sí: origen y enlace en cada partida; corrección por anulación; las partidas viejas se importan con el origen deducido.","who":"contador y administrador del sistema","section":"Las 30 que más importan","status":"abierta","doc":"docs/legacy/PREGUNTAS.md","refs":["BANCOC 14","BANCOC 16","BANCOC 21","CXC 12","CXC 14","AFIJO 23","LOTE 21","PLAN 7.1","CONTAC 14","CONTAC 16"],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/PREGUNTAS.md"},{"statusNote":"El programa es \u003ccode>factura-electronica-mc\u003c/code> (ver dte/). Falta confirmar desde qué fecha cada cliente está en producción.","date":"2026-11-12","usedBy":["Fase 4"],"id":"P3","group":"P","num":"3","title":"¿Qué programa firma y transmite hoy las facturas electrónicas, quién lo mantiene y dónde corre? ¿Desde qué fecha los documentos son de producción? ¿Se reemplaza por un módulo nuestro?","text":"¿Qué programa firma y transmite hoy las facturas electrónicas, quién lo mantiene y dónde corre? ¿Desde qué fecha los documentos son de producción? ¿Se reemplaza por un módulo nuestro? \u003cstrong>Qué cambia:\u003c/strong> Sin esto no se puede diseñar firma, transmisión ni contingencia. Define la prioridad del módulo de facturación electrónica.","proposal":"Que nos den nombre, proveedor y configuración; proponemos reemplazarlo con un módulo propio y mantener el actual en paralelo mientras tanto.","who":"proveedor externo y administrador","section":"Las 30 que más importan","status":"parcial","doc":"docs/legacy/PREGUNTAS.md","refs":["INV 1","INV 2","IVA 18","CXC 34"],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/PREGUNTAS.md"},{"statusNote":"","date":"","usedBy":["Fase 3"],"id":"P4","group":"P","num":"4","title":"El IVA percibido, ¿debe calcularse con la misma tasa que el retenido o con una tasa propia? ¿Y en las notas de crédito de consumidor final, el valor se resta o se suma?","text":"El IVA percibido, ¿debe calcularse con la misma tasa que el retenido o con una tasa propia? ¿Y en las notas de crédito de consumidor final, el valor se resta o se suma? \u003cstrong>Qué cambia:\u003c/strong> Cambia el IVA de libros y partidas. Hoy podría estar mal calculado.","proposal":"Dos tasas separadas, cada una confirmada por el contador (norma). Valor inicial: Bancos propone el actual, IVA propone corregir a la tasa de percepción. Nota de crédito como reverso de la factura.","who":"contador","section":"Las 30 que más importan","status":"abierta","doc":"docs/legacy/PREGUNTAS.md","refs":["BANCOC 23","IVA 8","CXC 9","INV 12"],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/PREGUNTAS.md"},{"statusNote":"","date":"","usedBy":["Fase 3"],"id":"P5","group":"P","num":"5","title":"¿A partir de qué monto se retiene o percibe el IVA (ventas, compras, consumidor final) y desde qué fecha rige cada tasa? ¿Algún cliente usa una tasa distinta (zona franca, régimen especial)?","text":"¿A partir de qué monto se retiene o percibe el IVA (ventas, compras, consumidor final) y desde qué fecha rige cada tasa? ¿Algún cliente usa una tasa distinta (zona franca, régimen especial)? \u003cstrong>Qué cambia:\u003c/strong> Qué documentos retienen o no; cuadre de libros y anexos.","proposal":"Tasas y montos mínimos por empresa, con fecha de vigencia (norma). Mientras tanto, sin mínimo para retener en compras, como hoy.","who":"contador","section":"Las 30 que más importan","status":"abierta","doc":"docs/legacy/PREGUNTAS.md","refs":["BANCOC 24","IVA 7","IVA 9"],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/PREGUNTAS.md"},{"statusNote":"","date":"","usedBy":["Fase 1"],"id":"P6","group":"P","num":"6","title":"¿Prefieren una partida por cada documento o una partida resumen por lote o período? ¿Cada cuánto se genera, y con qué detalle la espera el contador (por activo, por empleado, por concepto)?","text":"¿Prefieren una partida por cada documento o una partida resumen por lote o período? ¿Cada cuánto se genera, y con qué detalle la espera el contador (por activo, por empleado, por concepto)? \u003cstrong>Qué cambia:\u003c/strong> Cantidad de partidas, facilidad de auditar y de conciliar.","proposal":"Resumen por lote o corrida con el detalle consultable; opción de una partida por documento; sin rangos libres de fechas.","who":"contador","section":"Las 30 que más importan","status":"abierta","doc":"docs/legacy/PREGUNTAS.md","refs":["BANCOC 26","CXC 16","LOTE 21","AFIJO 19","AFIJO 20","PLAN 7.2","INV 47"],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/PREGUNTAS.md"},{"statusNote":"","date":"","usedBy":["Fase 0"],"id":"P7","group":"P","num":"7","title":"¿Quién puede reabrir un mes cerrado (contabilidad, cartera, inventario, IVA, planilla), con qué motivo y con qué rastro? ¿Debe prohibirse siempre procesar, anular o depreciar en un mes cerrado? ¿Cómo se corrige algo ya presentado?","text":"¿Quién puede reabrir un mes cerrado (contabilidad, cartera, inventario, IVA, planilla), con qué motivo y con qué rastro? ¿Debe prohibirse siempre procesar, anular o depreciar en un mes cerrado? ¿Cómo se corrige algo ya presentado? \u003cstrong>Qué cambia:\u003c/strong> Hoy se reabre sin rastro. Define el flujo de correcciones. Si algún cliente depende de procesar en meses cerrados, cambia.","proposal":"Solo el supervisor, con motivo y bitácora; el cierre contable manda; correcciones como ajuste en el período abierto.","who":"dueño del negocio y contador","section":"Las 30 que más importan","status":"abierta","doc":"docs/legacy/PREGUNTAS.md","refs":["CXC 15","IVA 26","IVA 27","INV 31","INV 32","LOTE 16","AFIJO 6","AFIJO 33","PLAN 6.3"],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/PREGUNTAS.md"},{"statusNote":"","date":"","usedBy":["Fase 1"],"id":"P8","group":"P","num":"8","title":"Al anular un documento, ¿se conserva su número y se anula también su partida (en vez de dejarla en ceros)? ¿Quién puede anular y se exige un motivo?","text":"Al anular un documento, ¿se conserva su número y se anula también su partida (en vez de dejarla en ceros)? ¿Quién puede anular y se exige un motivo? \u003cstrong>Qué cambia:\u003c/strong> Reportes de documentos emitidos y control de numeración.","proposal":"Número conservado y partida anulada; motivo obligatorio; solo el supervisor anula cheques impresos, corridas procesadas y documentos con pagos.","who":"contador","section":"Las 30 que más importan","status":"abierta","doc":"docs/legacy/PREGUNTAS.md","refs":["BANCOC 19","LOTE 13","AFIJO 32"],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/PREGUNTAS.md"},{"statusNote":"","date":"","usedBy":["Fase 0"],"id":"P9","group":"P","num":"9","title":"¿Qué puede hacer cada tipo de usuario? En concreto: ¿el digitador debe ver reportes? ¿Quién anula, reabre, contabiliza, cierra planilla, cambia códigos, ve costos y ve sueldos? ¿Se necesita mantener permisos pantalla por pantalla?","text":"¿Qué puede hacer cada tipo de usuario? En concreto: ¿el digitador debe ver reportes? ¿Quién anula, reabre, contabiliza, cierra planilla, cambia códigos, ve costos y ve sueldos? ¿Se necesita mantener permisos pantalla por pantalla? \u003cstrong>Qué cambia:\u003c/strong> Define los roles y qué queda registrado.","proposal":"Tres permisos (capturar, ver reportes, supervisar), más &quot;ver costos&quot; y &quot;ver sueldos&quot; por separado; acciones sensibles solo para supervisor y todo con bitácora.","who":"dueño del negocio y administrador","section":"Las 30 que más importan","status":"abierta","doc":"docs/legacy/PREGUNTAS.md","refs":["CONTAC 12","BANCOC 30","IVA 37","IVA 38","CXC 6","CXC 36","INV 33","INV 49","LOTE 32","AFIJO 31","PLAN 6.1","PLAN 6.2","PLAN 6.4"],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/PREGUNTAS.md"},{"statusNote":"","date":"","usedBy":["Fase 4","Fase 5"],"id":"P10","group":"P","num":"10","title":"¿El costo aceptado es el promedio por producto (todas las bodegas)? ¿El costo de una venta debe quedar fijo al facturar aunque el cierre de mes vuelva a valuar? ¿Las devoluciones reingresan al costo de la venta original y se limitan a lo vendido?","text":"¿El costo aceptado es el promedio por producto (todas las bodegas)? ¿El costo de una venta debe quedar fijo al facturar aunque el cierre de mes vuelva a valuar? ¿Las devoluciones reingresan al costo de la venta original y se limitan a lo vendido? \u003cstrong>Qué cambia:\u003c/strong> Costo de ventas, valor del inventario y paridad de reportes.","proposal":"Promedio por producto, fijo al emitir, con ajustes explícitos; devoluciones al costo original y validadas contra el documento (salvo permiso).","who":"contador","section":"Las 30 que más importan","status":"abierta","doc":"docs/legacy/PREGUNTAS.md","refs":["INV 14","INV 15","INV 27","INV 28","LOTE 14"],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/PREGUNTAS.md"},{"statusNote":"","date":"","usedBy":["Fase 4","Fase 5"],"id":"P11","group":"P","num":"11","title":"¿Debe impedirse vender o producir sin existencia suficiente?","text":"¿Debe impedirse vender o producir sin existencia suficiente? \u003cstrong>Qué cambia:\u003c/strong> Flujo de facturación y de producción.","proposal":"Bloquear por omisión, configurable por empresa, con permiso del supervisor para casos especiales.","who":"dueño del negocio","section":"Las 30 que más importan","status":"abierta","doc":"docs/legacy/PREGUNTAS.md","refs":["INV 29","LOTE 15"],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/PREGUNTAS.md"},{"statusNote":"","date":"","usedBy":["Fase 4"],"id":"P12","group":"P","num":"12","title":"Cuando las existencias guardadas no coinciden con los movimientos, ¿cuál cifra es la correcta? ¿Se corrigen antes de migrar los productos sin costo?","text":"Cuando las existencias guardadas no coinciden con los movimientos, ¿cuál cifra es la correcta? ¿Se corrigen antes de migrar los productos sin costo? \u003cstrong>Qué cambia:\u003c/strong> Cifras de inventario migradas.","proposal":"Calcular las existencias desde los movimientos; entregarles la lista de productos con diferencia; corregir costos en cero antes de migrar.","who":"contador","section":"Las 30 que más importan","status":"abierta","doc":"docs/legacy/PREGUNTAS.md","refs":["INV 30","INV 37"],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/PREGUNTAS.md"},{"statusNote":"","date":"","usedBy":["Fase 2"],"id":"P13","group":"P","num":"13","title":"Los activos marcados &quot;no depreciables&quot; se han depreciado igual (mes tras mes). ¿Están mal clasificados o mal calculados (terrenos, obras en proceso)? ¿Deben revertirse esas depreciaciones?","text":"Los activos marcados &quot;no depreciables&quot; se han depreciado igual (mes tras mes). ¿Están mal clasificados o mal calculados (terrenos, obras en proceso)? ¿Deben revertirse esas depreciaciones? \u003cstrong>Qué cambia:\u003c/strong> Gasto por depreciación y depreciación acumulada.","proposal":"Respetar el tipo; resolver caso por caso antes de la primera corrida en el sistema nuevo.","who":"contador","section":"Las 30 que más importan","status":"abierta","doc":"docs/legacy/PREGUNTAS.md","refs":["AFIJO 9"],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/PREGUNTAS.md"},{"statusNote":"","date":"","usedBy":["Fase 2"],"id":"P14","group":"P","num":"14","title":"En dos meses (2023-01 y 2023-02) la partida de depreciación en Contabilidad tiene el doble del total de la corrida de activo fijo. ¿Se editaron a mano, se corrió dos veces? ¿Cuál cifra es la correcta?","text":"En dos meses (2023-01 y 2023-02) la partida de depreciación en Contabilidad tiene el doble del total de la corrida de activo fijo. ¿Se editaron a mano, se corrió dos veces? ¿Cuál cifra es la correcta? \u003cstrong>Qué cambia:\u003c/strong> Saldo de depreciación acumulada.","proposal":"Importar esas dos partidas como &quot;importadas&quot;, reportar la diferencia y no usarlas para comparar hasta tener respuesta.","who":"contador","section":"Las 30 que más importan","status":"abierta","doc":"docs/legacy/PREGUNTAS.md","refs":["AFIJO 21"],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/PREGUNTAS.md"},{"statusNote":"","date":"","usedBy":[],"id":"P15","group":"P","num":"15","title":"El libro mayor no tiene partidas de 2020-04 a 2021-10. ¿Se depuraron o están en otro respaldo? ¿Qué cifra vale en las partidas con líneas repetidas o desactualizadas, y qué se hace con saldos de meses sin partidas (2012-12 y 2021-09)?","text":"El libro mayor no tiene partidas de 2020-04 a 2021-10. ¿Se depuraron o están en otro respaldo? ¿Qué cifra vale en las partidas con líneas repetidas o desactualizadas, y qué se hace con saldos de meses sin partidas (2012-12 y 2021-09)? \u003cstrong>Qué cambia:\u003c/strong> Saldos de apertura y cuadre de balances.","proposal":"Importar lo que existe, informar las diferencias y no inventar partidas; apertura con una sola partida donde falte historial (decidido en CONTAC 4).","who":"administrador y contador","section":"Las 30 que más importan","status":"abierta","doc":"docs/legacy/PREGUNTAS.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/PREGUNTAS.md"},{"statusNote":"","date":"","usedBy":["Fase 6"],"id":"P16","group":"P","num":"16","title":"¿Qué versión del cálculo de planilla es la que se usa para pagar hoy (existen varias, una de 2025 fuera del proyecto)? ¿Qué tasas y topes regían en cada quincena anterior?","text":"¿Qué versión del cálculo de planilla es la que se usa para pagar hoy (existen varias, una de 2025 fuera del proyecto)? ¿Qué tasas y topes regían en cada quincena anterior? \u003cstrong>Qué cambia:\u003c/strong> Base de todo el cálculo y de la comprobación.","proposal":"Comparar el cálculo contra las 48 quincenas cerradas; conservar los importes históricos; cargar parámetros desde la primera corrida actual.","who":"contador y administrador","section":"Las 30 que más importan","status":"abierta","doc":"docs/legacy/PREGUNTAS.md","refs":["PLAN 2.4","PLAN 3.5"],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/PREGUNTAS.md"},{"statusNote":"","date":"","usedBy":["Fase 6"],"id":"P17","group":"P","num":"17","title":"Retención de renta: ¿los topes y la tabla del sistema corresponden a mes o a quincena? ¿Cómo se regulariza en junio y diciembre? ¿Qué se hace con quien entra a mitad de año o viene de otro empleo? ¿Se resta el FSV de la base? (norma)","text":"Retención de renta: ¿los topes y la tabla del sistema corresponden a mes o a quincena? ¿Cómo se regulariza en junio y diciembre? ¿Qué se hace con quien entra a mitad de año o viene de otro empleo? ¿Se resta el FSV de la base? (norma) \u003cstrong>Qué cambia:\u003c/strong> Retención de cada empleado.","proposal":"Cada tabla con su período explícito; ajuste anual explícito en lugar de la regularización actual; tabla sin huecos; el contador confirma cada concepto.","who":"contador","section":"Las 30 que más importan","status":"abierta","doc":"docs/legacy/PREGUNTAS.md","refs":["PLAN 3.1","PLAN 3.2","PLAN 3.3","PLAN 3.4"],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/PREGUNTAS.md"},{"statusNote":"","date":"","usedBy":["Fase 6"],"id":"P18","group":"P","num":"18","title":"Incapacidades, horas extras y días: ¿cómo se pagan las incapacidades (ISSS, patrono, ambos)? ¿Cuál es el valor correcto del día? ¿Qué clases de horas extra usan y con qué recargo? ¿Cuántos días tiene la 2.ª quincena para quien gana el mínimo? (norma)","text":"Incapacidades, horas extras y días: ¿cómo se pagan las incapacidades (ISSS, patrono, ambos)? ¿Cuál es el valor correcto del día? ¿Qué clases de horas extra usan y con qué recargo? ¿Cuántos días tiene la 2.ª quincena para quien gana el mínimo? (norma) \u003cstrong>Qué cambia:\u003c/strong> Montos de pago.","proposal":"Día = salario mensual entre 30; catálogo de recargos con vigencia; un solo criterio de días.","who":"contador","section":"Las 30 que más importan","status":"abierta","doc":"docs/legacy/PREGUNTAS.md","refs":["PLAN 4.1","PLAN 4.2","PLAN 4.3"],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/PREGUNTAS.md"},{"statusNote":"","date":"","usedBy":["Fase 6"],"id":"P19","group":"P","num":"19","title":"Vacaciones, aguinaldo, indemnización y retención de procuraduría: ¿las fórmulas del sistema anterior (prima, días por antigüedad, fecha de corte, pago en cuotas) son las que se aplican? (norma)","text":"Vacaciones, aguinaldo, indemnización y retención de procuraduría: ¿las fórmulas del sistema anterior (prima, días por antigüedad, fecha de corte, pago en cuotas) son las que se aplican? (norma) \u003cstrong>Qué cambia:\u003c/strong> Liquidaciones y prestaciones.","proposal":"Todo parametrizado con vigencia; el contador revisa cada fórmula antes de que la construyamos.","who":"contador","section":"Las 30 que más importan","status":"abierta","doc":"docs/legacy/PREGUNTAS.md","refs":["PLAN 5.1","PLAN 5.2","PLAN 5.3","PLAN 5.4","PLAN 5.6"],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/PREGUNTAS.md"},{"statusNote":"","date":"","usedBy":["Fase 6"],"id":"P20","group":"P","num":"20","title":"La partida de planilla actual omite varios conceptos y puede salir descuadrada. ¿Qué hace hoy el contador con la diferencia? ¿Se contabilizan mes a mes las provisiones de aguinaldo, vacaciones e indemnización o al pagar? ¿Contra qué cuenta sale el pago neto?","text":"La partida de planilla actual omite varios conceptos y puede salir descuadrada. ¿Qué hace hoy el contador con la diferencia? ¿Se contabilizan mes a mes las provisiones de aguinaldo, vacaciones e indemnización o al pagar? ¿Contra qué cuenta sale el pago neto? \u003cstrong>Qué cambia:\u003c/strong> Contabilización de planilla.","proposal":"Partida generada desde los conceptos (cuadra por construcción); provisiones patronales por concepto; cuenta de pago por empresa.","who":"contador","section":"Las 30 que más importan","status":"abierta","doc":"docs/legacy/PREGUNTAS.md","refs":["PLAN 5.5","PLAN 7.3","PLAN 7.4","PLAN 7.5"],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/PREGUNTAS.md"},{"statusNote":"","date":"","usedBy":["Fase 3","Fase 4"],"id":"P21","group":"P","num":"21","title":"Exportaciones: ¿van sin IVA y con destino propio en el libro? ¿Cómo se contabiliza el flete de exportación? ¿El IVA se redondea por línea o sobre el total, y el consumidor final se calcula una vez al mes? (norma)","text":"Exportaciones: ¿van sin IVA y con destino propio en el libro? ¿Cómo se contabiliza el flete de exportación? ¿El IVA se redondea por línea o sobre el total, y el consumidor final se calcula una vez al mes? (norma) \u003cstrong>Qué cambia:\u003c/strong> Cálculo de IVA en facturas y libros.","proposal":"Exportación sin IVA; redondeo por línea con total igual a la suma (a elegir por el contador); mantener la fórmula mensual del libro para cuadrar al centavo.","who":"contador","section":"Las 30 que más importan","status":"abierta","doc":"docs/legacy/PREGUNTAS.md","refs":["CXC 10","INV 11","INV 13","INV 23","IVA 11"],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/PREGUNTAS.md"},{"statusNote":"","date":"","usedBy":["Fase 1"],"id":"P22","group":"P","num":"22","title":"Impuesto a las operaciones financieras: ¿a qué documentos se aplica (cheques, transferencias, ambos) y siempre sobre el monto del documento? ¿El umbral de 1,000 es el vigente? (norma)","text":"Impuesto a las operaciones financieras: ¿a qué documentos se aplica (cheques, transferencias, ambos) y siempre sobre el monto del documento? ¿El umbral de 1,000 es el vigente? (norma) \u003cstrong>Qué cambia:\u003c/strong> Impuesto que se genera o no.","proposal":"Tasa y umbral configurables; aplicar a cheques y transferencias de salida de cuentas no exentas.","who":"contador","section":"Las 30 que más importan","status":"abierta","doc":"docs/legacy/PREGUNTAS.md","refs":["BANCOC 13"],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/PREGUNTAS.md"},{"statusNote":"","date":"","usedBy":["Fase 1"],"id":"P23","group":"P","num":"23","title":"¿Quién es el dueño del documento de compra: Cuentas por pagar e IVA, o Inventario?","text":"¿Quién es el dueño del documento de compra: Cuentas por pagar e IVA, o Inventario? \u003cstrong>Qué cambia:\u003c/strong> Cómo se capturan y enlazan las compras.","proposal":"Cuentas por pagar e IVA son dueños del documento; Inventario recibe la mercadería y lo referencia; el libro de IVA se arma desde los documentos, con captura manual para gastos.","who":"administrador y contador","section":"Las 30 que más importan","status":"abierta","doc":"docs/legacy/PREGUNTAS.md","refs":["IVA 1","INV 41","BANCOC 29"],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/PREGUNTAS.md"},{"statusNote":"","date":"","usedBy":["Fase 2"],"id":"P24","group":"P","num":"24","title":"Depreciación: ¿cuenta la fecha de compra o la de puesta en servicio? ¿Los 2 años de vida útil obedecen a la norma, a una política o a ambas? ¿Un plan por activo o dos libros (financiero y fiscal)? ¿Algún cliente usa otro método? ¿Cómo se ajusta la cuota si cambia el costo o la vida? (norma)","text":"Depreciación: ¿cuenta la fecha de compra o la de puesta en servicio? ¿Los 2 años de vida útil obedecen a la norma, a una política o a ambas? ¿Un plan por activo o dos libros (financiero y fiscal)? ¿Algún cliente usa otro método? ¿Cómo se ajusta la cuota si cambia el costo o la vida? (norma) \u003cstrong>Qué cambia:\u003c/strong> Cuota mensual y gasto del período.","proposal":"Línea recta; fecha de servicio igual a la de compra por omisión; un plan por activo; saldo inicial acumulado permitido; recalcular la cuota restante con confirmación.","who":"contador","section":"Las 30 que más importan","status":"abierta","doc":"docs/legacy/PREGUNTAS.md","refs":["AFIJO 4","AFIJO 5","AFIJO 7","AFIJO 12"],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/PREGUNTAS.md"},{"statusNote":"","date":"","usedBy":["Fase 2"],"id":"P25","group":"P","num":"25","title":"¿Cómo se registra hoy la baja o venta de un activo (partida manual)? ¿Se deprecia el mes de la baja? ¿Qué cuentas de ganancia y pérdida se usan?","text":"¿Cómo se registra hoy la baja o venta de un activo (partida manual)? ¿Se deprecia el mes de la baja? ¿Qué cuentas de ganancia y pérdida se usan? \u003cstrong>Qué cambia:\u003c/strong> Falta una función completa del módulo.","proposal":"Construir bajas con su partida; mientras no haya respuesta, desactivar el activo y avisar.","who":"contador","section":"Las 30 que más importan","status":"abierta","doc":"docs/legacy/PREGUNTAS.md","refs":["AFIJO 14"],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/PREGUNTAS.md"},{"statusNote":"","date":"","usedBy":["Fase 2"],"id":"P26","group":"P","num":"26","title":"Cuentas y centros de costo: ¿pueden confirmar la cuenta contable de cada tipo de operación (ventas, IVA, cobros, inventario, absorción de producción, activos, planilla)? ¿Se completan antes de migrar los productos sin cuenta? ¿Cómo se relacionan los dos centros de costo (planilla y activo fijo contra contabilidad), y el abono de depreciación debe llevar centro?","text":"Cuentas y centros de costo: ¿pueden confirmar la cuenta contable de cada tipo de operación (ventas, IVA, cobros, inventario, absorción de producción, activos, planilla)? ¿Se completan antes de migrar los productos sin cuenta? ¿Cómo se relacionan los dos centros de costo (planilla y activo fijo contra contabilidad), y el abono de depreciación debe llevar centro? \u003cstrong>Qué cambia:\u003c/strong> Dónde cae cada importe en los reportes.","proposal":"Un solo catálogo de centros de costo (el de contabilidad) con correspondencia al migrar; cuentas por omisión en la categoría o la empresa; validar contra el plan de cuentas vigente.","who":"contador","section":"Las 30 que más importan","status":"abierta","doc":"docs/legacy/PREGUNTAS.md","refs":["CXC 13","INV 46","AFIJO 22","AFIJO 24","AFIJO 25","LOTE 22","PLAN 1.4"],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/PREGUNTAS.md"},{"statusNote":"","date":"","usedBy":["Fase 4"],"id":"P27","group":"P","num":"27","title":"Datos inconsistentes (documentos repetidos, terceros inexistentes, totales que no cuadran, filas sin código, órdenes pendientes antiguas): ¿se corrigen en el sistema anterior antes de migrar o se importan tal cual con un reporte? ¿Quién decide caso por caso?","text":"Datos inconsistentes (documentos repetidos, terceros inexistentes, totales que no cuadran, filas sin código, órdenes pendientes antiguas): ¿se corrigen en el sistema anterior antes de migrar o se importan tal cual con un reporte? ¿Quién decide caso por caso? \u003cstrong>Qué cambia:\u003c/strong> Cuánta limpieza previa hay que hacer.","proposal":"Importar tal cual, reportar, y que el negocio decida cuáles corregir.","who":"administrador y contador","section":"Las 30 que más importan","status":"abierta","doc":"docs/legacy/PREGUNTAS.md","refs":["IVA 16","IVA 28","IVA 29","CXC 30","LOTE 31","PLAN 2.3"],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/PREGUNTAS.md"},{"statusNote":"","date":"","usedBy":["Fase 1"],"id":"P28","group":"P","num":"28","title":"Antigüedad de saldos: ¿se cuenta desde la fecha del documento o desde el vencimiento? ¿Qué tramos usan (cobrar y pagar)?","text":"Antigüedad de saldos: ¿se cuenta desde la fecha del documento o desde el vencimiento? ¿Qué tramos usan (cobrar y pagar)? \u003cstrong>Qué cambia:\u003c/strong> Reporte que debe cuadrar al centavo.","proposal":"Una antigüedad con base elegible y tramos configurables.","who":"contador","section":"Las 30 que más importan","status":"abierta","doc":"docs/legacy/PREGUNTAS.md","refs":["CXC 27","BANCOC 28"],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/PREGUNTAS.md"},{"statusNote":"","date":"","usedBy":["Fase 3","Fase 6"],"id":"P29","group":"P","num":"29","title":"Archivos de planilla: ¿qué formatos presentan hoy (planilla de ISSS, AFP, renta mensual, F910) y qué bancos usan para pagar? ¿Qué códigos de observación se usan? (norma)","text":"Archivos de planilla: ¿qué formatos presentan hoy (planilla de ISSS, AFP, renta mensual, F910) y qué bancos usan para pagar? ¿Qué códigos de observación se usan? (norma) \u003cstrong>Qué cambia:\u003c/strong> Si el archivo es aceptado o rechazado.","proposal":"Exportador configurable por banco; validar cada archivo contra el formato vigente; no repetir un error conocido en un campo del F910.","who":"contador y administrador","section":"Las 30 que más importan","status":"abierta","doc":"docs/legacy/PREGUNTAS.md","refs":["PLAN 8.1","PLAN 8.2","PLAN 8.3","PLAN 8.5"],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/PREGUNTAS.md"},{"statusNote":"","date":"","usedBy":["Fase 3"],"id":"P30","group":"P","num":"30","title":"¿Cuáles son los 15 reportes que realmente se usan en cada módulo y cuáles ya no? ¿Cuáles archivos para Hacienda presentan hoy?","text":"¿Cuáles son los 15 reportes que realmente se usan en cada módulo y cuáles ya no? ¿Cuáles archivos para Hacienda presentan hoy? \u003cstrong>Qué cambia:\u003c/strong> Alcance y plazo de cada módulo.","proposal":"Migrar los exigidos por ley y los 15 más usados; el resto bajo demanda.","who":"administrador","section":"Las 30 que más importan","status":"abierta","doc":"docs/legacy/PREGUNTAS.md","refs":["CONTAC 7","BANCOC 3","CXC 2","INV 54","LOTE 29","AFIJO 30","PLAN 8.4","IVA 20","IVA 21"],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/PREGUNTAS.md"},{"statusNote":"","date":"","usedBy":["Fase 0"],"id":"M1","group":"M","num":"1","title":"¿Cerrar el GL de un mes exige que los subledgers del mes estén cerrados, o solo advierte?","text":"¿Cerrar el GL de un mes exige que los subledgers del mes estén cerrados, o solo advierte? Propuesta: advertir.","proposal":"advertir.","who":"negocio","section":"Riesgos y decisiones abiertas","status":"abierta","doc":"docs/sistema/modulos-y-orden.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/sistema/modulos-y-orden.md"},{"statusNote":"","date":"","usedBy":[],"id":"M2","group":"M","num":"2","title":"¿Qué cliente es el primer piloto y qué módulos del legado usa de verdad?","text":"¿Qué cliente es el primer piloto y qué módulos del legado usa de verdad? Propuesta: perfil A (§3.2).","proposal":"perfil A (§3.2).","who":"negocio","section":"Riesgos y decisiones abiertas","status":"abierta","doc":"docs/sistema/modulos-y-orden.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/sistema/modulos-y-orden.md"},{"statusNote":"","date":"","usedBy":[],"id":"M3","group":"M","num":"3","title":"Terceros únicos (\u003ccode>parties\u003c/code>): al importar, ¿se unifican cliente y proveedor con el mismo NRC?","text":"Terceros únicos (\u003ccode>parties\u003c/code>): al importar, ¿se unifican cliente y proveedor con el mismo NRC? Propuesta: sí,","proposal":"sí,","who":"negocio","section":"Riesgos y decisiones abiertas","status":"abierta","doc":"docs/sistema/modulos-y-orden.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/sistema/modulos-y-orden.md"},{"statusNote":"Marcada como decidida en el documento.","date":"","usedBy":[],"id":"CONTAC 1","group":"CONTAC","num":"1","title":"Partidas descuadradas — decidido 2026-11-10","text":"\u003cstrong>Partidas descuadradas — decidido 2026-11-10\u003c/strong> (revisable si surge la necesidad). Una partida es \u003ccode>borrador\u003c/code> o \u003ccode>aplicada\u003c/code>. Un borrador puede estar descuadrado y no afecta saldos ni reportes; para aplicarla, cargos = abonos. Se elimina \u003ccode>cfg_cuadre\u003c/code>. Contexto del negocio: hoy las partidas descuadradas no son una necesidad; se descubren después, cuando el balance no cuadra, y entonces se buscan partidas descuadradas o errores de catálogo. Consecuencias: - El importador trae las partidas descuadradas del legado tal como están, marcadas, y genera un reporte por empresa de partidas descuadradas y errores de catálogo. - Se mantiene la consulta &quot;Partidas descuadradas&quot; (borradores pendientes e importadas con diferencia). - Pendiente de preguntar: ¿por qué quedan grabadas descuadradas (trabajo a medias, o vienen así de &quot;Subir Partida Contable&quot; / Bancos)? - \u003cstrong>Lo que dice el código (2026-11-12):\u003c/strong> con \u003ccode>cfg_cuadre\u003c/code> activo la captura no deja grabar descuadradas. Las vías sin control de cuadre son &quot;Subir Partida Contable&quot;, copiar partida, aplicar el cierre anual y los otros módulos. La única descuadrada en disco viene de Bancos.","proposal":"","who":"","section":"Reglas contables","status":"respondida","doc":"docs/legacy/contac/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/contac/open-questions.md"},{"statusNote":"Marcada como decidida en el documento.","date":"","usedBy":[],"id":"CONTAC 2","group":"CONTAC","num":"2","title":"Catálogo por período fiscal — decidido 2026-11-10","text":"\u003cstrong>Catálogo por período fiscal — decidido 2026-11-10.\u003c/strong> Un solo catálogo por empresa; \u003ccode>periodo.cata\u003c/code> no se migra como concepto. Las cuentas se desactivan, nunca se borran, y los cambios quedan en bitácora. Los reportes de años anteriores muestran los nombres actuales. - Sin verificar en los datos: el importador debe avisar si una empresa tiene catálogo alterno en \u003ccode>PERIODO\u003c/code>, o si un mismo código nombra cuentas distintas entre años. - \u003cstrong>Lo que dice el código (2026-11-12):\u003c/strong> \u003ccode>PERIODO\u003c/code> es el período de presupuesto, no un año fiscal, y ninguna pantalla permite capturar el catálogo alterno; en los datos está vacío.","proposal":"","who":"","section":"Reglas contables","status":"respondida","doc":"docs/legacy/contac/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/contac/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"CONTAC 3","group":"CONTAC","num":"3","title":"Tipo de cuenta &quot;Contra&quot; (7) y &quot;Orden&quot; (6)","text":"\u003cstrong>Tipo de cuenta &quot;Contra&quot; (7) y &quot;Orden&quot; (6).\u003c/strong> Confirmar cómo deben presentarse en Balance General. - \u003cstrong>Lo que hace el legado (2026-11-12):\u003c/strong> salen como dos líneas al pie, con el nombre y el saldo de la \u003cstrong>primera\u003c/strong> cuenta de cada tipo, fuera del cuadre. El Balance General solo imprime los tipos 1, 2 y 3 más una línea de utilidad o pérdida calculada como activo menos pasivo y capital.","proposal":"","who":"","section":"Reglas contables","status":"abierta","doc":"docs/legacy/contac/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/contac/open-questions.md"},{"statusNote":"Marcada como decidida en el documento.","date":"","usedBy":[],"id":"CONTAC 4","group":"CONTAC","num":"4","title":"Cierre anual — decidido 2026-11-10","text":"\u003cstrong>Cierre anual — decidido 2026-11-10.\u003c/strong> Año fiscal configurable (\u003ccode>gl_fiscal_years\u003c/code> con mes de inicio y fin), enero–diciembre por defecto. Sin partida de apertura: los saldos se calculan desde las líneas y las cuentas de balance se arrastran solas. El cierre anual funciona como hoy y la partida queda con \u003ccode>source = cierre\u003c/code>, para que el Estado de Resultados del último mes la excluya. - Migración: se importa todo el historial; donde no exista, una sola partida de apertura (\u003ccode>source = importado\u003c/code>) con el \u003ccode>saldoant\u003c/code> más antiguo de \u003ccode>SALDOS\u003c/code>. - Sin verificar en los datos: si algún cliente cierra en un mes distinto a diciembre. \u003cstrong>Corrección (2026-11-12):\u003c/strong> \u003ccode>PERIODO\u003c/code> no interviene; el cierre corre en el mes de trabajo, sea cual sea. Los cierres que hay en disco están en diciembre.","proposal":"","who":"","section":"Reglas contables","status":"respondida","doc":"docs/legacy/contac/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/contac/open-questions.md"},{"statusNote":"Marcada como decidida en el documento.","date":"","usedBy":[],"id":"CONTAC 5","group":"CONTAC","num":"5","title":"Numeración — decidido 2026-11-10","text":"\u003cstrong>Numeración — decidido 2026-11-10.\u003c/strong> Mensual por tipo de partida, igual que hoy (único: empresa + período + tipo + número). La migración no renumera. Una partida anulada conserva su número; no se reutiliza.","proposal":"","who":"","section":"Reglas contables","status":"respondida","doc":"docs/legacy/contac/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/contac/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"CONTAC 6","group":"CONTAC","num":"6","title":"Fecha de cobro","text":"\u003cstrong>Fecha de cobro\u003c/strong> (\u003ccode>fcobro\u003c/code>) en las líneas: ¿para qué se usa? - \u003cstrong>Lo que dice el código (2026-11-12):\u003c/strong> ningún programa vivo la lee ni la escribe, y está vacía en todas las líneas. Propuesta: no migrarla.","proposal":"","who":"","section":"Reglas contables","status":"abierta","doc":"docs/legacy/contac/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/contac/open-questions.md"},{"statusNote":"","date":"","usedBy":["P30"],"id":"CONTAC 7","group":"CONTAC","num":"7","title":"¿Cuáles reportes de la lista ya \u003cstrong>no\u003c/strong> se usan?","text":"¿Cuáles reportes de la lista ya \u003cstrong>no\u003c/strong> se usan? (en particular: &quot;B. Comprobación 2&quot;, &quot;Estado de Cambio&quot;, &quot;Numerar Páginas&quot;, &quot;Copiar Archivo&quot;).","proposal":"","who":"","section":"Pantallas y reportes","status":"abierta","doc":"docs/legacy/contac/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/contac/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"CONTAC 8","group":"CONTAC","num":"8","title":"Estados de resultados: hoy existen comercial, industrial, mensual, definido y comparativos.","text":"Estados de resultados: hoy existen comercial, industrial, mensual, definido y comparativos. Propuesta: un solo motor con plantillas (comercial / industrial / personalizadas).","proposal":"","who":"","section":"Pantallas y reportes","status":"abierta","doc":"docs/legacy/contac/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/contac/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"CONTAC 9","group":"CONTAC","num":"9","title":"¿Se imprimen libros legales foliados (Diario, Mayor)?","text":"¿Se imprimen libros legales foliados (Diario, Mayor)? ¿Formato exigido por Hacienda?","proposal":"","who":"","section":"Pantallas y reportes","status":"abierta","doc":"docs/legacy/contac/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/contac/open-questions.md"},{"statusNote":"Marcada como decidida en el documento.","date":"","usedBy":[],"id":"CONTAC 10","group":"CONTAC","num":"10","title":"¿Qué formato tiene el archivo de &quot;Subir Partida Contable&quot; e &quot;Importar Catálogo&quot;?","text":"¿Qué formato tiene el archivo de &quot;Subir Partida Contable&quot; e &quot;Importar Catálogo&quot;? - \u003cstrong>Respondida por el código (2026-11-12):\u003c/strong> ambos son CSV de columnas fijas (el catálogo, separado por \u003ccode>;\u003c/code>). Detalle en el \u003ca href=\"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/contac/README.md\" target=\"_blank\" rel=\"noopener\">mapa de menú\u003c/a>.","proposal":"","who":"","section":"Pantallas y reportes","status":"respondida","doc":"docs/legacy/contac/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/contac/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"CONTAC 11","group":"CONTAC","num":"11","title":"¿Algún cliente consolida empresas hoy (&quot;Generar Partida Consolidada&quot;)?","text":"¿Algún cliente consolida empresas hoy (&quot;Generar Partida Consolidada&quot;)? - \u003cstrong>La premisa era falsa (2026-11-12):\u003c/strong> esa opción es el reporte &quot;Movimientos Resumidos&quot; de una sola empresa. Nada consolida empresas en el código vivo; hubo un intento (\u003ccode>CONSOLID.PRG\u003c/code>) que quedó fuera del proyecto. La pregunta pasa a ser si se quiere consolidación como función nueva.","proposal":"","who":"","section":"Empresas y usuarios","status":"abierta","doc":"docs/legacy/contac/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/contac/open-questions.md"},{"statusNote":"","date":"","usedBy":["P9"],"id":"CONTAC 12","group":"CONTAC","num":"12","title":"¿Se necesita mantener permiso \u003cstrong>por pantalla\u003c/strong> además de los 4 niveles, o basta con roles?","text":"¿Se necesita mantener permiso \u003cstrong>por pantalla\u003c/strong> además de los 4 niveles, o basta con roles? - \u003cstrong>Lo que dice el código (2026-11-12):\u003c/strong> el permiso por pantalla es el control real (57 programas distintos en \u003ccode>PERFIL\u003c/code>); el nivel solo gobierna tres cosas. Pasar a solo roles pierde una granularidad que hoy sí se usa. Afecta el supuesto S2.","proposal":"","who":"","section":"Empresas y usuarios","status":"abierta","doc":"docs/legacy/contac/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/contac/open-questions.md"},{"statusNote":"Marcada como decidida en el documento.","date":"","usedBy":[],"id":"CONTAC 13","group":"CONTAC","num":"13","title":"Moneda — decidido 2026-11-10","text":"\u003cstrong>Moneda — decidido 2026-11-10.\u003c/strong> Una moneda por empresa (\u003ccode>core_empresas.moneda\u003c/code>, desde \u003ccode>EMPRESAS.moneda\u003c/code>), sin multimoneda: no hay tipos de cambio ni moneda por línea. Montos con dos decimales. La UI y los reportes toman el símbolo de la empresa. - Verificado (2026-11-12): la pantalla de empresas ofrece 1 = Colones, 2 = Dólares; en disco vale 2. Confirma el supuesto S17.","proposal":"","who":"","section":"Empresas y usuarios","status":"respondida","doc":"docs/legacy/contac/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/contac/open-questions.md"},{"statusNote":"","date":"","usedBy":["P2"],"id":"CONTAC 14","group":"CONTAC","num":"14","title":"Bancos","text":"\u003cstrong>Bancos:\u003c/strong> genera partidas en CONTAC (\u003ccode>generado = 1\u003c/code>) y comparte correlativos. En la plataforma nueva Bancos publicará partidas en el GL vía API interna.","proposal":"","who":"","section":"Integraciones (definir al hacer cada módulo)","status":"abierta","doc":"docs/legacy/contac/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/contac/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"CONTAC 15","group":"CONTAC","num":"15","title":"IVA","text":"\u003cstrong>IVA:\u003c/strong> &quot;Ingresar al IVA&quot; / &quot;Ingresar Renta&quot; desde una partida con cuenta de IVA crédito fiscal o renta.","proposal":"","who":"","section":"Integraciones (definir al hacer cada módulo)","status":"abierta","doc":"docs/legacy/contac/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/contac/open-questions.md"},{"statusNote":"","date":"","usedBy":["P2"],"id":"CONTAC 16","group":"CONTAC","num":"16","title":"Planilla, CxC, Inventario, Activo Fijo","text":"\u003cstrong>Planilla, CxC, Inventario, Activo Fijo:\u003c/strong> confirmar cuáles generan partidas en contabilidad.","proposal":"","who":"","section":"Integraciones (definir al hacer cada módulo)","status":"abierta","doc":"docs/legacy/contac/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/contac/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"BANCOC 1","group":"BANCOC","num":"1","title":"¿CxP se usa en todos los clientes?","text":"\u003cstrong>¿CxP se usa en todos los clientes?\u003c/strong> En el legado depende de \u003ccode>cfg_prove\u003c/code> y vive dentro de Bancos. \u003cem>Propuesta:\u003c/em> módulo \u003ccode>accounts-payable\u003c/code> propio y opcional por empresa; Bancos funciona sin él.","proposal":"módulo \u003ccode>accounts-payable\u003c/code> propio y opcional por empresa; Bancos funciona sin él.","who":"","section":"A. Alcance y destino","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"BANCOC 2","group":"BANCOC","num":"2","title":"Cheques a contratistas / control de obra","text":"\u003cstrong>Cheques a contratistas / control de obra\u003c/strong> (\u003ccode>cfg_obra\u003c/code>, tablas \u003ccode>CHEQUE\u003c/code>, \u003ccode>CONTRAT\u003c/code>, \u003ccode>copend01\u003c/code>). Apagado y sin datos aquí. \u003cem>Propuesta:\u003c/em> no migrar; ¿algún cliente lo usa?","proposal":"no migrar; ¿algún cliente lo usa?","who":"","section":"A. Alcance y destino","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":["P30"],"id":"BANCOC 3","group":"BANCOC","num":"3","title":"¿Qué reportes ya no se usan?","text":"\u003cstrong>¿Qué reportes ya no se usan?\u003c/strong> Candidatos a no migrar al inicio: Consolidado de Movimientos, Movimientos Diarios, Documentos Recibidos por Fechas, los dos históricos, Abonos por Períodos, Programación de Pagos. \u003cem>Propuesta:\u003c/em> migrar Libro Auxiliar, Saldos, Disponibilidad, Cheques emitidos/postfechados, Conciliación, Antigüedad, Estado de cuenta, Auxiliar de proveedores; el resto según respuesta.","proposal":"migrar Libro Auxiliar, Saldos, Disponibilidad, Cheques emitidos/postfechados, Conciliación, Antigüedad, Estado de cuenta, Auxiliar de proveedores; el resto según respuesta.","who":"","section":"A. Alcance y destino","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"BANCOC 4","group":"BANCOC","num":"4","title":"Sucursales","text":"\u003cstrong>Sucursales\u003c/strong> (\u003ccode>UNIDADES\u003c/code>) solo alimentan el libro de compras y están vacías. \u003cem>Propuesta:\u003c/em> mover al módulo \u003ccode>tax\u003c/code>.","proposal":"mover al módulo \u003ccode>tax\u003c/code>.","who":"","section":"A. Alcance y destino","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"BANCOC 5","group":"BANCOC","num":"5","title":"Pantallas fuera del menú","text":"\u003cstrong>Pantallas fuera del menú\u003c/strong> (\u003ccode>sbmtran\u003c/code>, \u003ccode>sbrecon\u003c/code>, \u003ccode>sbrpro01\u003c/code>, \u003ccode>cgcopipa\u003c/code>, tabla \u003ccode>REMESA\u003c/code>): ¿alguna se usó alguna vez? \u003cem>Propuesta:\u003c/em> ignorarlas.","proposal":"ignorarlas.","who":"","section":"A. Alcance y destino","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"BANCOC 6","group":"BANCOC","num":"6","title":"Tipos de cuenta","text":"\u003cstrong>Tipos de cuenta\u003c/strong> (caja, ahorros, a plazo, otra): ¿se usan además de la corriente? La tasa de interés de las cuentas a plazo nunca se guardó. \u003cem>Propuesta:\u003c/em> conservar el tipo; la tasa como campo informativo nuevo.","proposal":"conservar el tipo; la tasa como campo informativo nuevo.","who":"","section":"B. Cuentas bancarias y monedas","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"BANCOC 7","group":"BANCOC","num":"7","title":"Eliminar una cuenta bancaria o un proveedor con movimientos","text":"\u003cstrong>Eliminar una cuenta bancaria o un proveedor con movimientos\u003c/strong> hoy borra todo. \u003cem>Propuesta:\u003c/em> solo desactivar; rechazar si hay documentos no conciliados o saldo pendiente.","proposal":"solo desactivar; rechazar si hay documentos no conciliados o saldo pendiente.","who":"","section":"B. Cuentas bancarias y monedas","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"BANCOC 8","group":"BANCOC","num":"8","title":"Fecha del saldo inicial","text":"\u003cstrong>Fecha del saldo inicial\u003c/strong> (\u003ccode>fechasal\u003c/code>): ningún movimiento puede ser anterior. ¿Se quiere mantener esa regla o permitir movimientos antes (con saldo inicial 0)? \u003cem>Propuesta:\u003c/em> mantenerla.","proposal":"mantenerla.","who":"","section":"B. Cuentas bancarias y monedas","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":["Fase 1"],"id":"BANCOC 9","group":"BANCOC","num":"9","title":"Multimoneda","text":"\u003cstrong>Multimoneda.\u003c/strong> El legado tiene 5 códigos de moneda por cuenta y un tipo de cambio manual; la plataforma decidió una moneda por empresa. Aquí todas las cuentas son en dólares. \u003cem>Propuesta:\u003c/em> mantener la decisión; el importador falla con aviso si una cuenta tiene otra moneda.","proposal":"mantener la decisión; el importador falla con aviso si una cuenta tiene otra moneda.","who":"","section":"B. Cuentas bancarias y monedas","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"BANCOC 10","group":"BANCOC","num":"10","title":"Transferencias entre cuentas propias","text":"\u003cstrong>Transferencias entre cuentas propias.\u003c/strong> \u003ccode>MOVIBAN.XFER\u003c/code> y \u003ccode>sbmtran\u003c/code> sugieren que existió, pero el código (\u003ccode>estrans\u003c/code>) no está y la opción no está en el menú. \u003cem>Propuesta:\u003c/em> documento de transferencia nuevo con dos patas ligadas y una sola partida.","proposal":"documento de transferencia nuevo con dos patas ligadas y una sola partida.","who":"","section":"C. Documentos bancarios","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"BANCOC 11","group":"BANCOC","num":"11","title":"Estatus del cheque (firmado, entregado, cobrado)","text":"\u003cstrong>Estatus del cheque (firmado, entregado, cobrado):\u003c/strong> casi no hay datos. ¿Se quieren conservar los cuatro estatus? \u003cem>Propuesta:\u003c/em> sí (son casillas baratas), con fechas y quién recibe.","proposal":"sí (son casillas baratas), con fechas y quién recibe.","who":"","section":"C. Documentos bancarios","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":["Fase 1"],"id":"BANCOC 12","group":"BANCOC","num":"12","title":"Reutilización de números","text":"\u003cstrong>Reutilización de números.\u003c/strong> En el legado un cheque es único por cuenta + tipo en todo el tiempo, y los demás documentos por mes. Hay llaves de partida compartidas por dos movimientos (transferencias con dos patas). \u003cem>Propuesta:\u003c/em> cheque único por cuenta sin importar el mes; los demás por cuenta + tipo + período + número; las dos patas se modelan como dos documentos con la misma partida.","proposal":"cheque único por cuenta sin importar el mes; los demás por cuenta + tipo + período + número; las dos patas se modelan como dos documentos con la misma partida.","who":"","section":"C. Documentos bancarios","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":["P22"],"id":"BANCOC 13","group":"BANCOC","num":"13","title":"LIOF","text":"\u003cstrong>LIOF.\u003c/strong> (a) El código solo genera el impuesto cuando \u003ccode>TMOV.TIPO_OPE = 1\u003c/code> (tipos que cargan banco), no para el cheque (2), y sin embargo hay 164 líneas de impuesto y 22 documentos con la casilla marcada: ¿a qué documentos se aplica de verdad, cheques, transferencias o ambos, y es siempre sobre el monto del documento? (b) El umbral de 1,000 está fijo en el código: ¿es el valor legal vigente? \u003cem>Propuesta:\u003c/em> umbral y tasa configurables; el impuesto como línea del documento; aplicable a cheques y transferencias de salida de cuentas no exentas.","proposal":"umbral y tasa configurables; el impuesto como línea del documento; aplicable a cheques y transferencias de salida de cuentas no exentas.","who":"","section":"C. Documentos bancarios","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":["P2"],"id":"BANCOC 14","group":"BANCOC","num":"14","title":"Historial y la marca \u003ccode>generado\u003c/code>","text":"\u003cstrong>Historial y la marca \u003ccode>generado\u003c/code>.\u003c/strong> La versión actual de Bancos ya no escribe \u003ccode>generado = 1\u003c/code>; las partidas recientes vienen vacías. \u003cem>Propuesta:\u003c/em> el importador enlaza por \u003ccode>MOVIBAN\u003c/code> (salfec + tipopar + número) y marca esas partidas \u003ccode>source = 'bancos'\u003c/code> aunque \u003ccode>generado\u003c/code> esté vacío (excepción de migración); las partidas sin movimiento quedan como \u003ccode>importado\u003c/code>. Confirmar que ninguna partida de Bancos se editó legítimamente en CONTAC.","proposal":"el importador enlaza por \u003ccode>MOVIBAN\u003c/code> (salfec + tipopar + número) y marca esas partidas \u003ccode>source = 'bancos'\u003c/code> aunque \u003ccode>generado\u003c/code> esté vacío (excepción de migración); las partidas sin movimiento quedan como \u003ccode>importado\u003c/code>. Confirmar que ninguna partida de Bancos se editó legítimamente en CONTAC.","who":"","section":"D. Integración con el GL","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"BANCOC 15","group":"BANCOC","num":"15","title":"Clasificación de remesas","text":"\u003cstrong>Clasificación de remesas\u003c/strong> (\u003ccode>cfg_liqui\u003c/code>, \u003ccode>CLASIF\u003c/code>): apagada y vacía. \u003cem>Propuesta:\u003c/em> no migrar.","proposal":"no migrar.","who":"","section":"D. Integración con el GL","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":["P2"],"id":"BANCOC 16","group":"BANCOC","num":"16","title":"Editar desde CONTAC una partida generada por Bancos","text":"\u003cstrong>Editar desde CONTAC una partida generada por Bancos.\u003c/strong> Hoy se puede (por lo anterior) y por eso \u003ccode>DETABANK\u003c/code> y \u003ccode>DETAPART\u003c/code> difieren en el 8 % de las líneas. \u003cem>Propuesta:\u003c/em> prohibirlo (el GL rechaza editar partidas con \u003ccode>source = 'bancos'\u003c/code>); si hace falta corregir, se anula el documento o se hace un ajuste manual aparte.","proposal":"prohibirlo (el GL rechaza editar partidas con \u003ccode>source = 'bancos'\u003c/code>); si hace falta corregir, se anula el documento o se hace un ajuste manual aparte.","who":"","section":"D. Integración con el GL","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"BANCOC 17","group":"BANCOC","num":"17","title":"Remesa concentrada","text":"\u003cstrong>Remesa concentrada\u003c/strong> (\u003ccode>sbreme01\u003c/code>, \u003ccode>cgadipa2\u003c/code>): crea una partida directa y genera movimientos bancarios a partir de las líneas que tocan una cuenta de banco. \u003cem>Propuesta:\u003c/em> quitar esa pantalla; la remesa se captura como documento de depósito con varias contrapartidas, y los movimientos sin documento se vinculan a mano.","proposal":"quitar esa pantalla; la remesa se captura como documento de depósito con varias contrapartidas, y los movimientos sin documento se vinculan a mano.","who":"","section":"D. Integración con el GL","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":["Fase 1"],"id":"BANCOC 18","group":"BANCOC","num":"18","title":"Numeración de la partida","text":"\u003cstrong>Numeración de la partida:\u003c/strong> en el legado el número sale del mayor existente del mes (compartido con CONTAC). \u003cem>Propuesta:\u003c/em> pedirlo al GL (siguiente número por tipo y mes). ¿Alguien captura el número a mano para que coincida con un voucher físico? Si sí, se permite el cambio antes de aplicar.","proposal":"pedirlo al GL (siguiente número por tipo y mes). ¿Alguien captura el número a mano para que coincida con un voucher físico? Si sí, se permite el cambio antes de aplicar.","who":"","section":"D. Integración con el GL","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":["P8"],"id":"BANCOC 19","group":"BANCOC","num":"19","title":"Anular documento","text":"\u003cstrong>Anular documento.\u003c/strong> El legado conserva el documento y deja la partida con líneas en cero y el concepto &quot;ANULADO&quot;. \u003cem>Propuesta:\u003c/em> anular la partida (estado y número conservado). Los reportes de partidas emitidas deben mostrar la anulada con su número.","proposal":"anular la partida (estado y número conservado). Los reportes de partidas emitidas deben mostrar la anulada con su número.","who":"","section":"D. Integración con el GL","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"BANCOC 20","group":"BANCOC","num":"20","title":"\u003ccode>cfg_bancos\u003c/code>","text":"\u003cstrong>\u003ccode>cfg_bancos\u003c/code>\u003c/strong> (&quot;integración de correlativos con Bancos&quot;): su efecto está en \u003ccode>conta()\u003c/code>, que no está en el proyecto, y \u003ccode>TIPOPAR.BANCOS\u003c/code> es falso en todos los tipos. \u003cem>Propuesta:\u003c/em> eliminar (el GL siempre asigna el número).","proposal":"eliminar (el GL siempre asigna el número).","who":"","section":"D. Integración con el GL","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":["P2"],"id":"BANCOC 21","group":"BANCOC","num":"21","title":"Fuente de las partidas de CxP","text":"\u003cstrong>Fuente de las partidas de CxP.\u003c/strong> \u003ccode>GL_ENTRY_SOURCES\u003c/code> solo tiene \u003ccode>manual, bancos, iva, cierre, importado\u003c/code>. \u003cem>Propuesta:\u003c/em> agregar \u003ccode>cxp\u003c/code> (cambio pequeño en \u003ccode>modules/general-ledger\u003c/code> y \u003ccode>packages/shared\u003c/code>) para las provisiones; alternativa: publicarlas como \u003ccode>manual\u003c/code> (no recomendado: no quedarían bloqueadas).","proposal":"agregar \u003ccode>cxp\u003c/code> (cambio pequeño en \u003ccode>modules/general-ledger\u003c/code> y \u003ccode>packages/shared\u003c/code>) para las provisiones; alternativa: publicarlas como \u003ccode>manual\u003c/code> (no recomendado: no quedarían bloqueadas).","who":"","section":"D. Integración con el GL","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"BANCOC 22","group":"BANCOC","num":"22","title":"¿Se usa?","text":"\u003cstrong>¿Se usa?\u003c/strong> En los datos 0 de 2,691 movimientos están conciliados. El legado solo marca ítems y no captura el estado de cuenta. \u003cem>Propuesta:\u003c/em> pantalla de marcar + saldo del banco + diferencia, conciliación por mes con cierre. Importar el estado de cuenta (archivo del banco) queda como fase posterior; ¿qué bancos y formatos?","proposal":"pantalla de marcar + saldo del banco + diferencia, conciliación por mes con cierre. Importar el estado de cuenta (archivo del banco) queda como fase posterior; ¿qué bancos y formatos?","who":"","section":"E. Conciliación bancaria","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":["P4"],"id":"BANCOC 23","group":"BANCOC","num":"23","title":"IVA percibido","text":"\u003cstrong>IVA percibido\u003c/strong> usa la tasa \u003ccode>cfg_ivare\u003c/code> (la de retenido). ¿Es correcto o debería haber una tasa propia? \u003cem>Propuesta:\u003c/em> dos tasas separadas en la configuración, igual al valor actual por defecto.","proposal":"dos tasas separadas en la configuración, igual al valor actual por defecto.","who":"","section":"F. Impuestos y cuentas por pagar","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":["P5"],"id":"BANCOC 24","group":"BANCOC","num":"24","title":"Umbral de retención","text":"\u003cstrong>Umbral de retención.\u003c/strong> El código retiene \u003ccode>afecta × tasa\u003c/code> siempre que la empresa sea gran contribuyente, el proveedor no, y exista número de comprobante; no hay monto mínimo. ¿La ley exige un mínimo por documento? \u003cem>Propuesta:\u003c/em> campo configurable (hoy 0) y validación al capturar.","proposal":"campo configurable (hoy 0) y validación al capturar.","who":"","section":"F. Impuestos y cuentas por pagar","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"BANCOC 25","group":"BANCOC","num":"25","title":"Vencimiento al viernes","text":"\u003cstrong>Vencimiento al viernes.\u003c/strong> El sistema corre la fecha de vencimiento al viernes de esa semana (programación de pagos semanal). ¿Todos los clientes pagan en viernes? \u003cem>Propuesta:\u003c/em> mantenerlo como opción de la empresa (activa por defecto).","proposal":"mantenerlo como opción de la empresa (activa por defecto).","who":"","section":"F. Impuestos y cuentas por pagar","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":["P6"],"id":"BANCOC 26","group":"BANCOC","num":"26","title":"Granularidad de la provisión","text":"\u003cstrong>Granularidad de la provisión.\u003c/strong> Hoy se arma por documento y se junta en una partida por lote. ¿Se quiere una partida por documento? \u003cem>Propuesta:\u003c/em> ambas opciones; por lote por defecto (como hoy).","proposal":"ambas opciones; por lote por defecto (como hoy).","who":"","section":"F. Impuestos y cuentas por pagar","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":["Fase 1"],"id":"BANCOC 27","group":"BANCOC","num":"27","title":"Pagos parciales y manuales","text":"\u003cstrong>Pagos parciales y manuales.\u003c/strong> Se permiten pagos parciales y cancelaciones manuales sin documento bancario (\u003ccode>sbmfac03\u003c/code>). \u003cem>Propuesta:\u003c/em> mantener; los manuales deben generar su partida (hoy no la generan) o quedar como &quot;pago registrado por fuera&quot; con motivo obligatorio.","proposal":"mantener; los manuales deben generar su partida (hoy no la generan) o quedar como &quot;pago registrado por fuera&quot; con motivo obligatorio.","who":"","section":"F. Impuestos y cuentas por pagar","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":["P28"],"id":"BANCOC 28","group":"BANCOC","num":"28","title":"Tramos de antigüedad","text":"\u003cstrong>Tramos de antigüedad\u003c/strong> (≤ 0, 1–30, 31–60, 61–90, 91–120, ≥ 121 días desde el vencimiento): ¿se mantienen? \u003cem>Propuesta:\u003c/em> sí, configurables.","proposal":"sí, configurables.","who":"","section":"F. Impuestos y cuentas por pagar","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":["P23"],"id":"BANCOC 29","group":"BANCOC","num":"29","title":"Libro de compras y DTE","text":"\u003cstrong>Libro de compras y DTE.\u003c/strong> \u003ccode>sbmfac01\u003c/code> lee un JSON de DTE y manda el documento al libro de IVA. ¿Sigue siendo así (módulo \u003ccode>tax\u003c/code>)? \u003cem>Propuesta:\u003c/em> CxP guarda los datos del DTE; \u003ccode>tax\u003c/code> arma el libro a partir de los documentos.","proposal":"CxP guarda los datos del DTE; \u003ccode>tax\u003c/code> arma el libro a partir de los documentos.","who":"","section":"F. Impuestos y cuentas por pagar","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":["P9"],"id":"BANCOC 30","group":"BANCOC","num":"30","title":"Permisos y bitácora","text":"\u003cstrong>Permisos y bitácora.\u003c/strong> Hoy los documentos bancarios (emitir, modificar, anular, eliminar) \u003cstrong>no\u003c/strong> dejan bitácora y los permisos son por pantalla. \u003cem>Propuesta:\u003c/em> bitácora en todo; permisos \u003ccode>capture\u003c/code>/\u003ccode>reports\u003c/code>/\u003ccode>supervise\u003c/code> del manifiesto, con \u003ccode>supervise\u003c/code> para anular cheques impresos y para generar provisiones.","proposal":"bitácora en todo; permisos \u003ccode>capture\u003c/code>/\u003ccode>reports\u003c/code>/\u003ccode>supervise\u003c/code> del manifiesto, con \u003ccode>supervise\u003c/code> para anular cheques impresos y para generar provisiones.","who":"","section":"F. Impuestos y cuentas por pagar","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"BANCOC 31","group":"BANCOC","num":"31","title":"Formatos de impresión de cheque y de quedan","text":"\u003cstrong>Formatos de impresión de cheque y de quedan.\u003c/strong> Hay formatos por cuenta (\u003ccode>FORMACHK\u003c/code>) y por empresa (\u003ccode>cfg_formaq\u003c/code>) en reportes \u003ccode>.frx\u003c/code>. \u003cem>Propuesta:\u003c/em> un formato de cheque configurable por cuenta (posiciones) y un quedan estándar; levantar los formatos reales de cada cliente.","proposal":"un formato de cheque configurable por cuenta (posiciones) y un quedan estándar; levantar los formatos reales de cada cliente.","who":"","section":"G. Datos y operación","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"BANCOC 32","group":"BANCOC","num":"32","title":"Otros clientes","text":"\u003cstrong>Otros clientes.\u003c/strong> Solo hay una empresa y una carpeta de datos con ~27 meses de movimientos. No se ha revisado si otras instalaciones tienen cuentas en otra moneda, conciliaciones usadas, cheques a contratistas o CxP apagado. \u003cem>Propuesta:\u003c/em> correr la revisión de este spec contra cada cliente antes de importar.","proposal":"correr la revisión de este spec contra cada cliente antes de importar.","who":"","section":"G. Datos y operación","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"BANCOC 33","group":"BANCOC","num":"33","title":"Tolerancia de paridad","text":"\u003cstrong>Tolerancia de paridad.\u003c/strong> \u003ccode>CTABANCO.saldoact\u003c/code> se actualiza por varios caminos y puede no cuadrar con los movimientos. \u003cem>Propuesta:\u003c/em> la referencia es el saldo recalculado y el saldo de la cuenta contable en el GL; las diferencias contra \u003ccode>saldoact\u003c/code> se informan.","proposal":"la referencia es el saldo recalculado y el saldo de la cuenta contable en el GL; las diferencias contra \u003ccode>saldoact\u003c/code> se informan.","who":"","section":"G. Datos y operación","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"BANCOC 34","group":"BANCOC","num":"34","title":"Tablas de trabajo con datos","text":"\u003cstrong>Tablas de trabajo con datos\u003c/strong> (\u003ccode>PP\u003c/code>, \u003ccode>PP2\u003c/code>, \u003ccode>KK\u003c/code>, \u003ccode>SALVE\u003c/code>, \u003ccode>DTEMP*\u003c/code>/\u003ccode>PTEMP*\u003c/code>): parecen copias de seguridad de datos reales. \u003cem>Propuesta:\u003c/em> no migrar; confirmar que no contienen documentos que no existan en las tablas vivas.","proposal":"no migrar; confirmar que no contienen documentos que no existan en las tablas vivas.","who":"","section":"G. Datos y operación","status":"abierta","doc":"docs/legacy/bancoc/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/bancoc/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"IVA 802","group":"IVA","num":"802","title":"resúmenes diarios de consumidor final, 3 retenciones de renta). Las respuestas deben confirmarse con más clientes.","text":"resúmenes diarios de consumidor final, 3 retenciones de renta). Las respuestas deben confirmarse con más clientes. Donde una pregunta toca porcentajes, umbrales, códigos o formatos de Hacienda, la propuesta es \u003cstrong>la que hace el sistema anterior\u003c/strong> y debe \u003cstrong>verificarse contra la normativa y el instructivo vigentes\u003c/strong> antes de construir.","proposal":"","who":"","section":"","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P23"],"id":"IVA 1","group":"IVA","num":"1","title":"¿IVA64 queda como libro independiente o \u003ccode>tax\u003c/code> se alimenta siempre de los demás módulos?","text":"\u003cstrong>¿IVA64 queda como libro independiente o \u003ccode>tax\u003c/code> se alimenta siempre de los demás módulos?\u003c/strong> Hoy los documentos llegan por cuatro vías (captura, JSON de DTE, transferencia desde CxC/CxP/inventario, CSV) y la tabla no guarda el documento origen. \u003cem>Propuesta:\u003c/em> \u003ccode>tax\u003c/code> es la fuente de los libros legales; los documentos de CxC, CxP, Bancos e Inventario llegan por API/evento con \u003ccode>source_module\u003c/code> y \u003ccode>source_ref\u003c/code>; sigue existiendo la captura manual para lo que no pasa por otros módulos (gastos, importaciones, excluidos).","proposal":"\u003ccode>tax\u003c/code> es la fuente de los libros legales; los documentos de CxC, CxP, Bancos e Inventario llegan por API/evento con \u003ccode>source_module\u003c/code> y \u003ccode>source_ref\u003c/code>; sigue existiendo la captura manual para lo que no pasa por otros módulos (gastos, importaciones, excluidos).","who":"","section":"A. Alcance e integración con otros módulos","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":["Fase 3"],"id":"IVA 2","group":"IVA","num":"2","title":"Sincronización con CxC, CxP e inventario","text":"\u003cstrong>Sincronización con CxC, CxP e inventario.\u003c/strong> El sistema anterior borra y vuelve a traer todo el mes (y las dos fuentes de compras se pisan entre sí). \u003cem>Propuesta:\u003c/em> sincronización idempotente por documento, por fuente, sin borrar capturas manuales; los documentos de meses cerrados no se tocan. ¿Debe correr sola (cada vez que cambia el origen) o por botón a petición del usuario como hoy?","proposal":"sincronización idempotente por documento, por fuente, sin borrar capturas manuales; los documentos de meses cerrados no se tocan. ¿Debe correr sola (cada vez que cambia el origen) o por botón a petición del usuario como hoy?","who":"","section":"A. Alcance e integración con otros módulos","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"IVA 3","group":"IVA","num":"3","title":"Corrección al spec de Bancos","text":"\u003cstrong>Corrección al spec de Bancos.\u003c/strong> &quot;Ingresar al IVA&quot; (y &quot;Ingresar Renta&quot;) escribe en \u003ccode>COMPRAS\u003c/code>/\u003ccode>RENTAT\u003c/code> de la carpeta de IVA64 (por \u003ccode>CAMINOIVA\u003c/code>/\u003ccode>IVA\u003c/code> en \u003ccode>EMPRESAS\u003c/code>), no en \u003ccode>LIBCOMP\u003c/code>, que existe pero está \u003cstrong>vacía\u003c/strong> en CONTAC. \u003cem>Propuesta:\u003c/em> no migrar \u003ccode>LIBCOMP\u003c/code> ni \u003ccode>OFCOMPRA\u003c/code>; ¿algún cliente usa esa ruta vieja? Actualizar la sección 9.1 del spec de BANCOC cuando esto se confirme.","proposal":"no migrar \u003ccode>LIBCOMP\u003c/code> ni \u003ccode>OFCOMPRA\u003c/code>; ¿algún cliente usa esa ruta vieja? Actualizar la sección 9.1 del spec de BANCOC cuando esto se confirme.","who":"","section":"A. Alcance e integración con otros módulos","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":["Fase 3"],"id":"IVA 4","group":"IVA","num":"4","title":"¿Debe \u003ccode>tax\u003c/code> cuadrar con el IVA de la contabilidad?","text":"\u003cstrong>¿Debe \u003ccode>tax\u003c/code> cuadrar con el IVA de la contabilidad?\u003c/strong> IVA64 no postea ni lee el GL; las compras pueden no tener partida o tenerla con otro importe. \u003cem>Propuesta:\u003c/em> un reporte de conciliación (IVA del libro vs saldo de la cuenta de IVA crédito/débito fiscal por mes) como control, sin obligar a que coincidan.","proposal":"un reporte de conciliación (IVA del libro vs saldo de la cuenta de IVA crédito/débito fiscal por mes) como control, sin obligar a que coincidan.","who":"","section":"A. Alcance e integración con otros módulos","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"IVA 5","group":"IVA","num":"5","title":"Liquidación del IVA y declaración mensual","text":"\u003cstrong>Liquidación del IVA y declaración mensual.\u003c/strong> No existe en el módulo (ni F07, ni resumen de débito − crédito − retenciones − anticipos, ni asiento). El único cálculo de débito fiscal está en el pie de los libros de ventas. \u003cem>Propuesta:\u003c/em> la fase 1 reproduce exactamente lo que hay; la liquidación (con asiento al GL, \u003ccode>source = 'iva'\u003c/code>) queda como fase 2 si el negocio la pide.","proposal":"la fase 1 reproduce exactamente lo que hay; la liquidación (con asiento al GL, \u003ccode>source = 'iva'\u003c/code>) queda como fase 2 si el negocio la pide.","who":"","section":"A. Alcance e integración con otros módulos","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"IVA 6","group":"IVA","num":"6","title":"¿Una instalación = una empresa?","text":"\u003cstrong>¿Una instalación = una empresa?\u003c/strong> El sistema anterior trabaja una empresa por carpeta de datos y comparte la tasa de IVA entre todas. \u003cem>Propuesta:\u003c/em> \u003ccode>empresa_id\u003c/code> en todo, tasa por empresa; ¿hay clientes con varias empresas que consoliden libros?","proposal":"\u003ccode>empresa_id\u003c/code> en todo, tasa por empresa; ¿hay clientes con varias empresas que consoliden libros?","who":"","section":"A. Alcance e integración con otros módulos","status":"abierta","doc":"docs/legacy/iva64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/iva64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P5"],"id":"IVA 7
