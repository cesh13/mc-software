xistente?","who":"","section":"C. Bajas, ventas y movimientos del activo (no existen hoy)","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"AFIJO 16","group":"AFIJO","num":"16","title":"Traslados entre áreas o responsables","text":"\u003cstrong>Traslados entre áreas o responsables.\u003c/strong> Hoy solo se edita el campo, sin historial. \u003cem>Propuesta:\u003c/em> historial automático en la bitácora de auditoría (quién, cuándo, valor anterior y nuevo) y un reporte &quot;activos por responsable/área&quot;; tabla de traslados solo si el negocio lo pide.","proposal":"historial automático en la bitácora de auditoría (quién, cuándo, valor anterior y nuevo) y un reporte &quot;activos por responsable/área&quot;; tabla de traslados solo si el negocio lo pide.","who":"","section":"C. Bajas, ventas y movimientos del activo (no existen hoy)","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"AFIJO 17","group":"AFIJO","num":"17","title":"Alta con partida de compra","text":"\u003cstrong>Alta con partida de compra.\u003c/strong> La compra se contabiliza a mano en CONTAC (hay partidas que tocan las cuentas de activo). \u003cem>Propuesta:\u003c/em> fuera de alcance de la primera versión; después, &quot;contabilizar compra&quot; opcional desde el alta.","proposal":"fuera de alcance de la primera versión; después, &quot;contabilizar compra&quot; opcional desde el alta.","who":"","section":"C. Bajas, ventas y movimientos del activo (no existen hoy)","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"AFIJO 18","group":"AFIJO","num":"18","title":"Revaluaciones","text":"\u003cstrong>Revaluaciones.\u003c/strong> No existen. \u003cem>Propuesta:\u003c/em> no construir.","proposal":"no construir.","who":"","section":"C. Bajas, ventas y movimientos del activo (no existen hoy)","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P6"],"id":"AFIJO 19","group":"AFIJO","num":"19","title":"Tipo de partida y numeración","text":"\u003cstrong>Tipo de partida y numeración.\u003c/strong> El usuario teclea el tipo cada mes (en disco siempre el mismo) y el número se propone como último + 1 del mes. \u003cem>Propuesta:\u003c/em> un tipo configurado por empresa (\u003ccode>fa_settings.entry_type_id\u003c/code>), número asignado por el libro mayor.","proposal":"un tipo configurado por empresa (\u003ccode>fa_settings.entry_type_id\u003c/code>), número asignado por el libro mayor.","who":"","section":"D. Contabilidad","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P6"],"id":"AFIJO 20","group":"AFIJO","num":"20","title":"Líneas por activo vs agrupadas","text":"\u003cstrong>Líneas por activo vs agrupadas.\u003c/strong> El sistema escribe \u003cstrong>dos líneas por activo\u003c/strong> (hasta 280 líneas en una partida) con el código del activo en el detalle; la versión agrupada por cuenta está comentada. \u003cem>Propuesta:\u003c/em> agrupar por (cuenta de gasto, centro de costo) y (cuenta de depreciación acumulada), con el detalle por activo en el módulo; mismo total. Si el contador revisa la partida línea por línea, mantener &quot;una línea por activo&quot; (\u003ccode>post_mode = 'por_activo'\u003c/code>). ¿Cuál prefiere?","proposal":"agrupar por (cuenta de gasto, centro de costo) y (cuenta de depreciación acumulada), con el detalle por activo en el módulo; mismo total. Si el contador revisa la partida línea por línea, mantener &quot;una línea por activo&quot; (\u003ccode>post_mode = 'por_activo'\u003c/code>). ¿Cuál prefiere?","who":"","section":"D. Contabilidad","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P14"],"id":"AFIJO 21","group":"AFIJO","num":"21","title":"Partidas de 2023-01 y 2023-02","text":"\u003cstrong>Partidas de 2023-01 y 2023-02.\u003c/strong> Para esos dos meses, el cargo y el abono de la partida en CONTAC son \u003cstrong>el doble\u003c/strong> del total de la corrida de activo fijo, con unas 15 líneas manuales (tipo de movimiento 2) más cada una. Los otros 12 meses cuadran al centavo. ¿Se editaron a mano? ¿Se corrió dos veces? ¿El libro es el correcto y la corrida está subestimada, o al revés? \u003cem>Propuesta:\u003c/em> importar esas dos partidas como \u003ccode>importado\u003c/code> (no \u003ccode>activo_fijo\u003c/code>) y reportar la diferencia; no usarlas para la paridad hasta tener respuesta.","proposal":"importar esas dos partidas como \u003ccode>importado\u003c/code> (no \u003ccode>activo_fijo\u003c/code>) y reportar la diferencia; no usarlas para la paridad hasta tener respuesta.","who":"","section":"D. Contabilidad","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P26"],"id":"AFIJO 22","group":"AFIJO","num":"22","title":"Centro de costo en las líneas","text":"\u003cstrong>Centro de costo en las líneas.\u003c/strong> El cargo al gasto lleva el centro de costo contable del activo; el abono a depreciación acumulada \u003cstrong>no lleva ninguno\u003c/strong>. \u003cem>Propuesta:\u003c/em> mantener (el gasto es el que se analiza por centro de costo). ¿Se necesita en el abono?","proposal":"mantener (el gasto es el que se analiza por centro de costo). ¿Se necesita en el abono?","who":"","section":"D. Contabilidad","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P2"],"id":"AFIJO 23","group":"AFIJO","num":"23","title":"Edición manual y marca de origen","text":"\u003cstrong>Edición manual y marca de origen.\u003c/strong> CONTAC no distingue las partidas de activo fijo (\u003ccode>GENERADO = 0\u003c/code>, por un parámetro mal pasado) y las deja editar; el libro bloquea solo las de Bancos. \u003cem>Propuesta:\u003c/em> \u003ccode>source = 'activo_fijo'\u003c/code> y bloqueo de edición manual (solo anular la corrida desde el módulo, que revierte la partida). ¿Hay casos en que el contador necesita ajustar la partida a mano? Si sí, ¿cómo se concilia con la corrida?","proposal":"\u003ccode>source = 'activo_fijo'\u003c/code> y bloqueo de edición manual (solo anular la corrida desde el módulo, que revierte la partida). ¿Hay casos en que el contador necesita ajustar la partida a mano? Si sí, ¿cómo se concilia con la corrida?","who":"","section":"D. Contabilidad","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P26"],"id":"AFIJO 24","group":"AFIJO","num":"24","title":"Cuentas por categoría o por activo","text":"\u003cstrong>Cuentas por categoría o por activo.\u003c/strong> Hoy se capturan cuatro cuentas activo por activo (7 cuentas de activo, 7 de depreciación y 10 de gasto distintas en 143 activos). \u003cem>Propuesta:\u003c/em> cuentas por omisión en la categoría; el activo las copia y puede cambiarlas. Revisar con el contador la \u003cstrong>tabla categoría → cuentas\u003c/strong> que se deduce de los datos y que hoy no existe en ningún lado. Además: una de las cuentas de activo y una de las de depreciación acumulada están catalogadas como gasto; ¿es intencional?","proposal":"cuentas por omisión en la categoría; el activo las copia y puede cambiarlas. Revisar con el contador la \u003cstrong>tabla categoría → cuentas\u003c/strong> que se deduce de los datos y que hoy no existe en ningún lado. Además: una de las cuentas de activo y una de las de depreciación acumulada están catalogadas como gasto; ¿es intencional?","who":"","section":"E. Catálogos y estructura","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P26"],"id":"AFIJO 25","group":"AFIJO","num":"25","title":"Dos centros de costo","text":"\u003cstrong>Dos centros de costo.\u003c/strong> El módulo tiene un catálogo propio (\u003ccode>CCOSTOa\u003c/code>, 8; con un campo &quot;Dirección&quot;) y el activo además lleva el centro de costo contable de CONTAC (5). \u003cem>Propuesta:\u003c/em> llamarlos &quot;Área/Ubicación&quot; y &quot;Centro de costo&quot;, con el segundo ligado al libro. ¿Es correcta la lectura de &quot;área o ubicación física&quot;?","proposal":"llamarlos &quot;Área/Ubicación&quot; y &quot;Centro de costo&quot;, con el segundo ligado al libro. ¿Es correcta la lectura de &quot;área o ubicación física&quot;?","who":"","section":"E. Catálogos y estructura","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"AFIJO 26","group":"AFIJO","num":"26","title":"Responsables","text":"\u003cstrong>Responsables.\u003c/strong> Tabla propia con 30 personas, sin relación con la planilla. \u003cem>Propuesta:\u003c/em> mantener como &quot;responsables&quot; y enlazar con empleados de \u003ccode>payroll\u003c/code> cuando exista; no cargar empleados de planilla de golpe.","proposal":"mantener como &quot;responsables&quot; y enlazar con empleados de \u003ccode>payroll\u003c/code> cuando exista; no cargar empleados de planilla de golpe.","who":"","section":"E. Catálogos y estructura","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"AFIJO 27","group":"AFIJO","num":"27","title":"Proveedor","text":"\u003cstrong>Proveedor.\u003c/strong> Se toma del maestro de proveedores de CONTAC (128 de 128 válidos). \u003cem>Propuesta:\u003c/em> texto de referencia hasta que \u003ccode>accounts-payable\u003c/code> defina proveedores; luego llave foránea.","proposal":"texto de referencia hasta que \u003ccode>accounts-payable\u003c/code> defina proveedores; luego llave foránea.","who":"","section":"E. Catálogos y estructura","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"AFIJO 28","group":"AFIJO","num":"28","title":"Campos sin uso","text":"\u003cstrong>Campos sin uso.\u003c/strong> \u003ccode>FACTURA\u003c/code>, \u003ccode>DPREANUAL\u003c/code>, \u003ccode>VACTUAL\u003c/code>, \u003ccode>TDEPRE\u003c/code>, \u003ccode>DEPREACUM\u003c/code>, \u003ccode>EMPRESP\u003c/code>. \u003cem>Propuesta:\u003c/em> no migrar. ¿Debe haber número de factura de compra (hoy vacío)? Garantía es texto libre (3 llenas).","proposal":"no migrar. ¿Debe haber número de factura de compra (hoy vacío)? Garantía es texto libre (3 llenas).","who":"","section":"E. Catálogos y estructura","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"AFIJO 29","group":"AFIJO","num":"29","title":"Código del activo","text":"\u003cstrong>Código del activo.\u003c/strong> Texto de hasta 10 caracteres tecleado a mano (139 de 143 con la forma 6 letras + 3 dígitos, 4 con otras formas). \u003cem>Propuesta:\u003c/em> mantenerlo editable, único por empresa, con sugerencia del siguiente consecutivo por prefijo. ¿Qué significa el prefijo?","proposal":"mantenerlo editable, único por empresa, con sugerencia del siguiente consecutivo por prefijo. ¿Qué significa el prefijo?","who":"","section":"E. Catálogos y estructura","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P30"],"id":"AFIJO 30","group":"AFIJO","num":"30","title":"Reportes","text":"\u003cstrong>Reportes.\u003c/strong> Se conservan los cuatro (registro de activos, por cuenta contable, cuadro de activo fijo a una fecha, depreciaciones por rango de meses). Defectos a corregir: el filtro &quot;Todos los Activos&quot; ignora los rangos y trae solo los de tipo 2; el reporte &quot;por cuenta contable&quot; imprime con el diseño equivocado. \u003cem>Propuesta:\u003c/em> corregir; añadir \u003cstrong>conciliación contra el libro mayor\u003c/strong> (saldo de las cuentas de activo y depreciación acumulada vs módulo), calendario anual de depreciación por activo y reporte de activos totalmente depreciados. ¿Qué otros reportes exige el cliente o la autoridad (por ejemplo un anexo anual de activos)? \u003cstrong>[revisar contra la norma vigente]\u003c/strong>","proposal":"corregir; añadir \u003cstrong>conciliación contra el libro mayor\u003c/strong> (saldo de las cuentas de activo y depreciación acumulada vs módulo), calendario anual de depreciación por activo y reporte de activos totalmente depreciados. ¿Qué otros reportes exige el cliente o la autoridad (por ejemplo un anexo anual de activos)? \u003cstrong>[revisar contra la norma vigente]\u003c/strong>","who":"","section":"F. Reportes y operación","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P9"],"id":"AFIJO 31","group":"AFIJO","num":"31","title":"Permisos","text":"\u003cstrong>Permisos.\u003c/strong> Hoy cada pantalla se otorga por usuario. \u003cem>Propuesta:\u003c/em> \u003ccode>capture\u003c/code> para activos y catálogos, \u003ccode>supervise\u003c/code> para generar y anular la corrida, \u003ccode>reports\u003c/code> para reportes.","proposal":"\u003ccode>capture\u003c/code> para activos y catálogos, \u003ccode>supervise\u003c/code> para generar y anular la corrida, \u003ccode>reports\u003c/code> para reportes.","who":"","section":"F. Reportes y operación","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P8"],"id":"AFIJO 32","group":"AFIJO","num":"32","title":"Anulación de una corrida","text":"\u003cstrong>Anulación de una corrida.\u003c/strong> No existe en el menú (se borraban filas a mano). \u003cem>Propuesta:\u003c/em> solo la última corrida vigente y solo si el período está abierto; se anula la partida en el libro. ¿Quién puede (contador, no digitador)? ¿Hace falta motivo obligatorio?","proposal":"solo la última corrida vigente y solo si el período está abierto; se anula la partida en el libro. ¿Quién puede (contador, no digitador)? ¿Hace falta motivo obligatorio?","who":"","section":"F. Reportes y operación","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P7"],"id":"AFIJO 33","group":"AFIJO","num":"33","title":"Cierre","text":"\u003cstrong>Cierre.\u003c/strong> El módulo no cierra períodos; solo respeta el cierre de CONTAC. \u003cem>Propuesta:\u003c/em> igual: el período lo cierra el libro mayor y las corridas de un período cerrado se bloquean.","proposal":"igual: el período lo cierra el libro mayor y las corridas de un período cerrado se bloquean.","who":"","section":"F. Reportes y operación","status":"abierta","doc":"docs/legacy/afijo64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/afijo64/open-questions.md"},{"statusNote":"","date":"","usedBy":["Fase 6"],"id":"PLAN 1.1","group":"PLAN","num":"1.1","title":"¿Sigue en uso y quién más lo usa?","text":"\u003cstrong>¿Sigue en uso y quién más lo usa?\u003c/strong> La copia llega a 2023-07 (última quincena sin cerrar; archivos de ISSS hasta 2023-07). \u003cem>Propuesta:\u003c/em> migrar completo para el cliente actual y dejar los regímenes sin uso en la copia (IPFA, IVM, eventuales, honorarios, hora) detrás de pruebas con datos de otros clientes. ¿Qué otros clientes tienen planilla y de qué tipo?","proposal":"migrar completo para el cliente actual y dejar los regímenes sin uso en la copia (IPFA, IVM, eventuales, honorarios, hora) detrás de pruebas con datos de otros clientes. ¿Qué otros clientes tienen planilla y de qué tipo?","who":"","section":"1. Alcance y estructura","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["Fase 6"],"id":"PLAN 1.2","group":"PLAN","num":"1.2","title":"¿Qué hacemos con RR. HH.?","text":"\u003cstrong>¿Qué hacemos con RR. HH.?\u003c/strong> El menú mezcla planilla con contratos y finiquitos, capacitaciones, amonestaciones, permisos como trámite, asistencia diaria, horarios, premios por antigüedad, análisis de gasto por venta y cumpleaños. Casi todas las tablas están vacías o con 1–4 filas. \u003cem>Propuesta:\u003c/em> primera versión solo con lo que afecta el pago y los documentos de ley (constancias de salario y de trabajo, carta de recibo, boleta); lo demás como módulo posterior si algún cliente lo pide.","proposal":"primera versión solo con lo que afecta el pago y los documentos de ley (constancias de salario y de trabajo, carta de recibo, boleta); lo demás como módulo posterior si algún cliente lo pide.","who":"","section":"1. Alcance y estructura","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["Fase 6"],"id":"PLAN 1.3","group":"PLAN","num":"1.3","title":"Patronos","text":"\u003cstrong>Patronos.\u003c/strong> El sistema viejo permite varios patronos (\u003ccode>CODEMP\u003c/code>) en una base, cada uno con NIT y número patronal de ISSS. \u003cem>Propuesta:\u003c/em> un patrono = una \u003ccode>core_empresas\u003c/code>; el número patronal y NIT son datos de la empresa. ¿Algún cliente corre varios patronos con una sola planilla consolidada o con empleados que se trasladan entre ellos (\u003ccode>plmtremp\u003c/code>)?","proposal":"un patrono = una \u003ccode>core_empresas\u003c/code>; el número patronal y NIT son datos de la empresa. ¿Algún cliente corre varios patronos con una sola planilla consolidada o con empleados que se trasladan entre ellos (\u003ccode>plmtremp\u003c/code>)?","who":"","section":"1. Alcance y estructura","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P26","Fase 6"],"id":"PLAN 1.4","group":"PLAN","num":"1.4","title":"Centros de costo","text":"\u003cstrong>Centros de costo.\u003c/strong> Hay dos conceptos: \u003ccode>CCOSTOS\u003c/code> (C6, de planilla) y \u003ccode>ctacosto\u003c/code> del maestro (C3, el del libro mayor). \u003cem>Propuesta:\u003c/em> usar solo \u003ccode>gl_cost_centers\u003c/code>; en la migración, mapear cada \u003ccode>CCOSTO\u003c/code> de planilla a uno del libro mayor (el de \u003ccode>ctacosto\u003c/code> donde exista). ¿Cómo se relacionan hoy? ¿La división es un departamento o un centro de costo?","proposal":"usar solo \u003ccode>gl_cost_centers\u003c/code>; en la migración, mapear cada \u003ccode>CCOSTO\u003c/code> de planilla a uno del libro mayor (el de \u003ccode>ctacosto\u003c/code> donde exista). ¿Cómo se relacionan hoy? ¿La división es un departamento o un centro de costo?","who":"","section":"1. Alcance y estructura","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"PLAN 1.5","group":"PLAN","num":"1.5","title":"Tipos de pago","text":"\u003cstrong>Tipos de pago.\u003c/strong> Solo existen salario mensual (en quincenas) y por hora; no hay semanal, diario ni a destajo. \u003cem>Propuesta:\u003c/em> no construir los que no existen; ¿algún cliente necesita jornal diario o destajo?","proposal":"no construir los que no existen; ¿algún cliente necesita jornal diario o destajo?","who":"","section":"1. Alcance y estructura","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"PLAN 2.1","group":"PLAN","num":"2.1","title":"Copia consistente","text":"\u003cstrong>Copia consistente.\u003c/strong> Para la paridad de la contabilización (y de la renta acumulada) hace falta una copia de \u003ccode>CONTAC\u003c/code> del mismo cliente y fecha, con las partidas de planilla; en disco \u003ccode>plan64/dbf\u003c/code> no trae partidas. Hay además \u003ccode>DBFPLAN.RAR\u003c/code> y \u003ccode>DBFin.rar\u003c/code> en \u003ccode>plan64/dbf\u003c/code> que \u003cstrong>no se abrieron\u003c/strong>. \u003cem>Propuesta:\u003c/em> pedir la copia completa del cliente (planilla + contabilidad), una impresión de la planilla de ISSS y del F910/renta mensual de un mes cerrado y de una quincena de junio/diciembre, para comparar contra lo que el negocio considera correcto.","proposal":"pedir la copia completa del cliente (planilla + contabilidad), una impresión de la planilla de ISSS y del F910/renta mensual de un mes cerrado y de una quincena de junio/diciembre, para comparar contra lo que el negocio considera correcto.","who":"","section":"2. Datos y migración","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"PLAN 2.2","group":"PLAN","num":"2.2","title":"Historia a migrar","text":"\u003cstrong>Historia a migrar.\u003c/strong> La planilla en disco empieza en 2021-07. \u003cem>Propuesta:\u003c/em> importar las 48 quincenas como corridas cerradas de solo lectura, y como saldo inicial el acumulado de renta del año en curso (\u003ccode>RECORI\u003c/code>). ¿Se necesitan las de antes de 2021-07 (la carpeta \u003ccode>plan64\u003c/code> tiene archivos desde 1997)?","proposal":"importar las 48 quincenas como corridas cerradas de solo lectura, y como saldo inicial el acumulado de renta del año en curso (\u003ccode>RECORI\u003c/code>). ¿Se necesitan las de antes de 2021-07 (la carpeta \u003ccode>plan64\u003c/code> tiene archivos desde 1997)?","who":"","section":"2. Datos y migración","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P27"],"id":"PLAN 2.3","group":"PLAN","num":"2.3","title":"Filas sin código (33) y empleado huérfano (1) en \u003ccode>PLANILLA\u003c/code>","text":"\u003cstrong>Filas sin código (33) y empleado huérfano (1) en \u003ccode>PLANILLA\u003c/code>\u003c/strong>, 3 filas de \u003ccode>MAESTRO\u003c/code> en blanco y 2 filas cuyo neto no cuadra con ingresos − descuentos. \u003cem>Propuesta:\u003c/em> no importarlas y entregar el reporte de rechazos. ¿Qué eran?","proposal":"no importarlas y entregar el reporte de rechazos. ¿Qué eran?","who":"","section":"2. Datos y migración","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P16"],"id":"PLAN 2.4","group":"PLAN","num":"2.4","title":"Parámetros históricos","text":"\u003cstrong>Parámetros históricos.\u003c/strong> \u003ccode>CONFIG.MEM\u003c/code> guarda un solo juego de tasas y no tiene historial: no se puede saber con qué tasas se calculó cada quincena anterior. \u003cem>Propuesta:\u003c/em> las corridas importadas conservan sus importes; los parámetros se cargan desde la fecha de la primera corrida actual. ¿Hay documentos de los cambios de tasa (o los conoce el contador)?","proposal":"las corridas importadas conservan sus importes; los parámetros se cargan desde la fecha de la primera corrida actual. ¿Hay documentos de los cambios de tasa (o los conoce el contador)?","who":"","section":"2. Datos y migración","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"PLAN 2.5","group":"PLAN","num":"2.5","title":"Código de empleado","text":"\u003cstrong>Código de empleado.\u003c/strong> En comentarios del código el código de empleado parece un número de documento de identidad (o un correlativo corto). \u003cem>Propuesta:\u003c/em> en el sistema nuevo el código es un correlativo interno y el documento se guarda aparte, cifrado; se conserva el código viejo en una columna de origen para la importación y las búsquedas.","proposal":"en el sistema nuevo el código es un correlativo interno y el documento se guarda aparte, cifrado; se conserva el código viejo en una columna de origen para la importación y las búsquedas.","who":"","section":"2. Datos y migración","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P17"],"id":"PLAN 3.1","group":"PLAN","num":"3.1","title":"Topes y tablas por quincena o por mes","text":"\u003cstrong>Topes y tablas por quincena o por mes.\u003c/strong> El código multiplica por 2 los topes (\u003ccode>cfg_tope\u003c/code>, \u003ccode>cfg_ivm\u003c/code>, \u003ccode>cfg_max\u003c/code>, \u003ccode>cfg_ipfa\u003c/code>) y aplica la tabla de renta directamente a la base de \u003cstrong>cada quincena\u003c/strong> (\u003ccode>rentaag.prg\u003c/code> la duplica para un salario mensual), aunque la pantalla la llame &quot;Tabla de Renta Mensual&quot; [V][I]. \u003cem>Propuesta:\u003c/em> en el sistema nuevo guardar cada tabla y cada tope con su \u003cstrong>período\u003c/strong> (quincenal o mensual) explícito y convertir al importar. Hay que leer los valores de \u003ccode>CONFIG.MEM\u003c/code> con el contador para confirmar a qué período corresponden (no se hizo aquí por tratarse de datos del cliente).","proposal":"en el sistema nuevo guardar cada tabla y cada tope con su \u003cstrong>período\u003c/strong> (quincenal o mensual) explícito y convertir al importar. Hay que leer los valores de \u003ccode>CONFIG.MEM\u003c/code> con el contador para confirmar a qué período corresponden (no se hizo aquí por tratarse de datos del cliente).","who":"","section":"3. Cálculo de ISSS, pensiones y renta","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P17"],"id":"PLAN 3.2","group":"PLAN","num":"3.2","title":"Base de renta","text":"\u003cstrong>Base de renta.\u003c/strong> El código resta de la base ISSS, AFP e IVM del empleado pero \u003cstrong>no el FSV\u003c/strong> [V]; incluye vacaciones, incapacidad, horas extras e ingresos adicionales marcados como gravables, y el aguinaldo por encima del monto exento. \u003cem>Propuesta:\u003c/em> mantener y parametrizar por concepto; el contador confirma el tratamiento de cada uno.","proposal":"mantener y parametrizar por concepto; el contador confirma el tratamiento de cada uno.","who":"","section":"3. Cálculo de ISSS, pensiones y renta","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P17"],"id":"PLAN 3.3","group":"PLAN","num":"3.3","title":"Huecos entre tramos","text":"\u003cstrong>Huecos entre tramos.\u003c/strong> Los tramos se comparan con \u003ccode>≥ desde\u003c/code> y \u003ccode>≤ hasta\u003c/code> sobre una base \u003cstrong>sin redondear\u003c/strong>; con un hueco entre un máximo y el mínimo siguiente la retención sale 0 [I]. \u003cem>Propuesta:\u003c/em> validar al guardar la tabla que no haya huecos ni traslapes y calcular la renta sobre una base redondeada a centavos.","proposal":"validar al guardar la tabla que no haya huecos ni traslapes y calcular la renta sobre una base redondeada a centavos.","who":"","section":"3. Cálculo de ISSS, pensiones y renta","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P17"],"id":"PLAN 3.4","group":"PLAN","num":"3.4","title":"Regularización de junio y diciembre","text":"\u003cstrong>Regularización de junio y diciembre.\u003c/strong> En la 2.ª quincena de junio y de diciembre el cálculo usa otra tabla (1.er y 2.º semestre) con el acumulado del año (\u003ccode>RECORI\u003c/code>) y resta lo retenido; en diciembre resta además la renta del aguinaldo [V]. Hay inconsistencias de programación: en el tramo 7 se mezclan variables de tablas distintas [V]. \u003cem>Propuesta:\u003c/em> reemplazar por un \u003cstrong>ajuste anual explícito\u003c/strong> (acumulado del año − retenido), con la tabla vigente, y migrar \u003ccode>RECORI\u003c/code> como acumulado inicial. ¿Es esa la intención de negocio? ¿Qué se hace con empleados que entran a mitad de año o vienen de otro empleo (\u003ccode>INGRESOG\u003c/code>/\u003ccode>RENTAG\u003c/code>)?","proposal":"reemplazar por un \u003cstrong>ajuste anual explícito\u003c/strong> (acumulado del año − retenido), con la tabla vigente, y migrar \u003ccode>RECORI\u003c/code> como acumulado inicial. ¿Es esa la intención de negocio? ¿Qué se hace con empleados que entran a mitad de año o vienen de otro empleo (\u003ccode>INGRESOG\u003c/code>/\u003ccode>RENTAG\u003c/code>)?","who":"","section":"3. Cálculo de ISSS, pensiones y renta","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P16"],"id":"PLAN 3.5","group":"PLAN","num":"3.5","title":"¿Es \u003ccode>calcula.prg\u003c/code> la versión que cuadra con lo que se paga hoy?","text":"\u003cstrong>¿Es \u003ccode>calcula.prg\u003c/code> la versión que cuadra con lo que se paga hoy?\u003c/strong> En \u003ccode>fuente\u003c/code> hay varias versiones del cálculo (\u003ccode>calcula2\u003c/code>, \u003ccode>calculaold\u003c/code>, \u003ccode>calculaback\u003c/code>, \u003ccode>calcula09092025\u003c/code>, \u003ccode>rescalcula\u003c/code>) que no están en el proyecto. \u003cem>Propuesta:\u003c/em> comparar el resultado de \u003ccode>calcula.prg\u003c/code> con \u003ccode>PLANILLA\u003c/code> ya cerrada (las 48 quincenas) como primera prueba de paridad.","proposal":"comparar el resultado de \u003ccode>calcula.prg\u003c/code> con \u003ccode>PLANILLA\u003c/code> ya cerrada (las 48 quincenas) como primera prueba de paridad.","who":"","section":"3. Cálculo de ISSS, pensiones y renta","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"PLAN 3.6","group":"PLAN","num":"3.6","title":"INSAFORP","text":"\u003cstrong>INSAFORP.\u003c/strong> Se calcula como tasa patronal sobre la misma base y tope que el ISSS salud y entra en las provisiones contables; no hay umbral por número de empleados ni exenciones [V]. \u003cem>Propuesta:\u003c/em> que el contador confirme el umbral y la base; modelar como aporte patronal con vigencia.","proposal":"que el contador confirme el umbral y la base; modelar como aporte patronal con vigencia.","who":"","section":"3. Cálculo de ISSS, pensiones y renta","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"PLAN 3.7","group":"PLAN","num":"3.7","title":"Banderas con comportamiento dudoso","text":"\u003cstrong>Banderas con comportamiento dudoso.\u003c/strong> \u003ccode>NOAFP\u003c/code> (&quot;No calcular AFP&quot;) no tiene efecto; \u003ccode>NOISSS\u003c/code> solo desactiva ISSS e IVM; \u003ccode>PLAN_JUV\u003c/code> aplica un % a los ingresos; \u003ccode>SEGURO\u003c/code>/\u003ccode>SEG_FAM\u003c/code> se saltan julio [V]. \u003cem>Propuesta:\u003c/em> no migrar \u003ccode>NOAFP\u003c/code> (confirmar que nadie la usa); el resto como conceptos configurables. ¿Para qué es el salto de julio?","proposal":"no migrar \u003ccode>NOAFP\u003c/code> (confirmar que nadie la usa); el resto como conceptos configurables. ¿Para qué es el salto de julio?","who":"","section":"3. Cálculo de ISSS, pensiones y renta","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"PLAN 3.8","group":"PLAN","num":"3.8","title":"Regímenes IPFA e IVM","text":"\u003cstrong>Regímenes IPFA e IVM.\u003c/strong> Los casos \u003ccode>COTIZAR = 3\u003c/code> y \u003ccode>4\u003c/code> tienen fórmulas con topes mezclados [V]. \u003cem>Propuesta:\u003c/em> no implementarlos hasta que un cliente los necesite; documentar como &quot;por confirmar&quot;.","proposal":"no implementarlos hasta que un cliente los necesite; documentar como &quot;por confirmar&quot;.","who":"","section":"3. Cálculo de ISSS, pensiones y renta","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"PLAN 3.9","group":"PLAN","num":"3.9","title":"Redondeo","text":"\u003cstrong>Redondeo.\u003c/strong> El sistema viejo opera en coma flotante, redondea a 2 decimales en cada fórmula pero no en los intermedios (\u003ccode>ganado = salario/30 × días\u003c/code>) y trunca las tasas a 4 decimales de fracción [V]. \u003cem>Propuesta:\u003c/em> decimales exactos, redondeo &quot;mitad hacia arriba&quot; a centavos por concepto, y reportar cada diferencia de ±0.01 contra el histórico en vez de forzarla.","proposal":"decimales exactos, redondeo &quot;mitad hacia arriba&quot; a centavos por concepto, y reportar cada diferencia de ±0.01 contra el histórico en vez de forzarla.","who":"","section":"3. Cálculo de ISSS, pensiones y renta","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P18"],"id":"PLAN 4.1","group":"PLAN","num":"4.1","title":"Horas extras","text":"\u003cstrong>Horas extras.\u003c/strong> Seis clases con multiplicadores escritos en la pantalla (×2, ×2.5, ×1.5, ×1.75, ×2.0, ×2.5) y rótulos &quot;100 %/125 %/50 %/75 %&quot; que no coinciden con ellos; la hora ordinaria es salario/240 [V]. \u003cem>Propuesta:\u003c/em> un catálogo \u003ccode>pay_overtime_rates\u003c/code> con vigencia; que el cliente diga qué clases usa y cómo deben llamarse. Sin uso en la copia salvo 2 clases.","proposal":"un catálogo \u003ccode>pay_overtime_rates\u003c/code> con vigencia; que el cliente diga qué clases usa y cómo deben llamarse. Sin uso en la copia salvo 2 clases.","who":"","section":"4. Días, horas extras e incapacidad","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P18"],"id":"PLAN 4.2","group":"PLAN","num":"4.2","title":"Días de la 2.ª quincena para quien gana el mínimo","text":"\u003cstrong>Días de la 2.ª quincena para quien gana el mínimo.\u003c/strong> La generación (con \u003ccode>cfg_q\u003c/code>) da 16 / 14 / 12… días según el mes y la pantalla de días trabajados da 16 / 15 / 14 / 13 [V]. \u003cem>Propuesta:\u003c/em> un solo criterio parametrizado; ¿cuál es el correcto? ¿Y por qué solo quienes ganan \u003cstrong>exactamente\u003c/strong> el mínimo?","proposal":"un solo criterio parametrizado; ¿cuál es el correcto? ¿Y por qué solo quienes ganan \u003cstrong>exactamente\u003c/strong> el mínimo?","who":"","section":"4. Días, horas extras e incapacidad","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P18"],"id":"PLAN 4.3","group":"PLAN","num":"4.3","title":"Valor del día para incapacidad y permisos","text":"\u003cstrong>Valor del día para incapacidad y permisos.\u003c/strong> \u003ccode>dia = sueldo de la fila / 30\u003c/code>, pero esa fila trae el sueldo de \u003cstrong>15 días\u003c/strong>: el valor del día saldría a la mitad [I]. En la copia \u003ccode>REM_INCA\u003c/code> es 0 aunque hay 3 filas con días de incapacidad. \u003cem>Propuesta:\u003c/em> usar \u003ccode>salario mensual / 30\u003c/code>; ¿cómo se pagan hoy las incapacidades (ISSS, patrono, ambos)? ¿Se descuentan del sueldo?","proposal":"usar \u003ccode>salario mensual / 30\u003c/code>; ¿cómo se pagan hoy las incapacidades (ISSS, patrono, ambos)? ¿Se descuentan del sueldo?","who":"","section":"4. Días, horas extras e incapacidad","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"PLAN 4.4","group":"PLAN","num":"4.4","title":"Modo &quot;mensual&quot; (\u003ccode>cfg_q\u003c/code> falso)","text":"\u003cstrong>Modo &quot;mensual&quot; (\u003ccode>cfg_q\u003c/code> falso).\u003c/strong> La 1.ª quincena queda como anticipo de 15 días y la 2.ª paga el resto. \u003cem>Propuesta:\u003c/em> soportar \u003ccode>pay_frequency = mensual\u003c/code> con anticipo como concepto; ¿lo usa algún cliente?","proposal":"soportar \u003ccode>pay_frequency = mensual\u003c/code> con anticipo como concepto; ¿lo usa algún cliente?","who":"","section":"4. Días, horas extras e incapacidad","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"PLAN 4.5","group":"PLAN","num":"4.5","title":"Ausencias","text":"\u003cstrong>Ausencias.\u003c/strong> Descuento por días \u003ccode>salario/30 × días\u003c/code> y por minutos \u003ccode>salario/30/8/60 × minutos\u003c/code> [V]. ¿Los permisos con goce, suspensiones y retiros se tratan igual? ¿Quién autoriza?","proposal":"","who":"","section":"4. Días, horas extras e incapacidad","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P19"],"id":"PLAN 5.1","group":"PLAN","num":"5.1","title":"Vacaciones","text":"\u003cstrong>Vacaciones.\u003c/strong> Fórmulas distintas según se use \u003ccode>vacacion.prg\u003c/code> (salario/15 × días × %) o las pantallas de &quot;1 / 3 períodos&quot; (salario/30 × 7 × 30 %, pero se graban 15 días), con un % por defecto en \u003ccode>PORVACA.MEM\u003c/code> [V]. \u003cem>Propuesta:\u003c/em> un solo cálculo con prima parametrizada y vigencia; el contador define base (¿salario más promedio de comisiones?) y la regla de &quot;305 días&quot; para generar.","proposal":"un solo cálculo con prima parametrizada y vigencia; el contador define base (¿salario más promedio de comisiones?) y la regla de &quot;305 días&quot; para generar.","who":"","section":"5. Prestaciones","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P19"],"id":"PLAN 5.2","group":"PLAN","num":"5.2","title":"Aguinaldo","text":"\u003cstrong>Aguinaldo.\u003c/strong> Días por antigüedad (15 / 19 / 21), cálculo proporcional el primer año, fecha de corte 12 de diciembre y retención de procuraduría del 30 % para quienes tienen \u003ccode>PROCU\u003c/code> [V]. \u003cem>Propuesta:\u003c/em> todo parametrizado con vigencia (días por rango de años, fecha de corte, base); aguinaldo como corrida propia y su renta por la misma tabla que usa el sistema (¿con la tabla ×2?).","proposal":"todo parametrizado con vigencia (días por rango de años, fecha de corte, base); aguinaldo como corrida propia y su renta por la misma tabla que usa el sistema (¿con la tabla ×2?).","who":"","section":"5. Prestaciones","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P19"],"id":"PLAN 5.3","group":"PLAN","num":"5.3","title":"Recibos de honorarios","text":"\u003cstrong>Recibos de honorarios.\u003c/strong> Usan otros tramos de aguinaldo (10 / 15 / 18 / 21) y retención fija de 10 % [V]. \u003cem>Propuesta:\u003c/em> retención de honorarios configurable; confirmar los tramos de aguinaldo para honorarios con el contador.","proposal":"retención de honorarios configurable; confirmar los tramos de aguinaldo para honorarios con el contador.","who":"","section":"5. Prestaciones","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P19"],"id":"PLAN 5.4","group":"PLAN","num":"5.4","title":"Indemnización","text":"\u003cstrong>Indemnización.\u003c/strong> El código distingue retiro voluntario y otros, con 730 y 365 días, tope \u003ccode>cfg_maxi\u003c/code>, y mínimo de medio sueldo bajo un año; para vacación proporcional usa \u003ccode>(salario/2 × 1.30) × días/365\u003c/code> [V]. Hay estados de aprobación y pago en cuotas [V]. \u003cem>Propuesta:\u003c/em> modelar la liquidación con causa de terminación y fórmulas parametrizadas; que el contador revise cada fórmula antes de implementarla. ¿Siguen pagando en cuotas?","proposal":"modelar la liquidación con causa de terminación y fórmulas parametrizadas; que el contador revise cada fórmula antes de implementarla. ¿Siguen pagando en cuotas?","who":"","section":"5. Prestaciones","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P20"],"id":"PLAN 5.5","group":"PLAN","num":"5.5","title":"Provisiones mensuales de aguinaldo, vacaciones e indemnización","text":"\u003cstrong>Provisiones mensuales de aguinaldo, vacaciones e indemnización.\u003c/strong> El módulo no las calcula; las cuentas \u003ccode>CTAAGUI\u003c/code>, \u003ccode>CTAVACA\u003c/code>, \u003ccode>CTAINDEM\u003c/code> existen pero la partida de planilla no las usa [V]. \u003cem>Propuesta:\u003c/em> decidir si la nueva plataforma las contabiliza (cálculo mensual por empleado) o si se registran al pagar.","proposal":"decidir si la nueva plataforma las contabiliza (cálculo mensual por empleado) o si se registran al pagar.","who":"","section":"5. Prestaciones","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P19"],"id":"PLAN 5.6","group":"PLAN","num":"5.6","title":"Retención de procuraduría (30 %)","text":"\u003cstrong>Retención de procuraduría (30 %).\u003c/strong> Aplica a aguinaldo e indemnización de empleados marcados [V]. ¿Qué es exactamente y a quién aplica? ¿Hay otros embargos u órdenes de descuento (judiciales, pensión alimenticia, sindicato) que hoy se meten como &quot;otros descuentos&quot;?","proposal":"","who":"","section":"5. Prestaciones","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P9"],"id":"PLAN 6.1","group":"PLAN","num":"6.1","title":"Datos sensibles","text":"\u003cstrong>Datos sensibles.\u003c/strong> El sistema muestra salarios y datos personales a cualquiera con permiso a la pantalla. \u003cem>Propuesta:\u003c/em> permiso \u003ccode>payroll.salary\u003c/code> para ver sueldos y bitácora de lectura; datos de salud y beneficiarios fuera de la primera versión (o con permiso propio y cifrado de campo); documentos de identidad y cuentas bancarias cifrados.","proposal":"permiso \u003ccode>payroll.salary\u003c/code> para ver sueldos y bitácora de lectura; datos de salud y beneficiarios fuera de la primera versión (o con permiso propio y cifrado de campo); documentos de identidad y cuentas bancarias cifrados.","who":"","section":"6. Acceso y control","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P9"],"id":"PLAN 6.2","group":"PLAN","num":"6.2","title":"Llaves de autorización","text":"\u003cstrong>Llaves de autorización.\u003c/strong> Hay un esquema de dos llaves más autorización para descuentos, ingresos, aumentos, vacaciones e indemnización que \u003cstrong>el cálculo no exige\u003c/strong> [V]. \u003cem>Propuesta:\u003c/em> un solo paso de aprobación configurable por tipo de movimiento (\u003ccode>pay_approvals\u003c/code>), con quién y cuándo; ¿se usa realmente?","proposal":"un solo paso de aprobación configurable por tipo de movimiento (\u003ccode>pay_approvals\u003c/code>), con quién y cuándo; ¿se usa realmente?","who":"","section":"6. Acceso y control","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P7"],"id":"PLAN 6.3","group":"PLAN","num":"6.3","title":"Reapertura de una planilla cerrada","text":"\u003cstrong>Reapertura de una planilla cerrada.\u003c/strong> No existe en el sistema viejo. \u003cem>Propuesta:\u003c/em> corrida cerrada inmutable; correcciones por corrida de ajuste; reabrir solo con permiso de supervisor y bitácora.","proposal":"corrida cerrada inmutable; correcciones por corrida de ajuste; reabrir solo con permiso de supervisor y bitácora.","who":"","section":"6. Acceso y control","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P9"],"id":"PLAN 6.4","group":"PLAN","num":"6.4","title":"Permiso por pantalla","text":"\u003cstrong>Permiso por pantalla.\u003c/strong> Hoy es por usuario y pantalla, sin distinguir altas, cambios o cierres. \u003cem>Propuesta:\u003c/em> los permisos de plataforma (\u003ccode>capture\u003c/code>, \u003ccode>reports\u003c/code>, \u003ccode>supervise\u003c/code>) más \u003ccode>salary\u003c/code> y \u003ccode>close\u003c/code>; ¿quién debe poder calcular, cerrar, contabilizar y generar archivos oficiales?","proposal":"los permisos de plataforma (\u003ccode>capture\u003c/code>, \u003ccode>reports\u003c/code>, \u003ccode>supervise\u003c/code>) más \u003ccode>salary\u003c/code> y \u003ccode>close\u003c/code>; ¿quién debe poder calcular, cerrar, contabilizar y generar archivos oficiales?","who":"","section":"6. Acceso y control","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P2"],"id":"PLAN 7.1","group":"PLAN","num":"7.1","title":"¿Contabiliza algún cliente desde planilla?","text":"\u003cstrong>¿Contabiliza algún cliente desde planilla?\u003c/strong> En la copia no (ninguna cuenta configurada, sin partidas en \u003ccode>plan64\u003c/code>) [D]. \u003cem>Propuesta:\u003c/em> construir la publicación al libro mayor (contrato \u003ccode>source = 'nomina'\u003c/code>) con un mapa de cuentas por \u003cstrong>concepto × centro de costo × empresa\u003c/strong> en vez de cuentas por empleado.","proposal":"construir la publicación al libro mayor (contrato \u003ccode>source = 'nomina'\u003c/code>) con un mapa de cuentas por \u003cstrong>concepto × centro de costo × empresa\u003c/strong> en vez de cuentas por empleado.","who":"","section":"7. Contabilización","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P6"],"id":"PLAN 7.2","group":"PLAN","num":"7.2","title":"Frecuencia y granularidad","text":"\u003cstrong>Frecuencia y granularidad.\u003c/strong> Hoy una partida \u003cstrong>por mes\u003c/strong> con líneas por empleado, tipo y número digitados a mano, que se puede repetir y que borra la anterior [V]. \u003cem>Propuesta:\u003c/em> una partida por corrida cerrada (o por mes si se prefiere), con una línea por concepto y centro de costo (no por empleado, salvo que el negocio lo pida), y con el número asignado por el libro mayor. ¿Qué detalle espera el contador?","proposal":"una partida por corrida cerrada (o por mes si se prefiere), con una línea por concepto y centro de costo (no por empleado, salvo que el negocio lo pida), y con el número asignado por el libro mayor. ¿Qué detalle espera el contador?","who":"","section":"7. Contabilización","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P20"],"id":"PLAN 7.3","group":"PLAN","num":"7.3","title":"Cuadre","text":"\u003cstrong>Cuadre.\u003c/strong> La partida legada no incluye FSV, horas extras de cuatro clases, incapacidad, vacaciones \u003ccode>vac1/vac2\u003c/code>, aguinaldo, indemnización ni préstamos, y no se valida que cuadre [V]. \u003cem>Propuesta:\u003c/em> generar la partida desde las líneas de concepto (cuadra por construcción); ¿qué hace hoy el contador con las diferencias?","proposal":"generar la partida desde las líneas de concepto (cuadra por construcción); ¿qué hace hoy el contador con las diferencias?","who":"","section":"7. Contabilización","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P20"],"id":"PLAN 7.4","group":"PLAN","num":"7.4","title":"Provisiones patronales","text":"\u003cstrong>Provisiones patronales\u003c/strong> (ISSS, AFP, INSAFORP) sí se contabilizan con cuenta de gasto y de pasivo [V]. \u003cem>Propuesta:\u003c/em> mantenerlas por concepto; confirmar cuentas.","proposal":"mantenerlas por concepto; confirmar cuentas.","who":"","section":"7. Contabilización","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P20"],"id":"PLAN 7.5","group":"PLAN","num":"7.5","title":"Pago neto","text":"\u003cstrong>Pago neto.\u003c/strong> La partida acredita una sola cuenta (\u003ccode>ctag\u003c/code>) que el usuario digita. \u003cem>Propuesta:\u003c/em> cuenta por empresa (y por banco si hay varios), y si el pago pasa por Bancos, el módulo de Bancos hace el movimiento contra esa cuenta mediante contrato.","proposal":"cuenta por empresa (y por banco si hay varios), y si el pago pasa por Bancos, el módulo de Bancos hace el movimiento contra esa cuenta mediante contrato.","who":"","section":"7. Contabilización","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P29"],"id":"PLAN 8.1","group":"PLAN","num":"8.1","title":"Archivo de depósito","text":"\u003cstrong>Archivo de depósito.\u003c/strong> El sistema genera un Excel genérico (cuenta, nombre, neto, concepto, correo) y hay archivos de texto de ejemplo con \u003ccode>;\u003c/code> de formatos anteriores. \u003cem>Propuesta:\u003c/em> un exportador con formato configurable por banco; ¿qué bancos y qué layouts usa el cliente hoy? ¿Se paga con cheque en algún caso?","proposal":"un exportador con formato configurable por banco; ¿qué bancos y qué layouts usa el cliente hoy? ¿Se paga con cheque en algún caso?","who":"","section":"8. Salidas oficiales y bancarias","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P29"],"id":"PLAN 8.2","group":"PLAN","num":"8.2","title":"Planilla de ISSS","text":"\u003cstrong>Planilla de ISSS.\u003c/strong> Archivo ASCII de 102 posiciones con los campos descritos en \u003ca href=\"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/business-rules.md\" target=\"_blank\" rel=\"noopener\">business-rules §13.1\u003c/a>; los códigos de observación y el correlativo fijo \u003ccode>001\u003c/code> no están documentados en el código. \u003cem>Propuesta:\u003c/em> validar el layout contra el formato que hoy acepta el ISSS (y el portal vigente) antes de implementarlo; ¿qué códigos de observación se usan (\u003ccode>00\u003c/code>, \u003ccode>01\u003c/code>…)?","proposal":"validar el layout contra el formato que hoy acepta el ISSS (y el portal vigente) antes de implementarlo; ¿qué códigos de observación se usan (\u003ccode>00\u003c/code>, \u003ccode>01\u003c/code>…)?","who":"","section":"8. Salidas oficiales y bancarias","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P29"],"id":"PLAN 8.3","group":"PLAN","num":"8.3","title":"AFP","text":"\u003cstrong>AFP.\u003c/strong> El módulo vuelca a tablas de un sistema externo en \u003ccode>F:\\\u003c/code> y no genera un archivo de cotización propio [V]. \u003cem>Propuesta:\u003c/em> no migrar ese vuelco; ¿cómo declara hoy el cliente la planilla de AFP (portal, archivo, otro sistema)? Definir el layout vigente.","proposal":"no migrar ese vuelco; ¿cómo declara hoy el cliente la planilla de AFP (portal, archivo, otro sistema)? Definir el layout vigente.","who":"","section":"8. Salidas oficiales y bancarias","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P30"],"id":"PLAN 8.4","group":"PLAN","num":"8.4","title":"Reportes que se conservan","text":"\u003cstrong>Reportes que se conservan.\u003c/strong> Unos 50 reportes en el menú; algunos parecen de un solo cliente (vialidad, aseguradora, ventas, análisis de gastos de restaurantes). \u003cem>Propuesta:\u003c/em> migrar los de ley (ISSS, AFP, renta, constancias, boleta, planilla) y pedir al cliente la lista de los que sí usa.","proposal":"migrar los de ley (ISSS, AFP, renta, constancias, boleta, planilla) y pedir al cliente la lista de los que sí usa.","who":"","section":"8. Salidas oficiales y bancarias","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":["P29"],"id":"PLAN 8.5","group":"PLAN","num":"8.5","title":"F910 y renta mensual","text":"\u003cstrong>F910 y renta mensual.\u003c/strong> Los archivos usan códigos de tipo de renta (\u003ccode>01\u003c/code>, \u003ccode>11\u003c/code>, \u003ccode>33\u003c/code>, \u003ccode>60\u003c/code>, \u003ccode>70\u003c/code>) y de país \u003ccode>9300\u003c/code> escritos en el código, y un campo del F910 se llena con el valor equivocado (usa \u003ccode>cefafa\u003c/code> donde debe ir \u003ccode>iboni\u003c/code>) [V]. El layout de ancho fijo (750 posiciones) y las columnas del Excel pueden haber cambiado. \u003cem>Propuesta:\u003c/em> generar ambos desde el nuevo modelo con una versión de layout por año, validando contra el formato oficial vigente, y no replicar el error del campo de bonificaciones; ¿qué versión de F910 presenta el cliente hoy?","proposal":"generar ambos desde el nuevo modelo con una versión de layout por año, validando contra el formato oficial vigente, y no replicar el error del campo de bonificaciones; ¿qué versión de F910 presenta el cliente hoy?","who":"","section":"8. Salidas oficiales y bancarias","status":"abierta","doc":"docs/legacy/plan64/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/plan64/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 1","group":"DTE","num":"1","title":"¿Cuántas instalaciones hay y cuántas empresas por instalación?","text":"\u003cstrong>¿Cuántas instalaciones hay y cuántas empresas por instalación?\u003c/strong> La documentación no da un número; lo sabe el Monitor. \u003cem>Propuesta:\u003c/em> exportar \u003ccode>GET /api/instalaciones\u003c/code> (versión, normativa, ambiente) para planificar la migración por oleadas.","proposal":"exportar \u003ccode>GET /api/instalaciones\u003c/code> (versión, normativa, ambiente) para planificar la migración por oleadas.","who":"","section":"A. Negocio / operación","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 2","group":"DTE","num":"2","title":"¿Cuántos clientes siguen en normativa v1 y cuándo pasarán a v2?","text":"\u003cstrong>¿Cuántos clientes siguen en normativa v1 y cuándo pasarán a v2?\u003c/strong> El repositorio fija el 2026-12-01 como fecha de cumplimiento \u003cstrong>(norma)\u003c/strong>; hoy el cambio es manual por cliente. \u003cem>Propuesta:\u003c/em> confirmar fecha con la norma vigente y no iniciar la migración de clientes entre noviembre y enero.","proposal":"confirmar fecha con la norma vigente y no iniciar la migración de clientes entre noviembre y enero.","who":"","section":"A. Negocio / operación","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 3","group":"DTE","num":"3","title":"¿Quién opera las instalaciones?","text":"\u003cstrong>¿Quién opera las instalaciones?\u003c/strong> Si la máquina del cliente se apaga o el programa se cierra, no se factura. ¿Quién avisa? \u003cem>Propuesta:\u003c/em> en la plataforma nueva, proceso en servidor con supervisión.","proposal":"en la plataforma nueva, proceso en servidor con supervisión.","who":"","section":"A. Negocio / operación","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 4","group":"DTE","num":"4","title":"¿Hay clientes con varios establecimientos o puntos de venta?","text":"\u003cstrong>¿Hay clientes con varios establecimientos o puntos de venta?\u003c/strong> La solución soporta uno por instalación. \u003cem>Propuesta:\u003c/em> tabla \u003ccode>dte_establishments\u003c/code>.","proposal":"tabla \u003ccode>dte_establishments\u003c/code>.","who":"","section":"A. Negocio / operación","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 5","group":"DTE","num":"5","title":"¿Cómo se maneja una caída del MH o de Internet hoy?","text":"\u003cstrong>¿Cómo se maneja una caída del MH o de Internet hoy?\u003c/strong> No hay modo de contingencia; ¿se espera y se reintenta? ¿Alguna vez se emitió en contingencia \u003cstrong>(norma)\u003c/strong>? \u003cem>Propuesta:\u003c/em> decidir el requisito antes de diseñar el módulo.","proposal":"decidir el requisito antes de diseñar el módulo.","who":"","section":"A. Negocio / operación","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 6","group":"DTE","num":"6","title":"¿Qué ocurre cuando se invalida un documento con reemplazo?","text":"\u003cstrong>¿Qué ocurre cuando se invalida un documento con reemplazo?\u003c/strong> La solución no soporta tipos de anulación con documento de reemplazo. ¿Se necesitan? \u003cstrong>(norma)\u003c/strong>","proposal":"","who":"","section":"A. Negocio / operación","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 7","group":"DTE","num":"7","title":"¿Se necesitan 07/08/09/15, Retorno u Operaciones especiales?","text":"\u003cstrong>¿Se necesitan 07/08/09/15, Retorno u Operaciones especiales?\u003c/strong> Hay esquemas empaquetados sin constructor.","proposal":"","who":"","section":"A. Negocio / operación","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 8","group":"DTE","num":"8","title":"Plazos de invalidación","text":"\u003cstrong>Plazos de invalidación:\u003c/strong> no se validan. ¿Quién avisa al usuario? \u003cstrong>(norma)\u003c/strong>","proposal":"","who":"","section":"A. Negocio / operación","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 9","group":"DTE","num":"9","title":"Correo","text":"\u003cstrong>Correo:\u003c/strong> un error de SMTP es definitivo; ¿quién reenvía? ¿Se debe reintentar? \u003cem>Propuesta:\u003c/em> reintento con espera hasta 24 h.","proposal":"reintento con espera hasta 24 h.","who":"","section":"A. Negocio / operación","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 10","group":"DTE","num":"10","title":"¿INV64 reutiliza \u003ccode>NFACT_ENV\u003c/code> + \u003ccode>TIPODTE\u003c/code>?","text":"\u003cstrong>¿INV64 reutiliza \u003ccode>NFACT_ENV\u003c/code> + \u003ccode>TIPODTE\u003c/code>?\u003c/strong> La solución actualiza todas las filas con esa llave y avisa que «el ERP reutiliza \u003ccode>NFACT_ENV\u003c/code>». \u003cem>Propuesta:\u003c/em> revisar qué hace el botón «Enviar F.Electro» con filas viejas y qué número de control resulta.","proposal":"revisar qué hace el botón «Enviar F.Electro» con filas viejas y qué número de control resulta.","who":"","section":"B. Contrato técnico con INV64","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 11","group":"DTE","num":"11","title":"\u003ccode>NLINEAS\u003c/code>","text":"\u003cstrong>\u003ccode>NLINEAS\u003c/code>:\u003c/strong> ¿quién lo escribe y siempre coincide con el número de filas? Si no, el documento queda «Pendiente» para siempre sin aviso (hallazgo §2.15 abierto). \u003cem>Propuesta:\u003c/em> verificar en el código de INV64 (la tabla lo tiene [D]) y exigir aviso en la solución.","proposal":"verificar en el código de INV64 (la tabla lo tiene [D]) y exigir aviso en la solución.","who":"","section":"B. Contrato técnico con INV64","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 12","group":"DTE","num":"12","title":"Longitud de \u003ccode>NFACT_ENV\u003c/code>","text":"\u003cstrong>Longitud de \u003ccode>NFACT_ENV\u003c/code>:\u003c/strong> el número de control exige 10 caracteres. ¿Es siempre así en los seis tipos? ¿Los últimos 8 dígitos son únicos por tipo?","proposal":"","who":"","section":"B. Contrato técnico con INV64","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 13","group":"DTE","num":"13","title":"Importes","text":"\u003cstrong>Importes:\u003c/strong> la solución copia los importes sin recalcular; las diferencias de centavos de inv64 #11 viajan al MH. ¿Han provocado rechazos «CALCULO INCORRECTO»? \u003cem>Propuesta:\u003c/em> revisar rechazos históricos en \u003ccode>EnviosDTE\u003c/code>.","proposal":"revisar rechazos históricos en \u003ccode>EnviosDTE\u003c/code>.","who":"","section":"B. Contrato técnico con INV64","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 14","group":"DTE","num":"14","title":"\u003ccode>IVARETLIN\u003c/code>","text":"\u003cstrong>\u003ccode>IVARETLIN\u003c/code>:\u003c/strong> el ERP lo llena (la tabla de INV64 lo tiene); ¿se llena con el valor por línea correcto en 05/06 o siempre en 0 (la solución lo reparte desde 1.13.3)?","proposal":"","who":"","section":"B. Contrato técnico con INV64","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 15","group":"DTE","num":"15","title":"Motivo de rechazo","text":"\u003cstrong>Motivo de rechazo:\u003c/strong> el ERP solo ve \u003ccode>FALLO = 1\u003c/code>. ¿Cómo se entera el usuario de caja? \u003cem>Propuesta:\u003c/em> plataforma nueva muestra el motivo en la pantalla del documento.","proposal":"plataforma nueva muestra el motivo en la pantalla del documento.","who":"","section":"B. Contrato técnico con INV64","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 16","group":"DTE","num":"16","title":"Campos que la solución no escribe","text":"\u003cstrong>Campos que la solución no escribe\u003c/strong> (\u003ccode>INVALIDADA\u003c/code>, \u003ccode>NUMVALIDAC\u003c/code>, \u003ccode>FHPROCESAM\u003c/code>): ¿algún reporte del ERP o de IVA64 depende de ellos? Si es así, nunca funcionaron.","proposal":"","who":"","section":"B. Contrato técnico con INV64","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 17","group":"DTE","num":"17","title":"Muestra del repositorio más antigua","text":"\u003cstrong>Muestra del repositorio más antigua:\u003c/strong> la muestra de la solución tiene 134 campos y la de INV64 144. ¿Hay clientes con la estructura vieja (sin \u003ccode>NLINEAS\u003c/code>, \u003ccode>IVARETLIN\u003c/code>…)? Para ellos el código falla por columna faltante. \u003cem>Propuesta:\u003c/em> inventariar la estructura por cliente.","proposal":"inventariar la estructura por cliente.","who":"","section":"B. Contrato técnico con INV64","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 18","group":"DTE","num":"18","title":"Historial SQLite silencioso (hallazgo §2.1)","text":"\u003cstrong>Historial SQLite silencioso (hallazgo §2.1):\u003c/strong> una falla de escritura deja un DTE enviado sin registro. ¿Ha ocurrido? \u003cem>Propuesta:\u003c/em> corregir antes de migrar para no perder histórico.","proposal":"corregir antes de migrar para no perder histórico.","who":"","section":"C. Técnicas de la solución","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 19","group":"DTE","num":"19","title":"Recuperación tras tiempo de espera","text":"\u003cstrong>Recuperación tras tiempo de espera:\u003c/strong> se reintenta con UUID nuevo y mismo número de control → rechazo duplicado. \u003cem>Propuesta:\u003c/em> en la plataforma nueva, consultar al MH por número de control/código antes de reenviar y reutilizar el código de generación.","proposal":"en la plataforma nueva, consultar al MH por número de control/código antes de reenviar y reutilizar el código de generación.","who":"","section":"C. Técnicas de la solución","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 20","group":"DTE","num":"20","title":"¿Quién crea \u003ccode>EnviosDTE\u003c/code> en una instalación nueva del cliente WPF?","text":"\u003cstrong>¿Quién crea \u003ccode>EnviosDTE\u003c/code> en una instalación nueva del cliente WPF?\u003c/strong> El código solo agrega columnas; la base de partida viene del cliente WinForms.","proposal":"","who":"","section":"C. Técnicas de la solución","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 21","group":"DTE","num":"21","title":"Token por documento (hallazgo §5.1)","text":"\u003cstrong>Token por documento (hallazgo §5.1):\u003c/strong> ¿hubo limitaciones del MH (429) en lotes grandes? \u003cem>Propuesta:\u003c/em> caché por (NIT, ambiente) en la plataforma nueva.","proposal":"caché por (NIT, ambiente) en la plataforma nueva.","who":"","section":"C. Técnicas de la solución","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 22","group":"DTE","num":"22","title":"QR con salto de línea (hallazgo §2.4)","text":"\u003cstrong>QR con salto de línea (hallazgo §2.4):\u003c/strong> ¿el QR impreso de clientes reales escanea bien? Verificar con un teléfono antes de copiar la URL a la plataforma nueva. El ERP imprime ese PNG en el ticket (inv64).","proposal":"","who":"","section":"C. Técnicas de la solución","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 23","group":"DTE","num":"23","title":"Secretos en texto plano en \u003ccode>settings.json\u003c/code>","text":"\u003cstrong>Secretos en texto plano en \u003ccode>settings.json\u003c/code>:\u003c/strong> ¿se aceptará mantenerlos así hasta migrar? \u003cem>Propuesta:\u003c/em> cifrado por usuario de Windows o mover al almacén de secretos de la plataforma.","proposal":"cifrado por usuario de Windows o mover al almacén de secretos de la plataforma.","who":"","section":"C. Técnicas de la solución","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 24","group":"DTE","num":"24","title":"Ticket PDF (\u003ccode>-t.pdf\u003c/code>)","text":"\u003cstrong>Ticket PDF (\u003ccode>-t.pdf\u003c/code>):\u003c/strong> solo lo genera el cliente WinForms legado. ¿Algún cliente lo necesita desde el cliente WPF? (el ERP imprime su propio ticket con el PNG).","proposal":"","who":"","section":"C. Técnicas de la solución","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 25","group":"DTE","num":"25","title":"Cultura numérica","text":"\u003cstrong>Cultura numérica:\u003c/strong> los importes se leen con \u003ccode>decimal.TryParse\u003c/code> en la cultura de Windows de la máquina; ¿hay máquinas con configuración regional con coma decimal? Un importe mal leído viajaría mal. \u003cem>Propuesta:\u003c/em> leer con cultura invariante en la plataforma nueva.","proposal":"leer con cultura invariante en la plataforma nueva.","who":"","section":"C. Técnicas de la solución","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 26","group":"DTE","num":"26","title":"Rama v1 de la remisión (04) y PDF","text":"\u003cstrong>Rama v1 de la remisión (04) y PDF:\u003c/strong> ¿algún cliente la usa? Si no, la plataforma no la migra.","proposal":"","who":"","section":"C. Técnicas de la solución","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 27","group":"DTE","num":"27","title":"Alcance de pruebas","text":"\u003cstrong>Alcance de pruebas:\u003c/strong> ≈540 casos xUnit; falta confirmar qué tipos de v1 (no solo v2) tienen validación contra esquema.","proposal":"","who":"","section":"C. Técnicas de la solución","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"Marcada como decidida en el documento.","date":"","usedBy":[],"id":"DTE 28","group":"DTE","num":"28","title":"Plataforma a migrar vs repositorio en cambio","text":"\u003cstrong>Plataforma a migrar vs repositorio en cambio:\u003c/strong> el repositorio está en cambio activo por la normativa v2; \u003cstrong>Resuelta por la decisión del 2026-11-12:\u003c/strong> no se requiere ningún cambio en ese repositorio (ya no hay fuente alternativa).","proposal":"","who":"","section":"C. Técnicas de la solución","status":"respondida","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"","date":"","usedBy":[],"id":"DTE 29","group":"DTE","num":"29","title":"Numeración (propuesta adoptada en el diseño, 2026-11-12)","text":"\u003cstrong>Numeración (propuesta adoptada en el diseño, 2026-11-12):\u003c/strong> ¿correlativo propio (con piso en el último número del ERP) o conservar «últimos 8 dígitos del número de documento»? \u003cem>Propuesta:\u003c/em> correlativo propio por serie, asignado en transacción.","proposal":"correlativo propio por serie, asignado en transacción.","who":"","section":"D. Para la plataforma nueva","status":"abierta","doc":"docs/legacy/dte/open-questions.md","refs":[],"href":"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/legacy/dte/open-questions.md"},{"statusNote":"Marcada como decidida en el documento.","date":"","usedBy":[],"id":"DTE 30","group":"DTE","num":"30","title":"Fuente alternativa (opción b) vs módulo propio (opción d)","text":"\u003cstrong>Fuente alternativa (opción b) vs módulo propio (opción d):\u003c/strong> \u003cstrong>DECIDIDA el 2026-11-12 por el dueño:\u003c/strong> módulo propio nativo (d) desde la fase de facturación; la opción b (puente) se descarta y no se integra con la solución .NET. Ver \u003ca href=\"https://github.com/cesh13/mc-software/blob/claude/project-thread-6kxeso/docs/sistema/contratos.md#6-documento-tributario-electrónico-dte\" target=\"_blank\" rel=\"noopener\">contratos.md §6\u003c/a>."
