<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>MC Software</title>
<style>
  body { font-family: Segoe UI, sans-serif; margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; background: #f4f6fa; color: #1c2430; }
  .card { background: #fff; border-radius: 10px; padding: 36px 44px; max-width: 460px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { color: #5a6676; font-size: 14px; line-height: 1.5; margin: 6px 0; }
  code { background: #eef1f6; padding: 2px 6px; border-radius: 4px; }
  button { margin: 18px 6px 0; padding: 9px 18px; border: 0; border-radius: 6px; font-size: 14px; cursor: pointer; background: #e3e8f1; }
  button.primary { background: #2f6fed; color: #fff; }
</style>
</head>
<body>
  <div class="card">
    <h1>No se puede conectar con el servidor</h1>
    <p>No hubo respuesta de <code id="url"></code>.</p>
    <p>Verifique que la computadora servidor esté encendida con MC Software abierto y que esta computadora esté en la misma red.</p>
    <button id="retry" class="primary" type="button">Reintentar</button>
    <button id="change" type="button">Cambiar servidor</button>
  </div>
<script>
  document.getElementById('url').textContent = new URLSearchParams(location.search).get('url') || ''
  document.getElementById('retry').onclick = () => window.mc.retry()
  document.getElementById('change').onclick = () => window.mc.changeServer()
</script>
</body>
</html>
